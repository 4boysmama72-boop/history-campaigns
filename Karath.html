function go(screen) {
  state.screen = screen;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function progressDots(current) {
  return `<div class="progress-row">
    ${CHAPTERS.map((ch, i) => `<div class="prog-dot ${i < current ? 'done' : i === current ? 'active' : ''}"></div>`).join("")}
    <span class="prog-label">Chapter ${current + 1} of ${CHAPTERS.length}</span>
  </div>`;
}

function getSiteOutcome(siteId) {
  const site = GEO_SITES.find(s => s.id === siteId);
  if (siteId === "river") return site.outcome;
  const attempt = Math.min(state.geoAttempts, site.outcomes.length - 1);
  return site.outcomes[attempt];
}

// ══════════════════════════════════════════════════════════════
//  ACTIONS
// ══════════════════════════════════════════════════════════════

function chooseSite(siteId) {
  const outcome = getSiteOutcome(siteId);
  if (siteId !== "river") state.geoAttempts++;
  state.pendingOutcome = outcome;
  state.screen = "geo_outcome";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function retryGeo() {
  state.pendingOutcome = null;
  state.screen = "chapter";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function makeChoice(i) {
  const ch = CHAPTERS[state.chapterIndex];
  state.pendingOutcome = ch.choices[i];
  state.chapterOutcomes.push({ chapter: ch.id, choice: i });
  state.screen = "outcome";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function advanceChapter() {
  state.pendingOutcome = null;
  if (state.chapterIndex < CHAPTERS.length - 1) {
    state.chapterIndex++;
    state.screen = "chapter";
  } else {
    state.screen = "art_close";
  }
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function restart() {
  state = {
    screen: "art_open",
    chapterIndex: 0,
    geoAttempts: 0,
    pendingOutcome: null,
    chapterOutcomes: [],
  };
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ══════════════════════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════════════════════

function render() {
  const el = document.getElementById("content");
  const screens = {
    art_open:    screenArtOpen,
    role_card:   screenRoleCard,
    chapter:     screenChapter,
    geo_outcome: screenGeoOutcome,
    outcome:     screenOutcome,
    art_close:   screenArtClose,
    ending:      screenEnding,
  };
  el.innerHTML = (screens[state.screen] || (() => "<p>Loading...</p>"))();
}

render();
</script>
