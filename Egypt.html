<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ancient Egypt — The Story of Us</title>
<style>
  :root {
    --gold: #C4A000;
    --gold-light: #FFF8DC;
    --gold-mid: #E8C840;
    --sand: #F5E6C8;
    --sand-dark: #D4C090;
    --nile: #1A6B8A;
    --nile-light: #C8E8F5;
    --lapis: #1A3A6B;
    --lapis-light: #C8D4F0;
    --clay: #8B5A2B;
    --clay-light: #D4956A;
    --papyrus: #F0E0B0;
    --red: #8B2A2A;
    --red-light: #F5DCDC;
    --green: #2A6B3A;
    --green-light: #C8E8D0;
    --shadow: #0A0800;
    --ink: #1A1200;
    --stone: #5A5040;
    --stone-light: #E8E0D0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #0A0800;
    color: var(--sand);
    min-height: 100vh;
  }

  #app {
    max-width: 780px;
    margin: 0 auto;
    padding: 1.5rem 1.5rem 3rem;
  }

  /* ── Header ── */
  .site-header {
    text-align: center;
    padding: 1.5rem 1rem 1rem;
    border-bottom: 2px solid var(--gold);
    margin-bottom: 1.5rem;
    background: linear-gradient(180deg, rgba(196,160,0,0.08) 0%, transparent 100%);
  }
  .site-header .campaign-tag {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    font-family: Arial, sans-serif;
    margin-bottom: 6px;
  }
  .site-header h1 {
    font-size: 30px;
    font-weight: bold;
    color: var(--gold-mid);
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .site-header h2 {
    font-size: 14px;
    font-weight: normal;
    color: var(--sand-dark);
    font-family: Arial, sans-serif;
    font-style: italic;
  }

  /* ── Stats ── */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 1.25rem;
  }
  .stat-box {
    background: rgba(196,160,0,0.08);
    border: 1px solid rgba(196,160,0,0.3);
    border-radius: 6px;
    padding: 8px 10px;
    text-align: center;
  }
  .stat-icon { font-size: 16px; display: block; margin-bottom: 2px; }
  .stat-label { font-size: 10px; color: var(--gold); letter-spacing: 0.05em; text-transform: uppercase; font-family: Arial, sans-serif; }
  .stat-value { font-size: 18px; font-weight: bold; margin: 2px 0; }

  .stat-fill { height: 4px; border-radius: 2px; transition: width 0.5s, background 0.5s; }

    gap: 10px;
    background: rgba(196,160,0,0.08);
    border: 1px solid rgba(196,160,0,0.3);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 1.25rem;
  }
  .role-badge .rb-icon { font-size: 24px; }
  .role-badge .rb-name { font-size: 15px; font-weight: bold; color: var(--gold-mid); }
  .role-badge .rb-desc { font-size: 12px; color: var(--sand-dark); font-family: Arial, sans-serif; }

  /* ── Progress ── */
  .progress-row { display: flex; align-items: center; gap: 8px; margin-bottom: 1.25rem; }
  .prog-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(196,160,0,0.15); border: 1.5px solid rgba(196,160,0,0.3); }
  .prog-dot.active { background: var(--gold); border-color: var(--gold); }
  .prog-dot.done { background: var(--clay-light); border-color: var(--clay-light); }
  .prog-label { font-size: 11px; color: var(--sand-dark); font-family: Arial, sans-serif; }

    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-family: Arial, sans-serif;
    margin-bottom: 6px;
  }
  .screen-heading {
    font-size: 22px;
    font-weight: bold;
    color: var(--gold-mid);
    margin-bottom: 1rem;
    line-height: 1.3;
  }
  .scene-text {
    font-size: 15px;
    line-height: 1.85;
    color: var(--sand);
    margin-bottom: 1rem;
  }
  .role-context {
    background: rgba(196,160,0,0.1);
    border-left: 3px solid var(--gold);
    border-radius: 0 6px 6px 0;
    padding: 10px 14px;
    font-size: 14px;
    font-style: italic;
    color: var(--gold-light);
    margin-bottom: 1.25rem;
    line-height: 1.65;
    font-family: Arial, sans-serif;

    font-size: 13px;
    color: var(--nile-light);
    margin-bottom: 1.25rem;
    line-height: 1.65;
    font-family: Arial, sans-serif;
  }

  .journal-prompt {
    background: rgba(196,160,0,0.1);
    border-left: 3px solid var(--gold);
    border-radius: 0 6px 6px 0;
    padding: 12px 14px;
    font-size: 14px;
    color: var(--gold-light);
    margin-bottom: 1.25rem;
    line-height: 1.7;
    font-family: Arial, sans-serif;
  }
  .journal-prompt strong { color: #FFF8DC; font-weight: 600; }

    background: rgba(139,42,42,0.2);
    border-left: 3px solid var(--red);
    border-radius: 0 6px 6px 0;
    padding: 10px 14px;
    font-size: 13px;
    color: #F5C0C0;
    margin-bottom: 1.25rem;
    line-height: 1.65;
    font-family: Arial, sans-serif;
  }

  .choices-label {
    font-size: 11px;
    color: var(--sand-dark);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-family: Arial, sans-serif;
    margin-bottom: 8px;

    background: rgba(196,160,0,0.06);
    border: 1.5px solid rgba(196,160,0,0.25);
    border-radius: 8px;
    padding: 12px 16px;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s;
    font-family: Georgia, serif;
  }

  .choice-btn .choice-text { font-size: 14px; color: var(--sand); line-height: 1.5; }

    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 1.25rem;
    font-size: 14px;
    line-height: 1.7;
    font-family: Arial, sans-serif;

  .outcome-neutral { background: rgba(90,80,64,0.3); border: 1.5px solid var(--stone); color: var(--stone-light); }
  .outcome-poison { background: rgba(139,42,42,0.15); border: 1.5px solid #6B1A1A; color: #F0B0B0; }

  /* ── Art screens ── */
  .art-frame {
    border: 2px solid var(--gold);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 1.25rem;
    background: var(--shadow);
    box-shadow: 0 0 20px rgba(196,160,0,0.15);

  .art-frame img {
    width: 100%;
    display: block;
    max-height: 360px;
    object-fit: cover;
    object-position: center top;
  }
  .art-caption {
    padding: 8px 14px;
    font-size: 11px;
    color: var(--gold);
    font-family: Arial, sans-serif;
    font-style: italic;
    background: rgba(10,8,0,0.8);
    line-height: 1.5;

  .art-prompts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.25rem; }
  .art-prompt-box {
    background: rgba(196,160,0,0.08);
    border: 1px solid rgba(196,160,0,0.25);
    border-radius: 6px;
    padding: 10px 14px;
  }
  .art-prompt-box .apt-label { font-size: 11px; font-weight: bold; color: var(--gold); text-transform: uppercase; letter-spacing: 0.06em; font-family: Arial, sans-serif; margin-bottom: 4px; }
  .art-prompt-box .apt-q { font-size: 14px; color: var(--sand-dark); font-style: italic; }

  .role-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 1rem; }
  .role-card {
    background: rgba(196,160,0,0.06);
    border: 2px solid rgba(196,160,0,0.25);
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .role-card:hover { background: rgba(196,160,0,0.15); border-color: var(--gold); transform: translateY(-1px); }
  .role-card .rc-icon { font-size: 28px; margin-bottom: 6px; display: block; }
  .role-card .rc-name { font-size: 15px; font-weight: bold; color: var(--gold-mid); margin-bottom: 4px; }
  .role-card .rc-own { font-size: 12px; color: var(--sand-dark); font-family: Arial, sans-serif; line-height: 1.5; margin-bottom: 6px; }
  .role-card .rc-fear { font-size: 11px; color: #F0A080; font-family: Arial, sans-serif; font-style: italic; }

  /* ── Ending ── */
  .grapes-covered {
    background: rgba(196,160,0,0.08);
    border: 1px solid rgba(196,160,0,0.3);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 1.25rem;
  }
  .grapes-covered h4 { font-size: 12px; font-weight: bold; color: var(--gold); text-transform: uppercase; letter-spacing: 0.06em; font-family: Arial, sans-serif; margin-bottom: 10px; }
  .grapes-covered p { font-size: 13px; color: var(--sand-dark); line-height: 1.7; font-family: Arial, sans-serif; margin-bottom: 6px; }

  .discussion-questions {
    background: rgba(26,107,138,0.15);
    border: 1px solid var(--nile);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 1.25rem;
  }
  .discussion-questions h4 { font-size: 12px; font-weight: bold; color: var(--nile-light); text-transform: uppercase; letter-spacing: 0.06em; font-family: Arial, sans-serif; margin-bottom: 10px; }
  .discussion-questions p { font-size: 13px; color: #A8D8F0; line-height: 1.7; font-family: Arial, sans-serif; margin-bottom: 8px; }

  /* ── Buttons ── */
  .btn {
    background: var(--lapis);
    color: var(--sand);
    border: none;
    border-radius: 8px;
    padding: 11px 22px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    font-family: Arial, sans-serif;
    transition: background 0.15s;
    margin-right: 8px;
    margin-bottom: 8px;
  }
  .btn:hover { background: #0A2050; }
  .btn-gold { background: var(--gold); color: var(--shadow); }
  .btn-gold:hover { background: #A08000; }
  .btn-secondary {
    background: transparent;
    color: var(--gold);
    border: 1.5px solid var(--gold);
  }
  .btn-secondary:hover { background: rgba(196,160,0,0.1); }

  .divider { height: 1px; background: rgba(196,160,0,0.2); margin: 1.25rem 0; }

  @media (max-width: 500px) {
    .role-grid { grid-template-columns: 1fr; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>

        { text: "Ensure the workers are treated well enough that they will speak positively of the Pharaoh in their villages", hint: "Political management", outcome: "good", result: "Word spreads through the delta villages that the Pharaoh's construction project feeds workers better than harvest season. Applications to join the skilled workforce begin arriving. Egypt has accidentally created a labor market. The Pharaoh's divine reputation benefits from the way his Vizier treats ordinary people. You understand this connection better than most.", statChange: { food: 10, divine: 15, wealth: 5, standing: 20 } }

        { text: "Negotiate with the Vizier for the temple to receive a portion of the monument project's resources", hint: "Extract value from the project", outcome: "neutral", result: "The negotiation succeeds — partially. The temple receives fine stone for a new sanctuary. The Vizier receives the temple's formal blessing of the project. Both parties got something. Neither party is entirely satisfied. This is the nature of every negotiation between religious and administrative power in Egypt.", statChange: { food: 0, divine: 10, wealth: 20, standing: 5 } },

    nileNote: "<strong>Egypt and Nubia:</strong> Nubia (modern Sudan) sat directly upstream from Egypt on the Nile. The relationship was complex — trade partner, military target, and eventually part of the Egyptian empire. Nubia had gold that Egypt desperately needed for trade, tribute, and burial goods. Egypt had grain that Nubia needed. The Nile made this exchange possible in both directions.",

        { text: "Use the expedition to assess Nubian military capacity — gather intelligence alongside trade goods", hint: "Trade as reconnaissance", outcome: "neutral", result: "The intelligence is valuable. Nubia is stronger than the last assessment suggested. The military option is more expensive than it appeared. The trade relationship suddenly looks more attractive. Sometimes the most useful thing a diplomatic expedition can discover is why diplomacy is the better choice.", statChange: { food: 5, divine: 5, wealth: 10, standing: 10 } }

        { text: "Bless the expedition formally and declare it an act of divine will — Amun-Ra commands Egypt to receive what Nubia offers", hint: "Divine authorization of commerce", outcome: "good", result: "The divine framing is politically useful. The expedition is not exploitation — it is fulfillment of cosmic order. Ma'at requires that each thing occupy its proper place. Egypt's proper place, according to the priests, is at the top of that order. The expedition proceeds with full religious legitimacy. Whether the Nubians agree is a separate question.", statChange: { food: 5, divine: 15, wealth: 5, standing: 15 } },

        { text: "Offer food from your harvest stores to provision the expedition — build a relationship with the traders", hint: "Participate in the economy", outcome: "neutral", result: "The traders take your grain and dried fish at a fair price. The transaction is small but real. You have participated in the Nile's economy rather than merely watched it pass. The trader notes your name. Nothing may come of it. Or it might — in Egypt, as in every civilization, relationships are the foundation of economic opportunity.", statChange: { food: -5, divine: 0, wealth: 10, standing: 5 } },

        { text: "Create demonstration pieces to show what you could make with Nubian materials — attract the expedition's patronage", hint: "Create demand for your skills", outcome: "good", result: "The demonstration pieces are compelling. The expedition's organizers commission a set of ceremonial objects to be made from the materials they bring back. You have created your own market by showing people what they didn't know they wanted. This is how craftworkers build careers in any civilization.", statChange: { food: 5, divine: 5, wealth: 15, standing: 15 } },

    nileNote: "<strong>Hieroglyphics:</strong> Egyptian writing used more than 700 distinct symbols representing sounds, objects, and concepts. It required years of training to master and was controlled almost entirely by scribes trained in the per-ankh — the 'house of life' attached to temples. Unlike Mesopotamian cuneiform which was invented primarily for commerce, Egyptian hieroglyphics served religious and royal purposes first — making writing inseparable from divine and political power.",

    journalPrompt: "The Egyptian afterlife promised equality — everyone's heart was weighed against the same feather regardless of their social position. But the preparation for that judgment was deeply unequal. What does that contradiction tell you about Egyptian society?",

        { text: "Ensure the burial goods are properly inventoried — the estate will need to be administered after the mourning period", hint: "Administration over sentiment", outcome: "neutral", result: "The inventory is done. The estate is orderly. The family is slightly put off by your efficiency during their grief. You are not wrong that the estate needs managing. The timing of how you manage it reveals something about what you prioritize. Efficiency and compassion are both administrative virtues. Egypt's bureaucracy has always been better at the first than the second.", statChange: { food: 5, divine: 5, wealth: 10, standing: 5 } }
      ],

        { text: "Perform the rituals professionally but acknowledge privately that the poor family across the street cannot afford what you are providing — and do nothing about it", hint: "The system's inequality made visible", outcome: "neutral", result: "The wealthy receive the full ritual. The poor family's deceased gets the abbreviated version — simpler texts, no canopic jars, a less elaborate opening of the mouth. Both will face the same judgment in the Duat. Whether the quality of preparation affects the outcome is a theological question the priests have not fully resolved. You perform the expensive version with the knowledge that you are administering a two-tiered system. This knowledge is the weight you carry.", statChange: { food: 0, divine: 10, wealth: 15, standing: 5 }, poison: true },
        { text: "Quietly provide reduced-cost burial preparations to a poor family who cannot afford the full rites", hint: "Compassion within the system", outcome: "good", result: "The gesture costs the temple some revenue and earns you something harder to measure. The poor family's gratitude is real. Word spreads through the community that this priest sees the people rather than just the transactions. Your temple's reputation for genuine care, rather than just professional ritual, grows. Whether the gods notice, you will find out eventually.", statChange: { food: 5, divine: 20, wealth: -10, standing: 20 } }

        { text: "Borrow from neighbors to afford better burial preparations — the afterlife stakes are too high to economize", hint: "Debt for the dead", outcome: "bad", result: "The debt is taken on. The burial is better. The debt will take two harvest seasons to repay — if both harvests are good. If the Nile disappoints once in those two years, the debt becomes a crisis. You have made a rational decision within the belief system you inhabit. The economic consequences will arrive in the living world regardless of what happens in the Duat.", statChange: { food: -15, divine: 15, wealth: -20, standing: 5 } },
        { text: "Accept that you cannot match what the wealthy provide — trust that a good life weighs more than expensive preparations", hint: "Faith over resources", outcome: "neutral", result: "The simple burial is conducted with care and prayer. You tell yourself — and genuinely believe — that a life of honest work and fair dealing has prepared this heart better than gold and linen. Egyptian theology does not entirely contradict you. The feather of Ma'at weighs against deeds, not possessions. Whether the priests who administer the system agree with your interpretation is a different question.", statChange: { food: 0, divine: 15, wealth: 0, standing: 5 } }

        { text: "Use the burial commission to produce work that honors both the deceased and your craft — grief and professionalism together", hint: "Integrate grief into work", outcome: "good", result: "The work that emerges from this commission is the best of your career. Grief, when it flows into craft rather than away from it, produces objects that communicate something beyond technical skill. The priests who receive the burial goods notice. They ask who made them. Your name enters the temple's record of master craftworkers. The deceased, somehow, has advanced your career.", statChange: { food: 5, divine: 15, wealth: 10, standing: 20 } }

        { text: "Personalize the burial texts — add passages specific to this person's life and character", hint: "Humanity within tradition", outcome: "good", result: "The personalized passages are technically non-standard but ritually valid. The priests review and accept them. The family is moved to see their loved one's actual character reflected in the sacred texts rather than generic formulas. You have done something unusual for a scribe — made an official document that tells the truth about a specific human being.", statChange: { food: 5, divine: 15, wealth: 5, standing: 20 } },

        { text: "Maintain the appearance of divine order — announce that the Pharaoh has intervened with the gods and the flood will come", hint: "Manage perception", outcome: "bad", result: "The announcement buys two weeks. The flood does not come. The people who believed you are now hungrier and angrier than they were before. The Pharaoh's divine authority rests on the assumption that it functions. When it is revealed as performance, the damage is severe. Perception management works until reality arrives. Reality has arrived.", statChange: { food: -15, divine: -20, wealth: 0, standing: -25 }, poison: true },

        { text: "Appeal to the Vizier's office for emergency food distribution — the tax system should support farmers when the Nile fails", hint: "Use the system you paid into", outcome: "neutral", result: "The appeal is filed. The emergency distribution exists but is administered slowly and unevenly. You receive some support — less than you need, more than some neighbors. The system designed for this moment works imperfectly in the moment it is needed. This is true of every emergency system in every civilization. The question is whether imperfect support is better than no support. It is. Barely.", statChange: { food: 10, divine: 0, wealth: 0, standing: 5 }, poison: true },

      ],

        { text: "Provide accurate data to the Vizier and quietly inform a temple administrator about the worst-affected areas", hint: "Information to those who can act on it", outcome: "good", result: "The Vizier uses your accurate data to direct emergency distribution effectively. The temple administrator mobilizes temple grain stores to the areas you identified. Your information, flowing to two different power centers simultaneously, does more good than either could have done alone. This is the scribe's highest function — not just recording reality but helping the people who can change it understand it clearly.", statChange: { food: 10, divine: 10, wealth: 5, standing: 15 } }
      ],
      trader: [
        { text: "Import grain from the Levant and sell it at controlled prices — profit modestly, feed many", hint: "Trade as crisis solution", outcome: "good", result: "The Levantine grain arrives on your boats. You sell at a price that covers costs and a modest margin — enough to fund the operation but not enough to be called profiteering. The Vizier's office notices and formally acknowledges your contribution. You have demonstrated that trade networks, in a crisis, can move food faster than state bureaucracy. This insight will shape Egyptian trade policy for a generation.", statChange: { food: 20, divine: 10, wealth: 10, standing: 25 } },
        { text: "Import grain and sell at maximum market price — scarcity creates value and you have capital to deploy", hint: "Profit from crisis", outcome: "bad", result: "The profit is substantial. The reputation damage is permanent. In a society where the Pharaoh's divine authority rests partly on ensuring Egypt is fed, a trader who profits visibly from famine is a trader who has made an enemy of the administration and the temple simultaneously. The silver is real. The enemies are real. One of them will matter more to your future than the other.", statChange: { food: 10, divine: -15, wealth: 25, standing: -20 } },
        { text: "Use your trade network to identify where grain stores exist and share that information with the Vizier's office", hint: "Intelligence over profit", outcome: "good", result: "Your network knows things the state does not — where private hoards exist, which Levantine cities have surplus grain available, which Nubian chiefs might trade food for Egyptian goods. You share this intelligence without extracting maximum financial value from it. The Vizier's office distributes more effectively because of you. Your long-term relationship with the administration is worth more than the short-term profit you declined.", statChange: { food: 15, divine: 10, wealth: 5, standing: 20 } }
      ]
    }
  }
];

// ══════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════
let state = {
  screen: "art_open",
  role: null,
  chapterIndex: 0,
  pendingOutcome: null,
  stats: { food: 50, divine: 50, wealth: 50, standing: 50 },
};

// ══════════════════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════════════════
function go(s) { state.screen = s; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
function getRole() { return ROLES.find(r => r.id === state.role); }
function clamp(v) { return Math.max(0, Math.min(100, v)); }

function applyStats(change) {
  if (!change) return;
  for (let k in change) {
    if (state.stats[k] !== undefined) {
      state.stats[k] = clamp(state.stats[k] + change[k]);
    }
  }
}

function statColor(v) {
  if (v >= 60) return "#6ABF6A";
  if (v >= 35) return "#E8C840";
  return "#E05050";
}

function renderStats() {
  const defs = [
    { key: "food", label: "Food", icon: "🌾" },
    { key: "divine", label: "Divine Favor", icon: "𓂀" },
    { key: "wealth", label: "Wealth", icon: "⚖️" },
    { key: "standing", label: "Standing", icon: "𓋹" },
  ];
  return `<div class="stats-row">${defs.map(d => {
    const v = state.stats[d.key];
    return `<div class="stat-box">
      <span class="stat-icon">${d.icon}</span>
      <div class="stat-label">${d.label}</div>
      <div class="stat-value" style="color:${statColor(v)}">${Math.round(v)}</div>
      <div class="stat-track"><div class="stat-fill" style="width:${v}%;background:${statColor(v)}"></div></div>
    </div>`;
  }).join("")}</div>`;
}

function renderProgress() {
  const dots = CHAPTERS.map((c, i) =>
    `<div class="prog-dot ${i < state.chapterIndex ? 'done' : i === state.chapterIndex ? 'active' : ''}"></div>`
  ).join("");
  return `<div class="progress-row">${dots}<span class="prog-label">Chapter ${state.chapterIndex + 1} of ${CHAPTERS.length}</span></div>`;
}

function isDead() { return state.stats.food <= 0 || state.stats.divine <= 0; }

// ══════════════════════════════════════════════════════════════
//  SCREENS
// ══════════════════════════════════════════════════════════════

function screenArtOpen() {
  return `
    <div class="screen-label">Before we begin — look closely</div>
    <div class="screen-heading">The Weighing of the Heart</div>
    <div class="art-frame">
      <img src="https://upload.wikimedia.org/wikipedia/commons/e/ee/BD_Weighing_of_the_Heart.jpg"
           alt="The Weighing of the Heart — Egyptian Book of the Dead"
           onerror="this.style.display='none';document.getElementById('art-fallback').style.display='block'" />
      <div id="art-fallback" style="display:none;padding:2rem;text-align:center;color:var(--gold);font-family:Arial,sans-serif;font-size:13px">
        [The Weighing of the Heart — search "Book of the Dead Weighing Heart" to view]
      </div>
      <div class="art-caption">
        The Weighing of the Heart · Papyrus of Hunefer · c. 1275 BCE · New Kingdom Egypt<br>
        British Museum · Public Domain · One of the most important scenes in Egyptian religious art
      </div>
    </div>
    <div class="scene-text">This image was painted over 3,000 years ago. Before you begin your story in ancient Egypt, look at it carefully. Take 30 seconds of silence first. Then answer the three prompts in your field journal:</div>
    <div class="art-prompts">
      <div class="art-prompt-box">
        <div class="apt-label">Prompt 1</div>
        <div class="apt-q">One thing I find interesting...</div>
      </div>
      <div class="art-prompt-box">
        <div class="apt-label">Prompt 2</div>
        <div class="apt-q">One thing that puzzles me...</div>
      </div>
      <div class="art-prompt-box">
        <div class="apt-label">Prompt 3</div>
        <div class="apt-q">One question I have for the creator...</div>
      </div>
    </div>
    <div class="nile-note"><strong>Answer in your field journal.</strong> When your teacher gives the signal, continue.</div>
    <button class="btn btn-gold" onclick="go('role_select')">Enter ancient Egypt →</button>`;
}

function screenRoleSelect() {
  return `
    <div class="screen-label">Choose your role — your table decides together</div>
    <div class="screen-heading">Who are you in ancient Egypt?</div>
    <div class="scene-text">Every person at your table plays the same role. The same events will affect each role — but in completely different ways. Choose together.</div>
    <div class="role-grid">
      ${ROLES.map(r => `
        <div class="role-card" onclick="selectRole('${r.id}')">
          <span class="rc-icon">${r.icon}</span>
          <div class="rc-name">${r.name}</div>
          <div class="rc-own"><strong>You control:</strong> ${r.own}</div>
          <div class="rc-fear">⚠ You fear: ${r.fear}</div>
        </div>`).join("")}
    </div>`;
}

function screenChapter() {
  const ch = CHAPTERS[state.chapterIndex];
  const role = getRole();
  const choices = ch.choices[state.role];
  const isPoisonChapter = ch.poisonRoles.includes(state.role);

  return `
    ${renderProgress()}
    ${renderStats()}
    <div class="role-badge">
      <span class="rb-icon">${role.icon}</span>
      <div>
        <div class="rb-name">${role.name}</div>
        <div class="rb-desc">${role.desc}</div>
      </div>
    </div>
    <div class="screen-label">${ch.title}</div>
    <div class="screen-heading" style="font-size:18px">${ch.subtitle}</div>
    <div class="scene-text">${ch.scene}</div>
    <div class="role-context">${role.context[ch.id]}</div>
    ${isPoisonChapter ? `<div class="poison-pill-note">⚠ There may be no good option for your role in this chapter. Choose the least bad one — and think about why.</div>` : ""}
    <div class="nile-note">${ch.nileNote}</div>
    <div class="choices-label">Discuss with your table — then choose:</div>
    <div class="choices">
      ${choices.map((c, i) => `
        <button class="choice-btn" onclick="makeChoice(${i})">
          <div class="choice-text">${c.text}</div>
          <div class="choice-hint">${c.hint}</div>
        </button>`).join("")}
    </div>`;
}

function screenOutcome() {
  const ch = CHAPTERS[state.chapterIndex];
  const o = state.pendingOutcome;
  const outcomeClass = o.poison ? "outcome-poison" : `outcome-${o.outcome}`;
  const outcomeLabel = o.outcome === "good" ? "✓ What happened" : o.outcome === "bad" ? "✗ What happened" : o.poison ? "⚠ The impossible choice" : "→ What happened";

  return `
    ${renderProgress()}
    ${renderStats()}
    <div class="outcome-box ${outcomeClass}">
      <div class="outcome-label">${outcomeLabel}</div>
      ${o.result}
    </div>
    <div class="journal-prompt">
      <strong>✏ Field Journal Prompt —</strong> answer before your teacher signals to continue:<br><br>
      ${ch.journalPrompt}
    </div>
    <button class="btn btn-gold" onclick="advanceChapter()">
      ${state.chapterIndex < CHAPTERS.length - 1 ? 'Continue →' : 'See how your story ends →'}
    </button>`;
}

function screenGameOver() {
  return `
    <div style="text-align:center;padding:2rem 1rem">
      <div style="font-size:48px;margin-bottom:1rem">𓂀</div>
      <div class="screen-heading">Your story in Egypt ends here</div>
      ${renderStats()}
      <div class="nile-note" style="text-align:left;margin-bottom:1.25rem">
        ${state.stats.food <= 0
          ? "Your family's food stores are gone. In ancient Egypt, as in every civilization, survival depends on the most basic resource. Without food, nothing else — not divine favor, not wealth, not social standing — can sustain you."
          : "You have lost the favor of the gods — which in Egypt means you have lost the favor of the Pharaoh, the priests, and every institution that makes Egyptian society function. In a civilization where the Pharaoh is a living god, being outside divine favor means being outside society itself."}
      </div>
      <div class="journal-prompt" style="text-align:left">What does a 'game over' in Egypt teach us about what this civilization depended on most?</div>
      <br>
      <button class="btn btn-gold" onclick="restart()">Start again as a different role</button>
    </div>`;
}

function screenArtClose() {
  return `
    <div class="screen-label">Closing — one more image</div>
    <div class="screen-heading">Abu Simbel<br><span style="font-size:16px;color:var(--clay-light)">Built by Rameses II · c. 1264 BCE</span></div>
    <div class="art-frame">
      <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Abu_Simbel_great_temple_03.jpg"
           alt="Abu Simbel Great Temple — four colossal statues of Rameses II"
           onerror="this.style.display='none';document.getElementById('abu-fallback').style.display='block'" />
      <div id="abu-fallback" style="display:none;padding:2rem;text-align:center;color:var(--gold);font-family:Arial,sans-serif;font-size:13px">
        [Abu Simbel Great Temple — search "Abu Simbel Rameses II" to view]
      </div>
      <div class="art-caption">
        Great Temple of Rameses II · Abu Simbel, Nubia (modern Sudan) · c. 1264 BCE<br>
        Four colossal statues of Rameses II, each 20 meters tall · Carved directly into the cliff face<br>
        UNESCO World Heritage Site · Public Domain
      </div>
    </div>
    <div class="scene-text">You opened this campaign looking at a papyrus painting of the afterlife — intricate, personal, human-scaled. Now you are looking at four statues twenty meters tall, carved into a cliff in Nubia, built to be seen by anyone approaching Egypt from the south. Use your three prompts in your field journal:</div>
    <div class="art-prompts">
      <div class="art-prompt-box">
        <div class="apt-label">Prompt 1</div>
        <div class="apt-q">One thing I find interesting...</div>
      </div>
      <div class="art-prompt-box">
        <div class="apt-label">Prompt 2</div>
        <div class="apt-q">One thing that puzzles me...</div>
      </div>
      <div class="art-prompt-box">
        <div class="apt-label">Prompt 3</div>
        <div class="apt-q">One question I have for the creator...</div>
      </div>
    </div>
    <div class="journal-prompt">
      <strong>Year-long comparison question:</strong> You opened this campaign with a painting made on papyrus. You are closing it with statues carved into a cliff face in another country. How does this artwork feel different from the cave paintings you saw at the start of the year — and what does that difference tell you about what changed between the Stone Age and ancient Egypt?
    </div>
    <button class="btn btn-gold" onclick="go('ending')">See what your story revealed →</button>`;
}

function screenEnding() {
  const role = getRole();
  const avg = Math.round(Object.values(state.stats).reduce((a, b) => a + b, 0) / 4);
  let verdict, verdictText;

  if (avg >= 65) {
    verdict = `${role.name} — Your place in Egypt is secure`;
    verdictText = "Your choices aligned with the systems and values of ancient Egyptian civilization. You understood that Egypt was built on the Nile, organized around the Pharaoh, and sustained by the labor and faith of millions of people who rarely appear in the official records.";
  } else if (avg >= 45) {
    verdict = `${role.name} — Your story is Egypt's story`;
    verdictText = "You survived — which is what most Egyptians did. Not triumph, not catastrophe, but the daily navigation of a civilization built on a river that gave and took away without asking permission. This is the life most ancient Egyptians actually lived.";
  } else {
    verdict = `${role.name} — Egypt's systems were not designed for your survival`;
    verdictText = "The Egyptian system functioned beautifully for some and brutally for others. Your story raises the question every student of history must ask: when we call a civilization great, who exactly do we mean?";
  }

  return `
    <div class="screen-label">End of the Egypt Campaign</div>
    <div class="screen-heading" style="font-size:20px">${verdict}</div>
    ${renderStats()}
    <div class="scene-text">${verdictText}</div>

    <div class="grapes-covered">
      <h4>What this campaign covered</h4>
      <p><strong>Geography:</strong> The Nile's annual flood — Akhet, Peret, Shemu — shaped every aspect of Egyptian life from taxation to religion to the construction calendar.</p>
      <p><strong>Achievements:</strong> Pyramid construction, hieroglyphics, the Nilometer, irrigation and flood management, the Egyptian calendar.</p>
      <p><strong>Religion:</strong> The Pharaoh as living god, the weighing of the heart, the Duat, Ma'at, the temple's economic and spiritual power.</p>
      <p><strong>Economics:</strong> The Nile as trade highway, the Nubian gold trade, the tributary relationship, grain as currency and survival.</p>
      <p><strong>Social Structure:</strong> The Pharaoh and Vizier at the top, priests and scribes with literacy-based power, craftworkers in the middle, farmers bearing the weight of everything.</p>
    </div>

    <div class="discussion-questions">
      <h4>Class Discussion Questions</h4>
      <p>1. In Mesopotamia, the flood was a threat. In Egypt, it was a gift. How did that difference shape everything else about these two civilizations?</p>
      <p>2. Which role had the most power in Egypt — and which had the least? Were those the same as in Mesopotamia?</p>
      <p>3. The afterlife system promised equality — everyone's heart weighed the same way. But preparation for death was deeply unequal. What does that contradiction tell you about Egyptian society?</p>
      <p>4. The farmer experienced almost every chapter as a poison pill — limited choices, bad outcomes regardless. What does that tell you about who built Egypt and who benefited from it?</p>
      <p>5. When the flood failed, every GRAPES category was affected. Which one do you think collapsed first — and which held longest?</p>
    </div>

    <button class="btn btn-gold" onclick="restart()">Play again as a different role</button>
    <button class="btn btn-secondary" onclick="restart()">Return to start</button>`;
}

// ══════════════════════════════════════════════════════════════
//  ACTIONS
// ══════════════════════════════════════════════════════════════
function selectRole(id) {
  state.role = id;
  state.chapterIndex = 0;
  go("chapter");
}

function makeChoice(i) {
  const ch = CHAPTERS[state.chapterIndex];
  const choice = ch.choices[state.role][i];
  applyStats(choice.statChange);
  state.pendingOutcome = choice;
  if (isDead()) { go("gameover"); return; }
  go("outcome");
}

function advanceChapter() {
  state.pendingOutcome = null;
  if (state.chapterIndex < CHAPTERS.length - 1) {
    state.chapterIndex++;
    go("chapter");
  } else {
    go("art_close");
  }
}

function restart() {
  state = {
    screen: "art_open",
    role: null,
    chapterIndex: 0,
    pendingOutcome: null,
    stats: { food: 50, divine: 50, wealth: 50, standing: 50 },
  };
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ══════════════════════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════════════════════
function render() {
  const el = document.getElementById("content");
  const screens = {
    art_open:    screenArtOpen,
    role_select: screenRoleSelect,
    chapter:     screenChapter,
    outcome:     screenOutcome,
    gameover:    screenGameOver,
    art_close:   screenArtClose,
    ending:      screenEnding,
  };
  el.innerHTML = (screens[state.screen] || (() => "<p>Loading...</p>"))();
}

render();
</script>
</body>
</html>
