<body>
<div id="app">
  <div class="site-header">
    <div class="campaign-tag">The Story of Us · Campaign 8 · Final Campaign</div>
    <h1>THE RENAISSANCE & REFORMATION</h1>
    <h2>What Happens When People Start Asking Questions? · c. 1350 – 1700 CE</h2>
  </div>
  <div id="content"></div>
</div>
<script>
const ROLES = [
  { id:"patron", name:"Italian Merchant / Medici Patron", icon:"💰",
    desc:"You are one of the wealthy merchant families of Florence or Venice whose money funds the Renaissance. Art, scholarship, and architecture exist because you pay for them.",
    own:"Enormous wealth from banking and trade, the political influence that wealth brings, and the taste to know what excellence looks like.",
    fear:"A Church that condemns wealth as sinful. Political rivals who use your patronage against you. A world where merchants are not respected as the creators of civilization they actually are.",
    want:"Beautiful things made by the best artists. A city that reflects the glory of the family name. A legacy that outlasts the money.",
    ctx:{ ch1:"Florence is the center of the world right now — at least it feels that way. The Medici banking network stretches from London to Constantinople. The wealth flowing through this city is funding something new: a systematic rediscovery of ancient Greek and Roman learning that is changing how educated people think about everything.",
      ch2:"You are the reason this art exists. Botticelli, Brunelleschi, Ghiberti — none of them could work without patrons like you. The investment you make in art is simultaneously a spiritual act, a political statement, and a commercial one. Beautiful cities attract commerce. Beautiful cities demonstrate power. Beautiful cities outlast their builders.",
      ch3:"The printing press is changing your world in ways you are only beginning to understand. Information that previously required your wealth to access — rare manuscripts, classical texts — is now available to anyone who can read. The democratization of knowledge is good for humanity. It is complicated for the people who previously controlled access to it.",
      ch4:"The Reformation is directly threatening the commercial networks your family built across Europe. When Luther's ideas split Christianity, they split trading relationships, banking connections, and diplomatic arrangements that took generations to build. Religious conflict is also economic conflict.",
      ch5:"The Counter-Reformation's new energy — the Jesuits, the reformed Church — is creating new opportunities for patronage. The Catholic Church is commissioning extraordinary art to demonstrate its authority and beauty. Your wealth can serve the renewed Church as it served the pre-Reformation one.",
      ch6:"Your legacy is the question. The Medici family funded Michelangelo, Leonardo, Botticelli, and Galileo. The world was changed by what your money made possible. Whether the world remembers the patrons or only the artists is a question every generation of Medici has answered differently." }
  },
  { id:"artist", name:"Renaissance Artist", icon:"🎨",
    desc:"You are an artist working in the new Renaissance tradition — learning anatomy, perspective, and the classical models that are transforming what art can do.",
    own:"Technical skill developed through years of apprenticeship, the ability to see the world more precisely than anyone around you, and the growing conviction that human beauty is worth depicting.",
    fear:"A patron who controls what you can create. A Church that condemns your interest in the human body as indecent. The possibility that your greatest work will be attributed to someone else.",
    want:"The freedom to pursue perfection — in anatomy, in perspective, in the expression of the human face at its most alive. To make something that lasts.",
    ctx:{ ch1:"The ancient world is being rediscovered not just in texts but in sculpture — Roman statues being unearthed across Italy, showing the human body depicted with a naturalism that medieval art entirely abandoned. You study these figures with the intensity of someone who has been given permission to look at the world honestly for the first time.",
      ch2:"Perspective. The mathematical discovery that objects appear smaller as they recede from the viewer — and that this can be calculated precisely and depicted on a flat surface — is transforming painting. Before perspective, medieval art depicted spiritual hierarchy: the most important figures were the largest. After perspective, art depicts reality as the eye actually sees it. You are learning to paint what is actually there.",
      ch3:"Gutenberg's press is spreading images as well as words. Dürer in Germany is making woodblock prints that distribute his work across Europe in ways no painting can match. The artist who understands the new technology of reproduction reaches an audience no individual patron can provide.",
      ch4:"The Reformation is dividing your market. Protestant patrons in Northern Europe are suspicious of religious imagery — some of them are actively destroying it. Catholic patrons want more of it, more magnificent, more persuasive. The artist who can navigate both markets survives. The artist who takes a strong theological position may find half their potential patrons gone.",
      ch5:"The Counter-Reformation is the greatest commission opportunity in a generation. The Church is funding extraordinary art to demonstrate the beauty and truth of Catholicism — the Baroque style emerging from this moment is the most dramatic and emotionally powerful art Europe has produced. You paint for the Church and produce something overwhelming.",
      ch6:"You are making things that will last longer than any political or religious controversy of your lifetime. Michelangelo's Sistine ceiling. Leonardo's notebooks. Dürer's self-portrait. The art of the Renaissance outlasts the Renaissance. What you make now will be studied in 600 years." }
  },
  { id:"humanist", name:"Humanist Scholar", icon:"📖",
    desc:"You are a scholar in the tradition of Petrarch — rediscovering classical texts, applying reason to human problems, and arguing that the proper study of mankind is man.",
    own:"Deep knowledge of Latin and Greek, access to newly recovered classical texts, and the conviction that human dignity and reason are worth celebrating.",
    fear:"A Church that condemns human-centered inquiry as pride. A political authority that sees your questions as dangerous. The possibility that reason alone cannot answer the most important questions.",
    want:"A world where human dignity is recognized, where reason is respected, where classical wisdom and Christian faith can coexist and reinforce each other.",
    ctx:{ ch1:"Petrarch — the first humanist — climbed Mont Ventoux simply to look at the view, and wrote about it as an experience worth having for its own sake. That sounds simple. In a medieval world where everything was supposed to point toward God rather than toward human experience, it was revolutionary. You are Petrarch's intellectual heir.",
      ch2:"The rediscovery of classical texts is your life's work. Greek and Roman writers discussing ethics, politics, history, and the nature of the good life — these texts were never fully lost, but they were filtered through medieval theology. Reading them directly, in their original languages, produces a different understanding than reading them through a theological lens.",
      ch3:"Erasmus is your hero. The Christian humanist who applies classical learning to Church reform — who writes the Praise of Folly mocking corruption while remaining Catholic — represents the possibility you believe in: that faith and reason can coexist, that the Church can be reformed from within by people who love it. The printing press makes Erasmus's ideas available across Europe in months.",
      ch4:"Luther has done what Erasmus refused to do — broken with the Church rather than reform it from within. You understand why. You also see what is lost when reform becomes revolution: the unity of European Christendom, the possibility of a reformed Church that holds everyone. Thomas More will die rather than accept the break. You understand that too.",
      ch5:"The Galileo affair is your nightmare made real. A scientist who has discovered something true about the universe — that it moves around the sun, not the sun around it — is forced by the Church to say he was wrong. He recants. He is placed under house arrest. He reportedly mutters afterward: 'And yet it moves.' The question of what authority can legitimately demand is the question your scholarship has been circling for a generation.",
      ch6:"Shakespeare. Cervantes. Writers using the vernacular languages — English, Spanish — to explore human nature with a depth and complexity the classical tradition never achieved in its own languages. The humanist project you began by rediscovering Latin and Greek has produced something it didn't anticipate: a literature in living languages that speaks to everyone." }
  },
  { id:"reformer", name:"Protestant Reformer", icon:"📜",
    desc:"You follow in the tradition of Martin Luther — convinced that the Church has corrupted the faith and that reform requires breaking with Rome rather than working within it.",
    own:"Scripture as the only authority. The conviction that salvation comes through faith alone, not through purchased indulgences. A printing press that spreads your ideas faster than the Church can suppress them.",
    fear:"Being declared a heretic. The violence that religious division brings. The possibility that the Reformation you started will fragment into dozens of competing versions of Christianity.",
    want:"A Christianity that returns to what you understand as its original purity — scripture read directly, salvation understood correctly, a Church that serves its people rather than exploiting them.",
    ctx:{ ch1:"The corruption that Luther will eventually challenge is visible already in the Renaissance. The Church spending vast sums on art and architecture. The selling of offices. The gap between what the Church preaches and how it behaves. The humanist scholars are already pointing at this gap. The question is what to do about it.",
      ch2:"The printing press is the Reformation's most important tool. Luther's Ninety-Five Theses are posted in Wittenberg on October 31, 1517 — and within weeks, printed copies are circulating across Germany. The Church that controlled information for a thousand years suddenly finds its critics able to reach everyone who can read, simultaneously, faster than any suppression can work.",
      ch3:"Luther's core argument: salvation comes through faith alone, not through works or purchased indulgences. Scripture alone is the authority — not the Pope, not Church councils, not centuries of tradition. Every believer can read and interpret scripture directly. These ideas are genuinely radical. They restructure the entire relationship between the individual and religious authority.",
      ch4:"This is your chapter. Luther at the Diet of Worms: 'Here I stand. I can do no other.' Calvin building Geneva as a model Protestant city. Henry VIII — for entirely different reasons — breaking England from Rome and establishing the Church of England. The Reformation you began is larger and more varied than any single person planned.",
      ch5:"The Thirty Years War is what religious division produces when political authority takes sides. Catholic and Protestant armies destroying Germany for a generation. The Spanish Inquisition targeting anyone who strays from Catholic orthodoxy. The violence your ideas — which were meant to free people — have helped produce is something you live with.",
      ch6:"The legacy is complicated. You broke the medieval Church's monopoly on Christian interpretation. You made scripture available in vernacular languages — Luther's German Bible, Tyndale's English Bible. You established the principle that individuals can read and interpret religious texts directly. You also fractured European Christianity into competing denominations that will fight each other for centuries." }
  },
  { id:"catholic", name:"Catholic Church Official", icon:"✝️",
    desc:"You serve the Catholic Church during its most severe crisis since the early centuries — the Protestant Reformation fracturing the unity of Western Christianity.",
    own:"The authority of tradition, the sacraments, the institutional structure that has organized European life for a thousand years, and the genuine conviction that Luther is wrong.",
    fear:"That the Church's real corruptions will be used to discredit its genuine truths. That religious division will produce violence. That the institution you serve will not survive the crisis.",
    want:"A reformed Church — but reformed from within, not broken apart. The unity of Christendom. A faith that serves its people honestly.",
    ctx:{ ch1:"The Church of the Renaissance is simultaneously the patron of the greatest art ever made and the institution selling indulgences to fund it. The corruption is real. The beauty is also real. You serve an institution that contains both and you have spent your life trying to strengthen the beauty and address the corruption.",
      ch2:"The humanist scholars within the Church — Erasmus, More — are your allies. They see the same problems Luther sees. They want the same reforms. They believe, as you do, that the Church can be reformed from within without destroying the unity that a thousand years of Christian Europe represents. The question is whether they are right.",
      ch3:"The printing press that Luther uses to spread his ideas is also available to you. Catholic scholars, apologists, and reformers use it to respond. The Reformation is also a war of words, and both sides print. The Church that controlled information through manuscript copying suddenly has to compete in a marketplace of ideas it didn't design.",
      ch4:"The Council of Trent is your generation's answer to Luther. Twenty-five years of Church councils reaffirming Catholic doctrine, addressing genuine corruptions, and clarifying what the Church actually teaches. The indulgence scandal that sparked Luther's revolt is addressed. The practices that humanists criticized are reformed. Too late to bring Luther back — but not too late to save the Church.",
      ch5:"The Jesuits — founded by Ignatius of Loyola — are the Counter-Reformation's most powerful tool. Educated, disciplined, intellectually serious missionaries who go where the Church is losing ground. The Galileo affair is your most painful chapter: a scientist who has discovered something true being forced to recant by an authority that is wrong about astronomy. You know this is wrong. The institutional pressures are more powerful than your individual judgment.",
      ch6:"The Catholic Church survives the Reformation. It is smaller — it has lost northern Europe permanently. It is reformed — the genuine corruptions that Luther identified have been addressed. It is artistically extraordinary — the Baroque art of the Counter-Reformation is among the most powerful ever made. What it is no longer is the universal Church of Western Christendom. That loss is permanent." }
  },
  { id:"ordinary", name:"Ordinary Person / Craftworker", icon:"🔨",
    desc:"You are an ordinary person living through extraordinary times — a craftworker, a farmer, a tradesperson whose world is being transformed by forces mostly beyond your control.",
    own:"Your trade, your family, your community, and the gradually increasing access to information that the printing press is providing.",
    fear:"Religious wars fought over questions you barely understand. A world changing faster than you can keep up with. Being on the wrong side of a religious or political divide you didn't choose.",

        { text:"Post the Ninety-Five Theses — on October 31, 1517, change the world", hint:"The moment that splits Christianity", outcome:"good", result:"The Ninety-Five Theses are posted on the door of the Castle Church in Wittenberg — a standard academic invitation to debate. What happens next is not standard. Within two weeks, printed copies are circulating across Germany. Within two months, across Europe. The printing press has turned an academic protest into a continental revolution before the Church can formulate a response. Here I stand. The die is cast.", statChange:{food:5,knowledge:25,wealth:5,standing:20} },
        { text:"Translate the Bible into German — make scripture available to every German speaker", hint:"The vernacular Bible", outcome:"good", result:"Luther's German Bible — translated in eleven weeks while in hiding at the Wartburg Castle — is the most important book published in the German language. It not only makes scripture available to German speakers — it standardizes the German language itself, giving dozens of dialects a common literary form. The press produces 200,000 copies in the first twelve years. The Bible that previously required priestly intermediary is now in ordinary people's hands.", statChange:{food:5,knowledge:30,wealth:5,standing:20} },
        { text:"Engage with Calvin — understand how the Reformation is developing beyond Luther's initial vision", hint:"Reformed theology", outcome:"good", result:"John Calvin's Institutes of the Christian Religion — systematic, rigorous, theologically comprehensive — takes Luther's initial protest and develops it into a complete alternative theology. Calvin's Geneva becomes a model Protestant city. His ideas about predestination, about the relationship between church and state, about Christian discipline, spread across Europe and eventually to the New World. The Reformation is becoming plural.", statChange:{food:5,knowledge:25,wealth:5,standing:15} }
      ],
      catholic:[
        { text:"Respond in print — the Church has scholars capable of answering Luther's arguments", hint:"Counter-argument through the press", outcome:"good", result:"The press that spreads Luther's ideas is available to Catholics too. The theological responses your scholars produce — Johannes Eck debating Luther at Leipzig, the systematic refutations of Protestant theology — are serious intellectual engagements, not dismissals. The Reformation is partly a war of ideas fought in print. You fight it that way.", statChange:{food:5,knowledge:25,wealth:5,standing:15} },
        { text:"Recognize that the press cannot be uninvented — adapt the Church's communication strategy", hint:"Institutional adaptation to new technology", outcome:"good", result:"The Church that tries to suppress the press will fail — the technology is too widely distributed, the printers too numerous, the demand for books too strong. The Church that learns to use the press will survive. You advocate for Catholic printing houses, for popular religious literature in vernacular languages, for the Church to compete in the new information environment rather than attempting to shut it down.", statChange:{food:5,knowledge:20,wealth:5,standing:15} },
        { text:"Support the Council of Trent — a systematic response to legitimate criticisms", hint:"Institutional reform", outcome:"good", result:"The Council of Trent (1545-1563) is the Catholic Church's most comprehensive self-examination in a thousand years. It addresses the corruption that Luther correctly identified — selling of indulgences abolished, education of clergy improved, standards for Church behavior clarified. It also reaffirms Catholic doctrine against Protestant challenges. Too late to reunite Christianity. Not too late to save the Catholic Church.", statChange:{food:5,knowledge:20,wealth:5,standing:20} }
      ],
      ordinary:[
        { text:"Buy a printed pamphlet — read Luther's argument in your own language for the first time", hint:"Direct access to revolutionary ideas", outcome:"good", result:"The pamphlet costs less than a meal. It contains, in plain German, the argument that the Church has been wrong about how salvation works — that it cannot be purchased, that faith alone is sufficient, that scripture says so and the Church has hidden this. You read it. You pass it to your neighbor. You discuss it at the market. The Reformation is happening in conversations like this one, across every town in Germany simultaneously.", statChange:{food:5,knowledge:20,wealth:-5,standing:5} },
        { text:"Learn to use the press — work as a printer's apprentice in the new industry", hint:"Economic participation in the information revolution", outcome:"good", result:"The printing houses spreading across every city need skilled workers — typesetters, pressmen, proofreaders, binders. You learn the trade. The work puts you at the center of the most consequential technological change of the century. Every pamphlet you set in type, every book you bind, every Bible you help produce changes someone's world. You are not the author. You are the person who makes authorship matter.", statChange:{food:10,knowledge:20,wealth:15,standing:10} },
        { text:"Teach your children to read — literacy is now essential for full participation in the world", hint:"Education for the new era", outcome:"good", result:"The world your children will inhabit requires reading. The Lutheran churches being established across Germany are founding schools — Luther believes every Christian must be able to read scripture. The Catholic Church responds by expanding its own educational institutions. For the first time, literacy is becoming a social expectation rather than a elite privilege. Your children will live in that world. You prepare them for it.", statChange:{food:-5,knowledge:25,wealth:-5,standing:10} }
      ]
    }
  },
  { id:"ch4", number:4,
    title:"Chapter 4 — The Reformation",
    subtitle:"Luther, Calvin, Henry VIII, and the Fracturing of Christianity",
    scene:"It is 1521. Martin Luther stands before the Diet of Worms — the assembly of the Holy Roman Empire — and is asked to recant his writings. He refuses: 'Here I stand. I can do no other. God help me.' He is declared an outlaw. He disappears — protected by a German prince — and emerges months later having translated the New Testament into German. The fracture in Western Christianity that his act began is now irreversible. John Calvin will take the Reformation in new directions in Geneva. Henry VIII — for reasons more personal than theological — will break England from Rome entirely and establish the Church of England. The unified Christianity that organized European life for a thousand years is ending.",
    historyNote:"<strong>The Reformation:</strong> Luther's Diet of Worms refusal (1521) made the break with Rome final. Calvin's Institutes of the Christian Religion (1536) systematized Protestant theology and his Geneva became a model reformed city. Henry VIII's break with Rome (1534) was initially about his desire to annul his marriage — but produced the Church of England and eventually a distinctly English Protestant tradition. By 1560, Europe was permanently divided between Catholic south and Protestant north, with consequences for politics, culture, and warfare that lasted centuries.",
    journalPrompt:"Luther said 'Here I stand. I can do no other.' He was one person refusing to submit to the most powerful institution in Europe. What made that possible — and what does it tell you about the relationship between individual conscience and institutional authority?",
    poisonRoles:["catholic"], discussAfter:true,
    discussPrompt:"Your table just experienced the Reformation from one role's perspective. The table next to you experienced the same events from a completely different position. Before you continue — spend 90 seconds comparing: What did the Reformation mean for your role? What choices did you have that the other table didn't?",
    discussPairs:"Protestant Reformer pairs with Catholic Church Official · Italian Merchant pairs with Ordinary Person · Artist pairs with Humanist Scholar",
    choices:{
      patron:[
        { text:"Navigate the religious divide commercially — maintain relationships across Catholic and Protestant territories", hint:"Commerce above religious conflict", outcome:"good", result:"The Reformation splits your commercial network along religious lines — Catholic bankers refusing Protestant clients, Protestant princes seizing Church assets, trade routes disrupted by religious warfare. You navigate carefully, maintaining relationships on both sides, keeping your commercial identity separate from your religious one. It is not comfortable. It keeps your family solvent.", statChange:{food:5,knowledge:15,wealth:15,standing:10} },
        { text:"Support the Catholic cause with patronage — the Counter-Reformation needs wealthy allies", hint:"Political-religious alignment", outcome:"good", result:"The Counter-Reformation's enormous artistic program needs financing. The new churches, the Jesuit colleges, the magnificent art that argues visually for Catholicism's truth and beauty — all of it requires patrons like you. Your investment is simultaneously religious, political, and aesthetic. The art produced is extraordinary. The cause it serves is the one you believe in.", statChange:{food:5,knowledge:10,wealth:-15,standing:20} },
        { text:"Note that Henry VIII's break with Rome has commercial implications — England's Church assets are redistributed", hint:"Commercial analysis of religious change", outcome:"neutral", result:"Henry VIII dissolving the monasteries and redistributing their assets creates the largest transfer of land and wealth in English history. The commercial implications — for English trade, for the merchants who buy dissolved monastery lands at favorable prices, for the long-term economic development of England — are enormous. Religion and commerce are, again, the same story.", statChange:{food:5,knowledge:15,wealth:10,standing:5} }
      ],
      artist:[
        { text:"Paint for the Counter-Reformation — the Church's commissioning boom produces the Baroque", hint:"Art in service of Catholic renewal", outcome:"good", result:"The Counter-Reformation produces the Baroque — the most emotionally overwhelming art style in history. The commission you receive asks for something that moves people, that demonstrates the truth and beauty of Catholic faith through sheer sensory power. You paint drama, ecstasy, movement, light breaking through darkness. The result is extraordinary and serves a purpose you believe in.", statChange:{food:5,knowledge:15,wealth:20,standing:20} },
        { text:"Navigate the Protestant market — Northern European patrons want portraits and landscapes, not saints", hint:"Market adaptation", outcome:"good", result:"Protestant theology is suspicious of religious imagery — some reformers actively destroy it as idolatry. The Protestant art market shifts toward portraits, landscapes, scenes of daily life, and allegory. You adapt. The portrait tradition you develop — individual faces depicted with psychological depth — becomes its own form of humanism, as powerful in its way as the religious art it replaces.", statChange:{food:5,knowledge:20,wealth:15,standing:15} },
        { text:"Make a self-portrait in the tradition of Dürer — assert the artist's individual dignity and identity", hint:"The artist as subject", outcome:"good", result:"Dürer's 1500 self-portrait — painted when he was 28, facing the viewer directly, in the pose traditionally reserved for Christ — is the Renaissance's most radical artistic statement. You follow this tradition: the artist as a subject worthy of the same careful attention previously reserved for saints and rulers. The signature on the painting is not vanity. It is a philosophical claim about human dignity.", statChange:{food:5,knowledge:20,wealth:10,standing:20} }
      ],
      humanist:[
        { text:"Mourn what the Reformation is destroying — the dream of a united reformed Christendom", hint:"The humanist tragedy", outcome:"neutral", result:"Erasmus refused to join Luther. Thomas More died rather than support Henry VIII. The Christian humanists who wanted reform without revolution watch the revolution happen and know that the unified reformed Christendom they imagined is gone. The dream was real. The political and theological forces that destroyed it were also real. You grieve what might have been.", statChange:{food:5,knowledge:20,wealth:5,standing:10} },
        { text:"Write in the vernacular — follow Luther and Erasmus in making ideas accessible beyond Latin scholars", hint:"Vernacular literature", outcome:"good", result:"Cervantes writes in Spanish. Shakespeare writes in English. Montaigne writes in French. The humanist tradition that began by recovering Latin and Greek has produced something it didn't anticipate: serious literary and philosophical work in living languages, accessible to everyone who speaks them. The vernacular literature emerging from this moment is the Renaissance's most democratic achievement.", statChange:{food:5,knowledge:25,wealth:5,standing:20} },
        { text:"Defend reason against both Catholic tradition and Protestant scripture alone", hint:"The philosopher's independent path", outcome:"good", result:"The humanist who refuses to accept either papal tradition or Lutheran scripture as the sole authority for truth is in a difficult position — suspected by both sides, trusted by neither. The defense of reason as an independent source of knowledge — capable of reaching conclusions that tradition and scripture have not — is the position that will eventually produce the Enlightenment. It is also lonely.", statChange:{food:5,knowledge:30,wealth:5,standing:5} }
      ],
      reformer:[
        { text:"Stand at Worms — refuse to recant regardless of the consequences", hint:"Here I stand", outcome:"good", result:"'Unless I am convicted by scripture and plain reason — I do not accept the authority of popes and councils, for they have contradicted each other — my conscience is captive to the Word of God. I cannot and will not recant anything, for to go against conscience is neither right nor safe. Here I stand. I can do no other. God help me.' The words that divide Christianity permanently. You say them anyway.", statChange:{food:-5,knowledge:20,wealth:-5,standing:25} },
        { text:"Build Geneva — show what a Protestant city actually looks like in practice", hint:"Reformed society in practice", outcome:"good", result:"Calvin's Geneva is the most ambitious attempt to build a society on Protestant principles. Education for all — because all must read scripture. Discipline enforced — because the community of believers must live by their convictions. Political authority subject to theological standards — because God's law supersedes human law. The experiment is inspiring and frightening in roughly equal measure.", statChange:{food:5,knowledge:25,wealth:5,standing:20} },
        { text:"Watch Henry VIII with complicated feelings — the right outcome for wrong reasons", hint:"The complicated English Reformation", outcome:"neutral", result:"Henry VIII's break with Rome is driven by his desire to annul his marriage to Catherine of Aragon, not by theological conviction. The Church of England he creates is Catholic in most respects except for its rejection of papal authority. The Reformation happening in England is politically motivated rather than spiritually — and yet it produces real religious change, real Protestant development, and eventually a distinctly English Christianity. The right outcome for wrong reasons is still an outcome.", statChange:{food:5,knowledge:15,wealth:5,standing:10} }
      ],
      catholic:[
        { text:"Convene the Council of Trent — the Church's systematic response to legitimate reform demands", hint:"Reform from within", outcome:"good", result:"Twenty-five years of councils. The corruptions that Luther correctly identified — the indulgence scandal, the sale of offices, the inadequate education of clergy — are addressed. Catholic doctrine is clarified against Protestant challenges. The Church emerges smaller, reformed, and theologically sharpened. The price — the permanent loss of northern Europe — is real. The alternative — the Church collapsing entirely — was also real.", statChange:{food:5,knowledge:20,wealth:5,standing:15} },
        { text:"Support the Jesuits — the Counter-Reformation's most intellectually serious missionaries", hint:"Jesuit response to Protestantism", outcome:"good", result:"Ignatius of Loyola's Society of Jesus — the Jesuits — are the Counter-Reformation's most effective tool. Intellectually serious, rigorously educated, willing to go anywhere the Church is losing ground. They found universities across Europe and in the mission territories of Asia and the Americas. The Catholic Church that survives the Reformation is partly built on Jesuit intellectual and missionary work.", statChange:{food:5,knowledge:25,wealth:-5,standing:20} },
        { text:"Watch Henry VIII's break from Rome as a warning — political authority claiming religious authority", hint:"The danger of Erastianism", outcome:"neutral", result:"Henry VIII demonstrates what happens when political authority claims the right to define religious truth — the monarch becomes the head of the Church, doctrine adjusts to political convenience, and the faith becomes an instrument of state power. This is exactly what the Church has always feared from secular rulers. The irony: the Church's own political entanglements over centuries helped create the conditions for exactly this. You see the warning. You are not sure the lesson can be learned in time.", statChange:{food:5,knowledge:20,wealth:5,standing:5}, isPoison:true }
      ],
      ordinary:[
        { text:"Choose a side — the Reformation requires ordinary people to make decisions about religion and identity", hint:"Religious identity as choice", outcome:"neutral", result:"For the first time in your life, Christianity is not a single institution you belong to by birth. It is a set of options. Catholic or Lutheran or Calvinist or Anabaptist or, in England, Anglican. The choice has consequences — for your relationships, your community, your safety. You make it. The idea that religious identity is a choice rather than an inheritance is genuinely new and genuinely disorienting.", statChange:{food:5,knowledge:15,wealth:5,standing:5} },
        { text:"Attend a Protestant service — hear scripture in your own language for the first time", hint:"Direct access to the faith", outcome:"good", result:"The Lutheran service is conducted in German. The scripture is read in German. The sermon is in German. For the first time in your life, the worship service is accessible to you directly — not mediated through a language you don't speak, not dependent on a priest's interpretation. Whether Luther's theology is correct is a question you are still working out. The accessibility is immediately meaningful.", statChange:{food:5,knowledge:20,wealth:5,standing:5} },
        { text:"Watch the Peasants' War and its aftermath — the Reformation's limits for ordinary people", hint:"The Reformation's social limits", outcome:"neutral", result:"The German peasants who used Luther's ideas about Christian freedom to demand social equality are crushed — with Luther's approval. The Reformation is about theological freedom. It is not about social freedom. The distinction that makes sense to a theologian feels like betrayal to a peasant who thought the Gospel meant something about how to organize society. You are a peasant. You understand the betrayal.", statChange:{food:-5,knowledge:15,wealth:-5,standing:5} }
      ]
    }
  },
  { id:"ch5", number:5,
    title:"Chapter 5 — The Response and the Resistance",
    subtitle:"Counter-Reformation, Inquisition, and Galileo's Hot Goss Moment",
    scene:"It is 1633. Galileo Galilei — mathematician, astronomer, physicist, the greatest scientist alive — has been summoned before the Roman Inquisition. His crime: publishing evidence that the Earth moves around the Sun rather than the Sun around the Earth, in direct contradiction of the Church's official position. His Dialogue Concerning the Two Chief World Systems is brilliant, funny, clearly correct — and has made the Pope look foolish by putting arguments in the mouth of a character named Simpleton. Galileo is 69 years old. He has already spent years under informal restriction. The Inquisition offers him a choice: recant, or face consequences. He recants. He is placed under house arrest for the remaining nine years of his life. He reportedly mutters, leaving the chamber: 'And yet it moves.'",
    historyNote:"<strong>Galileo and the Inquisition:</strong> Galileo's conflict with the Church was partly about astronomy, partly about who has the authority to interpret scripture. Galileo argued — correctly — that scripture should be interpreted metaphorically on scientific questions, and that Copernicus's heliocentric model was physically correct. The Church's position was that scripture taught geocentrism and scientific claims must conform to it. Galileo's forced recantation in 1633 did not stop the eventual acceptance of heliocentrism — it just delayed it. His house arrest lasted until his death in 1642. Newton published his Principia Mathematica in 1687, establishing the mathematical framework that made heliocentrism undeniable.",
    journalPrompt:"Galileo knew he was right. He recanted anyway to avoid worse consequences. Then he reportedly said 'And yet it moves.' What does this moment tell you about the relationship between truth, power, and individual courage?",
    poisonRoles:["reformer","ordinary"], discussAfter:true,
    discussPrompt:"Your table just experienced the Counter-Reformation and the Galileo affair from one role's perspective. The table next to you experienced the same events differently. Before you continue — spend 90 seconds comparing: What choices did your role have that the other table didn't? What was your role most afraid of in this chapter?",
    discussPairs:"Protestant Reformer pairs with Catholic Church Official · Italian Merchant pairs with Humanist Scholar · Artist pairs with Ordinary Person",
    discussPrompt2:"Now turn to a different table. Spend 90 seconds on this: Which role do you think had the hardest experience of this chapter — and why?",
    discussPairs2:"Protestant Reformer pairs with Humanist Scholar · Catholic Church Official pairs with Ordinary Person · Italian Merchant pairs with Artist",
    choices:{
      patron:[
        { text:"Fund Galileo's research — scientific inquiry deserves the same patronage as art", hint:"Patronage of science", outcome:"good", result:"The Medici have funded Galileo — he named the moons of Jupiter the 'Medicean stars' in gratitude. The patronage of scientific inquiry is as important as the patronage of art — both are forms of human excellence worth supporting. The political complications of funding someone the Church then condemns are real. The scientific work is worth it.", statChange:{food:5,knowledge:25,wealth:-10,standing:15} },
        { text:"Support the Jesuit educational institutions — they are the Counter-Reformation's most serious intellectual contribution", hint:"Catholic intellectual investment", outcome:"good", result:"The Jesuit colleges and universities being established across Catholic Europe are the most rigorous educational institutions on the continent. Their curriculum combines classical learning, theology, mathematics, and natural philosophy. The intellectual formation they provide — careful, systematic, open to scientific inquiry within certain limits — produces some of the best minds of the century.", statChange:{food:5,knowledge:20,wealth:-10,standing:20} },
        { text:"Commission the most magnificent Counter-Reformation art available — beauty as theological argument", hint:"Patronage in the Baroque age", outcome:"good", result:"The Baroque art of the Counter-Reformation is the most emotionally powerful ever produced — dramatic light and shadow, intense facial expressions, figures caught in moments of ecstasy or agony. Bernini, Caravaggio, Rubens. The argument it makes is sensory rather than rational: the faith that produces this beauty cannot be false. You fund it. The argument is not wrong.", statChange:{food:5,knowledge:15,wealth:-15,standing:25} }
      ],
      artist:[
        { text:"Paint in the Baroque style — drama, light, ecstasy, and overwhelming emotional power", hint:"Counter-Reformation art at its height", outcome:"good", result:"Caravaggio's chiaroscuro — the dramatic use of light emerging from deep shadow — transforms painting. The emotional intensity of Baroque art is not decoration. It is argument. The faith that can be depicted this way, with this power and this beauty, is making a case for itself in the only language that reaches everyone regardless of literacy. You paint in this tradition. The work is extraordinary.", statChange:{food:5,knowledge:20,wealth:20,standing:25} },
        { text:"Illustrate Galileo's Dialogue — scientific argument needs visual support", hint:"Art in service of science", outcome:"good", result:"Galileo's Dialogue uses diagrams, illustrations, and visual arguments alongside written ones. The scientific argument for heliocentrism is partly a visual argument — the phases of Venus, the moons of Jupiter, the features of the lunar surface as seen through the telescope. You contribute to making these observations visible in ways that text alone cannot achieve.", statChange:{food:5,knowledge:25,wealth:5,standing:15} },
        { text:"Make a self-portrait that asserts artistic identity regardless of religious context", hint:"Individual artistic identity", outcome:"good", result:"Dürer's 1500 self-portrait remains the model: the artist as a subject of dignity, worthy of the same careful attention given to saints and rulers. Your self-portrait makes the same claim in a different moment — one where individual identity is being contested by both Catholic authority and Protestant community. The individual face looking directly at the viewer is a statement that survives the controversy.", statChange:{food:5,knowledge:20,wealth:10,standing:20} }
      ],
      humanist:[
        { text:"Defend Galileo publicly — the Church is wrong about astronomy and wrong to suppress truth", hint:"Defense of scientific inquiry", outcome:"good", result:"The defense of Galileo is the defense of the humanist principle that direct observation and reason are legitimate sources of knowledge — that the scholar who observes the moons of Jupiter through a telescope is not threatening faith but extending human understanding in ways faith should welcome. The Church that condemns Galileo is making the same mistake the Church made with every scientific advance it initially resisted. You say this clearly.", statChange:{food:-5,knowledge:30,wealth:5,standing:10} },
        { text:"Write in the tradition of Shakespeare — explore human nature in the vernacular with full complexity", hint:"The vernacular Renaissance", outcome:"good", result:"Shakespeare's plays examine human nature — ambition, love, jealousy, grief, courage, cowardice — with a psychological complexity and verbal precision that no previous literature in any language achieved. Written in English for ordinary London audiences, they are simultaneously the most popular entertainment and the deepest literary exploration of what it means to be human. You write in this tradition, in whatever vernacular language is yours.", statChange:{food:5,knowledge:30,wealth:5,standing:20} },
        { text:"Publish Cervantes — Don Quixote as the first modern novel", hint:"The birth of the novel", outcome:"good", result:"Don Quixote — a man who has read too many chivalric romances and believes himself a knight — is simultaneously a comedy, a tragedy, a meditation on the relationship between imagination and reality, and the first novel in the modern sense. Cervantes invents a new literary form: the extended prose fiction that takes ordinary people's inner lives as seriously as epics took heroes' outer actions. The Renaissance ends by inventing the novel.", statChange:{food:5,knowledge:30,wealth:5,standing:20} }
      ],
      reformer:[
        { text:"Watch the Thirty Years War begin — religious division producing violence you didn't intend", hint:"The Reformation's violent consequences", outcome:"neutral", result:"The Thirty Years War (1618-1648) kills perhaps a third of Germany's population. Catholic and Protestant armies devastate Central Europe for a generation. The religious freedom you fought for is being fought over with weapons you didn't intend to hand anyone. Luther wanted theological reform. The political and military forces that adopted his ideas had other uses for them. This is your poison pill.", statChange:{food:-5,knowledge:15,wealth:-5,standing:5}, isPoison:true },
        { text:"Defend the principle of religious conscience — each person must answer to God directly", hint:"The Reformation's enduring principle", outcome:"good", result:"Whatever the Reformation's violent consequences, its core principle remains: each person's conscience is ultimately accountable to God rather than to any human institution. This principle — that religious belief cannot be legitimately coerced — will eventually produce religious freedom as a legal concept. The path from Luther's Worms to the First Amendment is direct, even if bloody.", statChange:{food:5,knowledge:20,wealth:5,standing:15} },
        { text:"Support Galileo as a fellow victim of institutional overreach", hint:"Reformation and scientific freedom aligned", outcome:"good", result:"The same institutional authority that condemned Luther for questioning Church teaching on salvation is condemning Galileo for questioning Church teaching on astronomy. The principle is identical: the Church claims authority over truth in domains where its claim is not legitimate. You support Galileo from exactly this principle. The cause of intellectual freedom is the same cause, applied to different domains.", statChange:{food:5,knowledge:25,wealth:5,standing:15} }
      ],
      catholic:[
        { text:"Acknowledge the Galileo affair as a mistake the Church is making in real time", hint:"Institutional courage in the moment", outcome:"good", result:"You know Galileo is right about the astronomy. You know the Church is wrong to suppress him. Saying this internally is possible — saying it publicly is not, given the institutional pressures. The most you can do is work within the system to minimize the damage: arguing for a lighter sentence, preserving Galileo's reputation as a believer, keeping the channels open for eventual acknowledgment. It is not enough. It is what is possible.", statChange:{food:5,knowledge:20,wealth:5,standing:10} },
        { text:"Defend the Council of Trent's genuine reforms against critics who conflate them with the Inquisition", hint:"Distinguish reform from repression", outcome:"good", result:"The Counter-Reformation is not only the Inquisition. It is also the Council of Trent's genuine theological and institutional reforms, the Jesuit educational revolution, the Baroque art that has transformed European culture, and the missionary work that is carrying Christianity to Asia and the Americas. The Church that produces the Inquisition also produces Ignatius of Loyola and Francis Xavier. You make this distinction. It is true and insufficient simultaneously.", statChange:{food:5,knowledge:20,wealth:5,standing:15} },
        { text:"Support the Jesuit scientists — the Church can engage with the new science honestly", hint:"Catholic scientific engagement", outcome:"good", result:"The Jesuits include serious mathematicians and astronomers — some of them quietly sympathetic to Galileo's findings. The Church's relationship with science is not uniformly hostile; it is complicated, contested, and evolving. You support the Jesuits who are trying to find a way for Catholic theology and the new science to coexist. The accommodation is possible. The Galileo affair demonstrates how difficult it is to achieve.", statChange:{food:5,knowledge:25,wealth:5,standing:15} }
      ],
      ordinary:[
        { text:"Navigate the Inquisition's demands carefully — survive without compromising what you believe", hint:"Ordinary survival under institutional pressure", outcome:"neutral", result:"The Inquisition's reach extends into ordinary life — neighbors denouncing neighbors, questions about private religious practice, the requirement to demonstrate orthodoxy in ways the genuinely orthodox find humiliating and the heterodox find terrifying. You navigate carefully. You say what you must say. You believe what you believe. The distance between those two things is where ordinary people live under inquisitorial pressure.", statChange:{food:5,knowledge:10,wealth:5,standing:5}, isPoison:true },
        { text:"Go to the theater — Shakespeare's Globe is where the Renaissance reaches ordinary people", hint:"Popular culture as Renaissance", outcome:"good", result:"The Globe Theatre charges a penny for groundlings — the standing audience in the pit. For a penny you see Hamlet questioning the nature of reality, Lear raging against age and ingratitude, Bottom transformed and bewildered in a fairy wood. Shakespeare writes for you — for the person who cannot read but can listen, who has no Latin but has English, who has never been to Italy but understands ambition and love and grief. The Renaissance reaches you here.", statChange:{food:5,knowledge:20,wealth:-5,standing:10} },
        { text:"Read Don Quixote — the first novel written for people like you", hint:"The novel as democratic literature", outcome:"good", result:"Don Quixote costs what a few days' wages buy. It tells the story of an ordinary man whose imagination transforms his world — sometimes beautifully, sometimes disastrously. Cervantes writes in Spanish for Spanish speakers, about a person whose inner life is as rich and complex as any king's. The novel that Cervantes invents is the literary form that will speak most directly to ordinary people for the next five centuries. You are its first audience.", statChange:{food:5,knowledge:20,wealth:-5,standing:10}, poison:false }
      ]
    }
  },
  { id:"ch6", number:6,
    title:"Chapter 6 — The Legacy",
    subtitle:"Scientific Revolution, Northern Renaissance, and What Changed Forever",
    scene:"It is approximately 1687. Isaac Newton publishes his Principia Mathematica — a mathematical description of the physical universe that explains planetary motion, gravity, and the behavior of objects in motion with a precision and elegance that makes the previous three centuries of scientific development feel like preparation for this moment. The Renaissance that began with rediscovering Plato in Florence has produced, three hundred years later, a mathematical description of how the universe works. Copernicus proposed heliocentrism. Galileo observed evidence for it. Newton explained why. The scientific revolution that the Renaissance made possible is complete — and the Enlightenment that follows will apply the same methods to politics, society, and human nature itself. Everything is about to change again.",
    historyNote:"<strong>The Scientific Revolution:</strong> Copernicus (1543) proposed that Earth moves around the Sun. Vesalius (1543) corrected ancient medical errors through direct anatomical observation. Galileo (1610) observed moons of Jupiter and phases of Venus through the telescope, providing evidence for heliocentrism. Francis Bacon developed the scientific method — systematic observation and experiment rather than argument from authority. Newton's Principia (1687) unified terrestrial and celestial mechanics in a single mathematical framework. The microscope revealed a previously invisible world of microorganisms. These developments together constitute the Scientific Revolution — a permanent transformation of how humans understand and investigate the natural world.",
    journalPrompt:"You began this year looking at a 36,000-year-old cave painting made by someone whose name we will never know. You are ending it here — in a world where Dürer signs his name to a self-portrait, where Shakespeare writes plays still performed 400 years later, where Newton describes the mathematics of the universe. What changed between the cave painting and this moment — and what, looking at the whole year, do you think stayed the same about what humans are trying to do?",
    poisonRoles:[], discussAfter:false,
    choices:{
      patron:[
        { text:"Fund the Royal Society — the new institution for scientific inquiry needs patronage", hint:"Patronage of the scientific revolution", outcome:"good", result:"The Royal Society of London — founded 1660, chartered by Charles II — is the institutional form of the scientific revolution: a community of investigators who share observations, debate methods, and build on each other's work rather than relying on individual genius alone. The patronage that funded individual artists and scholars is now funding institutions. The Renaissance model of patronage is evolving into the modern model of institutional support for inquiry.", statChange:{food:5,knowledge:30,wealth:-10,standing:20} },

let state = {
  screen:"art_open", role:null, chapterIndex:0,
  pendingOutcome:null, isRetry:false, retryCount:0,
  stats:{food:50,knowledge:50,wealth:50,standing:50},
  discussPhase:0, timerInterval:null
};

// ══════════════════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════════════════
function go(s){state.screen=s;render();window.scrollTo({top:0,behavior:"smooth"});}
function getRole(){return ROLES.find(r=>r.id===state.role);}
function clamp(v){return Math.max(0,Math.min(100,v));}
function applyStats(ch){if(!ch)return;for(let k in ch){if(state.stats[k]!==undefined)state.stats[k]=clamp(state.stats[k]+ch[k]);}}
function statColor(v){return v>=60?"#6ABF6A":v>=35?"#E8C840":"#E05050";}
function isDead(){return state.stats.food<=0;}

function knowledgeResult(v){
  if(v>=75)return{icon:"🔭",title:"The Examined Life",text:"Your choices pursued knowledge — about the world, about human nature, about the relationship between faith and reason — with the seriousness the Renaissance demanded. The Renaissance's deepest claim is that human beings can understand their world through careful observation and honest inquiry. Your choices embody that claim."};
  if(v>=50)return{icon:"📖",title:"The Inquiring Mind",text:"Your choices engaged with the new knowledge of the Renaissance with genuine curiosity, if not always with full commitment. Most people who lived through this era navigated exactly this: aware that the world was changing, uncertain what the changes meant, trying to participate honestly in a transformation larger than any individual."};
  if(v>=25)return{icon:"⚖️",title:"Knowledge Deferred",text:"Your choices often prioritized immediate interest over the pursuit of understanding. The Renaissance would have recognized this too — not everyone who lived through it was transformed by it. The ideas were available. Acting on them required courage and investment that not everyone could provide."};
  return{icon:"🕯️",title:"Knowledge Resisted",text:"Your choices moved away from the new knowledge the Renaissance was producing. The institutions and traditions that resisted the Renaissance — not all of which were wrong to resist everything — ultimately could not prevent the transformation. The printing press, the scientific method, and the humanist conviction that human reason is reliable were not stopped by resistance. They were delayed by it."};}

function renderStats(){
  const defs=[{key:"food",label:"Food",icon:"🌾"},{key:"knowledge",label:"Knowledge",icon:"📚"},{key:"wealth",label:"Wealth",icon:"💰"},{key:"standing",label:"Standing",icon:"🏛️"}];
  return`<div class="stats-row">${defs.map(d=>{const v=state.stats[d.key];return`<div class="stat-box"><span class="stat-icon">${d.icon}</span><div class="stat-label">${d.label}</div><div class="stat-value" style="color:${statColor(v)}">${Math.round(v)}</div><div class="stat-track"><div class="stat-fill" style="width:${v}%;background:${statColor(v)}"></div></div></div>`;}).join("")}</div>`;}

function renderProgress(){
  const dots=CHAPTERS.map((c,i)=>`<div class="prog-dot ${i<state.chapterIndex?"done":i===state.chapterIndex?"active":""}"></div>`).join("");
  return`<div class="progress-row">${dots}<span class="prog-label">Chapter ${state.chapterIndex+1} of ${CHAPTERS.length}</span></div>`;}

function screenArtOpen(){return`
  <div class="screen-label">Before we begin — look closely</div>
  <div class="screen-heading">Vitruvian Man<br><span style="font-size:16px;color:var(--gold)">Leonardo da Vinci · c. 1490 CE</span></div>
  <div class="art-frame">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/68/Halal_Vitruvianischer_Mensch.png" alt="Vitruvian Man — Leonardo da Vinci c. 1490" onerror="this.style.display='none';document.getElementById('vit-fallback').style.display='block'" />
    <div id="vit-fallback" style="display:none;padding:2rem;text-align:center;color:var(--gold);font-family:Arial,sans-serif;font-size:13px">[Vitruvian Man — search "Vitruvian Man Leonardo da Vinci" to view]</div>

  <div class="art-prompts">

    <div class="art-prompt-box"><div class="apt-label">Prompt 2</div><div class="apt-q">One thing that puzzles me...</div></div>

  <div class="role-grid">${ROLES.map(r=>`<div class="role-card" onclick="selectRole('${r.id}')"><span class="rc-icon">${r.icon}</span><div class="rc-name">${r.name}</div><div class="rc-own"><strong>You control:</strong> ${r.own}</div><div class="rc-fear">⚠ You fear: ${r.fear}</div></div>`).join("")}</div>`;}

function screenChapter(){
  const ch=CHAPTERS[state.chapterIndex];
  const role=getRole();
  const choices=ch.choices[role.id]||[];
  const isPoison=ch.poisonRoles&&ch.poisonRoles.includes(role.id);
  return`${renderProgress()}${renderStats()}
  <div class="role-badge"><span class="rb-icon">${role.icon}</span><div><div class="rb-name">${role.name}</div><div class="rb-desc">${role.desc}</div></div></div>
  <div class="screen-label">${ch.title}</div>
  <div class="screen-heading" style="font-size:18px">${ch.subtitle}</div>
  <div class="scene-text">${ch.scene}</div>
  <div class="role-context">${role.ctx[ch.id]}</div>
  ${isPoison?`<div class="poison-note">⚠ There may be no good option for your role in this chapter. Choose the least difficult path — and notice what it reveals about your position in this era.</div>`:""}
  <div class="history-note">${ch.historyNote}</div>
  ${state.isRetry?`<div class="history-note" style="border-color:var(--gold);color:var(--gold)"><strong>Try a different path</strong> — the same historical reality, new choices through it.</div>`:""}
  <div class="choices-label">Discuss with your table — then choose:</div>
  <div class="choices">${choices.map((c,i)=>`<button class="choice-btn" onclick="makeChoice(${i})"><div class="choice-text">${c.text}</div><div class="choice-hint">${c.hint}</div></button>`).join("")}</div>`;}

function screenOutcome(){
  const ch=CHAPTERS[state.chapterIndex];
  const o=state.pendingOutcome;
  const isPoison=o.isPoison||o.poison;
  const outcomeClass=isPoison?"outcome-poison":`outcome-${o.outcome}`;
  const outcomeLabel=o.outcome==="good"?"✓ What happened":o.outcome==="bad"?"✗ What happened":isPoison?"⚠ The constrained choice":"→ What happened";
  const canRetry=isPoison&&state.retryCount<1;
  return`${renderProgress()}${renderStats()}
  <div class="outcome-box ${outcomeClass}"><div class="outcome-label">${outcomeLabel}</div>${o.result}</div>
  ${canRetry?`<div class="history-note" style="border-color:var(--gold);color:var(--gold)">Your role faced a constrained situation. You can try again with entirely new choices, or continue to the journal prompt.</div>
  <button class="btn btn-gold" onclick="retryChapter()">Try different choices →</button>
  <button class="btn btn-secondary" onclick="proceedFromOutcome()">Continue with this outcome →</button>`:
  ch.discussAfter?`<button class="btn btn-gold" onclick="startDiscussion()">Continue to table discussion →</button>`:
  `<div class="journal-prompt"><strong>✏ Field Journal Prompt —</strong> answer before your teacher signals to continue:<br><br>${ch.journalPrompt}</div>
  <button class="btn btn-gold" onclick="advanceChapter()">${state.chapterIndex<CHAPTERS.length-1?"Continue →":"See how your year ends →"}</button>`}`;
}

function screenDiscussion(){
  const ch=CHAPTERS[state.chapterIndex];
  const phase=state.discussPhase;
  const prompt=phase===0?ch.discussPrompt:(ch.discussPrompt2||ch.discussPrompt);
  const pairs=phase===0?ch.discussPairs:(ch.discussPairs2||ch.discussPairs);
  clearInterval(state.timerInterval);
  setTimeout(()=>{
    let secs=90;
    state.timerInterval=setInterval(()=>{
      secs--;
      const el=document.getElementById("timer-display");
      const fill=document.getElementById("timer-fill");
      const btn=document.getElementById("cont-btn");
      if(el)el.textContent=`${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")}`;
      if(fill)fill.style.width=`${(secs/90)*100}%`;
      if(secs<=0){clearInterval(state.timerInterval);if(btn)btn.classList.add("ready");}
    },1000);
  },100);
  const hasSecond=ch.discussPrompt2&&phase===0;
  return`${renderProgress()}
  <div class="discussion-box">
    <div class="disc-header">⏱ Table Discussion ${ch.discussPrompt2?`(${phase+1} of 2)`:""} — 90 seconds</div>
    <div class="disc-prompt">${prompt}</div>
    <div class="disc-pairs">📋 Pairings: ${pairs}</div>
    <div class="timer-row">
      <div class="timer-display" id="timer-display">1:30</div>
      <div class="timer-track"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
      <button class="continue-btn" id="cont-btn" onclick="afterDiscussion(${hasSecond})">Continue →</button>
    </div>
  </div>
  <div class="journal-prompt"><strong>✏ Field Journal Prompt —</strong> write your response while the timer runs:<br><br>${ch.journalPrompt}</div>`;}

function screenGameOver(){return`
  <div style="text-align:center;padding:2rem 1rem">

      <div class="achievement-card"><span class="ac-icon">⛪</span><div class="ac-title">Religious Pluralism</div><div class="ac-desc">The permanent fracturing of Western Christianity — and, eventually, the principle that religious belief cannot be legitimately coerced. The path to religious freedom runs through Luther's Worms.</div></div>
      <div class="achievement-card"><span class="ac-icon">🔭</span><div class="ac-title">The Scientific Method</div><div class="ac-desc">Direct observation and mathematical reasoning as the basis for knowledge about the natural world. Copernicus, Galileo, Newton — the foundation of every scientific advance since.</div></div>
      <div class="achievement-card"><span class="ac-icon">📖</span><div class="ac-title">Vernacular Literature</div><div class="ac-desc">Shakespeare, Cervantes, Montaigne — serious literary and philosophical work in living languages, for everyone who speaks them. The novel, the essay, the drama as forms that survive to the present.</div></div>
      <div class="achievement-card"><span class="ac-icon">🧍</span><div class="ac-title">Individual Identity</div><div class="ac-desc">Dürer signing his name. Luther saying "here I stand." Galileo muttering "and yet it moves." The assertion that individual conscience and observation have authority — still contested, still fundamental.</div></div>
    </div>
  </div>

  <div class="discussion-questions">
    <h4>Final Discussion Questions — For the Year</h4>
    <p>1. The Renaissance spine question was: what happens when people start asking questions that established authorities cannot answer? Looking back at the whole year — which civilization handled this question best? Which handled it worst?</p>
    <p>2. The cave paintings at Chauvet are 36,000 years old. Dürer's self-portrait is 525 years old. Both are humans trying to create something that lasts. What changed — and what stayed the same?</p>
    <p>3. The printing press changed the Reformation the way the internet changed the Arab Spring. What technology in your own lifetime has changed what is possible in the same way — making ideas travel faster than any authority can suppress them?</p>
    <p>4. Galileo knew he was right. He recanted anyway. He reportedly muttered "and yet it moves." Was he right to recant — or should he have stood firm like Luther at Worms? What's the difference between the two situations?</p>
    <p>5. If you could add one thing to the Vitruvian Man's inscription — one thing about what humans are trying to do that Leonardo didn't write — what would it be?</p>
  </div>
  <button class="btn btn-gold" onclick="restart()">Play again as a different role</button>
  <button class="btn btn-secondary" onclick="restart()">Return to start</button>`;}

// ══════════════════════════════════════════════════════════════
//  ACTIONS
// ══════════════════════════════════════════════════════════════
function selectRole(id){state.role=id;state.chapterIndex=0;state.isRetry=false;state.retryCount=0;go("chapter");}

function makeChoice(i){
  const ch=CHAPTERS[state.chapterIndex];
  const choices=ch.choices[state.role]||[];
  const choice=choices[i];
  if(!choice.isPoison){applyStats(choice.statChange);}
  state.pendingOutcome=choice;
  if(isDead()){go("gameover");return;}
  go("outcome");
}

function retryChapter(){state.isRetry=true;state.retryCount++;state.pendingOutcome=null;go("chapter");}

function proceedFromOutcome(){
  const ch=CHAPTERS[state.chapterIndex];
  state.isRetry=false;state.retryCount=0;
  if(ch.discussAfter){startDiscussion();}else{advanceChapter();}
}

function startDiscussion(){state.discussPhase=0;go("discussion");}

function afterDiscussion(hasSecond){
  clearInterval(state.timerInterval);
  if(hasSecond&&state.discussPhase===0){state.discussPhase=1;go("discussion");}
  else{state.discussPhase=0;advanceChapter();}
}

function advanceChapter(){
  state.pendingOutcome=null;state.isRetry=false;state.retryCount=0;
  if(state.chapterIndex<CHAPTERS.length-1){state.chapterIndex++;go("chapter");}
  else{go("art_close");}
}

function restart(){
  clearInterval(state.timerInterval);
  state={screen:"art_open",role:null,chapterIndex:0,pendingOutcome:null,isRetry:false,retryCount:0,stats:{food:50,knowledge:50,wealth:50,standing:50},discussPhase:0,timerInterval:null};
  render();window.scrollTo({top:0,behavior:"smooth"});
}

// ══════════════════════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════════════════════
function render(){
  const el=document.getElementById("content");
  const screens={art_open:screenArtOpen,role_select:screenRoleSelect,chapter:screenChapter,outcome:screenOutcome,discussion:screenDiscussion,gameover:screenGameOver,art_close:screenArtClose,ending:screenEnding};
  el.innerHTML=(screens[state.screen]||(() => "<p>Loading...</p>"))();
}
render();
</script>
