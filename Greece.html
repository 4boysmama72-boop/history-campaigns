    number: 1,
    title: "Chapter 1 — The Sea Made Us",
    subtitle: "Geography, Trade, and the World Before City-States",
    scene: "Greece is not a country. It is a coastline — a jagged, island-scattered peninsula jutting into the Mediterranean, with mountains that divide communities from each other and a sea that connects them to everyone else. The soil is rocky and thin. The harbors are numerous and deep. Before the great city-states, before democracy, before philosophy — there were the Minoans on Crete and the Mycenaeans on the mainland, both of them sea-trading cultures whose wealth came from the water rather than the land. Around 1200 BCE both cultures collapsed — destroyed by a combination of drought, invasion, and internal conflict that historians call the Bronze Age Collapse. What emerged from that collapse, slowly, were the Greek city-states. And the sea was still there.",
    historyNote: "<strong>Greek Geography:</strong> Greece's mountainous terrain naturally divided its population into small, isolated communities — each developing its own government, culture, and identity. The sea compensated for the land's limitations. Greek colonies spread from Spain to the Black Sea. The Minoans of Crete (c. 2000-1400 BCE) built a sophisticated trading civilization with running water, artistic achievement, and evidence of significant female participation — the palace at Knossos is still one of the most extraordinary archaeological sites in the world. Their influence on later Greek culture was significant and largely uncredited.",
    journalPrompt: "Greece has poor farmland and an extraordinary coastline. How did geography push Greeks toward the sea — and what did the sea give them that the land could not?",
    poisonRoles: [],
    discussAfter: false,
    choices: {
      citizen: [
        { text: "Study the Minoan and Mycenaean precedents — what can their collapse teach about building durable civilizations?", hint: "Learn from failure", outcome: "good", result: "The Bronze Age Collapse is the most important event in Greek prehistory — and the least discussed. The Minoans and Mycenaeans were sophisticated, wealthy, and apparently stable. They collapsed anyway. The Greek city-states that emerged from that collapse developed something the earlier cultures lacked: decentralized political systems that could survive the failure of any single center. Your study of the collapse informs how you think about what Athens needs to survive.", statChange: { food: 5, arete: 15, wealth: 5, standing: 15 } },
        { text: "Focus on Athens's harbor — the Piraeus is the economic foundation of Athenian power", hint: "Geography as strategy", outcome: "good", result: "The Piraeus harbor is extraordinary — deep, protected, connected to Athens by the Long Walls. Whoever controls the sea controls the trade. Whoever controls the trade controls Athens. The politician who understands this understands Athenian power better than the philosopher who stays in the city. Themistocles built the fleet. Pericles built the Long Walls. You understand why.", statChange: { food: 5, arete: 10, wealth: 15, standing: 15 } },
        { text: "Advocate for Athenian expansion — colonies and naval presence extend Athenian power", hint: "Imperial ambition", outcome: "neutral", result: "Athenian colonization and naval presence extend the city's wealth and power. They also create the resentments that will eventually produce the Peloponnesian War. The expansion that makes Athens great also makes Athens enemies. Every imperial decision contains the seed of the conflict it will eventually produce. You are not wrong to want expansion. You are not thinking far enough ahead.", statChange: { food: 5, arete: 5, wealth: 15, standing: 10 } }
      ],
      philosopher: [
        { text: "Study the myths that explain the sea — Poseidon, the Odyssey, the stories of navigation and homecoming", hint: "Mythology as geographic thinking", outcome: "good", result: "The Odyssey is not just a story about a man trying to get home. It is a map of the Greek world — the islands, the currents, the peoples encountered along the way. Homer encoded Greek geographic knowledge in narrative form. The philosopher who reads it as both story and geography understands something about how knowledge was preserved before writing was widespread.", statChange: { food: 5, arete: 20, wealth: 0, standing: 10 } },
        { text: "Examine the idea that geography shapes character — does living by the sea make Greeks different?", hint: "Environmental philosophy", outcome: "good", result: "The argument is genuinely interesting. Herodotus will make a version of it — that the Greeks, living between Europe and Asia, between the soft comfort of eastern luxury and the harsh cold of the north, developed a particular kind of balanced character. The idea that environment shapes civilization is not wrong. It is also not the complete story. You pursue the question carefully.", statChange: { food: 5, arete: 20, wealth: 0, standing: 15 } },
        { text: "Question the myths about the Minoans — the stories of the Minotaur and the labyrinth may encode historical memory", hint: "Myth as history", outcome: "good", result: "The labyrinth at Knossos exists — it is the palace's complex floor plan, overwhelming to anyone who enters it. The Minotaur may encode Greek cultural memory of Minoan ritual, bull-worship, and the tribute that mainland Mycenaeans paid to Crete. Myth is not history. But myth often contains compressed historical memory that systematic inquiry can recover. This insight will make you a better philosopher.", statChange: { food: 0, arete: 20, wealth: 0, standing: 10 } }
      ],
      merchant: [
        { text: "Follow the Minoan trade routes — they mapped the Mediterranean before anyone else", hint: "Build on existing networks", outcome: "good", result: "The Minoan trade network — connecting Crete to Egypt, the Levant, Anatolia, and the Aegean islands — is the foundation on which later Greek commerce is built. The routes exist. The relationships exist. You are not starting from nothing — you are inheriting a commercial infrastructure that collapsed politically but survived commercially. The sea remembers the routes even when the civilizations that first sailed them are gone.", statChange: { food: 5, arete: 10, wealth: 20, standing: 15 } },
        { text: "Establish trading relationships with non-Greek peoples — the Phoenicians, Egyptians, and Lydians have things Greece needs", hint: "Cross-cultural commerce", outcome: "good", result: "The contact with Phoenician merchants produces something more valuable than any single trade good — the Phoenician alphabet, adapted into Greek letters. Egyptian contact produces mathematical and astronomical knowledge. Lydian contact produces coinage. Your commercial relationships are the vectors through which Greek civilization acquires the intellectual tools it will use to become extraordinary. Trade carries ideas.", statChange: { food: 10, arete: 15, wealth: 20, standing: 10 } },
        { text: "Invest in shipbuilding — the trireme that will define Greek naval power begins with merchant ship technology", hint: "Commercial infrastructure enables military power", outcome: "good", result: "The technology of Greek shipbuilding — developed through centuries of commercial navigation — is what makes the trireme possible. The warship emerges from the merchant vessel. Naval military power depends on the commercial shipping knowledge that merchants develop. Your investment in ship technology is simultaneously a commercial and a strategic decision, though you are only thinking commercially right now.", statChange: { food: 5, arete: 5, wealth: 20, standing: 15 } }
      ],
      artisan: [
        { text: "Study Minoan artistic techniques — the frescoes at Knossos represent the highest art of the pre-classical world", hint: "Learn from the predecessors", outcome: "good", result: "The Minoan frescoes at Knossos are astonishing — fluid, naturalistic, full of movement and color. Dolphins leaping. Young men leaping over bulls. Flowers in the wind. The Minoan artistic tradition is more naturalistic than anything in Egypt or Mesopotamia. Studying it gives you an understanding of a visual vocabulary that feeds into the classical Greek ideal of representing the human form at its most dynamic.", statChange: { food: 5, arete: 20, wealth: 5, standing: 15 } },
        { text: "Develop the black-figure pottery technique — create narrative scenes that travel with trade goods", hint: "Art as export", outcome: "good", result: "Black-figure pottery is the first mass-produced narrative art in history — scenes from mythology, athletics, daily life, painted on vessels that travel to every corner of the Mediterranean. Your pottery is found in Etruscan tombs in Italy, in Scythian burial mounds north of the Black Sea, in Egyptian marketplaces. The story of Greek civilization is partially the story of the objects your workshop produces.", statChange: { food: 5, arete: 15, wealth: 20, standing: 15 } },
        { text: "Observe how different cultural contacts change Greek artistic style", hint: "Cross-cultural artistic synthesis", outcome: "good", result: "The Orientalizing period — when Greek art absorbs influences from Phoenicia, Egypt, and the Near East — produces the sphinx, the griffin, the lotus pattern that appear on early Greek pottery. The contact with the wider world through trade changes what Greek art looks like. Artistic traditions are never purely local — they are always the product of exchange.", statChange: { food: 5, arete: 20, wealth: 10, standing: 10 } }
      ],
      soldier: [
        { text: "Study the collapse of the Bronze Age civilizations — what military failures destroyed the Minoans and Mycenaeans?", hint: "Military history as strategy", outcome: "good", result: "The Bronze Age Collapse involved military failure on a civilizational scale — the Mycenaean palace economies that organized military production collapsed, leaving communities defenseless. The lesson: military power cannot be centralized in palaces that can be destroyed. The polis — the city-state with its citizen militia — is partly a military innovation, distributing defense across the entire citizen body rather than concentrating it in palace warriors.", statChange: { food: 5, arete: 15, wealth: 5, standing: 15 } },
        { text: "Train in the phalanx formation — the military innovation that will define Greek warfare", hint: "Master the new military technology", outcome: "good", result: "The phalanx — a close formation of heavily armed infantry with overlapping shields — is the Greek military revolution. Its effectiveness depends on discipline and mutual trust rather than individual heroism. The soldier who breaks formation kills his neighbors. The soldier who holds it survives. The phalanx is a military argument for the value of civic cooperation — the same cooperation that makes democracy possible.", statChange: { food: 5, arete: 20, wealth: 5, standing: 15 } },
        { text: "Study naval warfare — the sea is where Greek military power will ultimately be decided", hint: "Naval strategy", outcome: "good", result: "The Battle of Salamis — where the Athenian fleet defeats the Persian navy — has not happened yet. But the strategic insight that Athens's power depends on naval supremacy is already available to anyone who looks at the map. You develop naval tactics and advocate for investment in the fleet. Themistocles will get credit for the fleet. The soldiers who trained for it made it possible.", statChange: { food: 5, arete: 15, wealth: 5, standing: 15 } }
      ],
      woman: [
        { text: "Study what the Minoan evidence suggests about women's roles before classical Greece", hint: "Find the world that was lost", outcome: "good", result: "The frescoes at Knossos show women in prominent positions — presiding over ceremonies, participating in athletics, serving as priestesses with apparent authority. The Linear A script that Minoan women appear to have used for administrative purposes remains undeciphered. Something changed between the Minoan world and classical Athens. The change was not inevitable. It was a choice someone made — many someones, over many generations. Knowing this matters.", statChange: { food: 5, arete: 20, wealth: 0, standing: 10 } },
        { text: "Manage the household economy — the oikos is the foundation of everything Athens builds", hint: "Invisible economic contribution", outcome: "neutral", result: "The household economy you manage — the food production, the textile work, the management of slaves, the raising of children who will become citizens — is the economic foundation of Athens. Without functional households, there is no surplus for the state. Without your work, there is no democracy. None of this appears in the official record of Athenian achievement. The foundation is always invisible to people standing on top of it.", statChange: { food: 10, arete: 10, wealth: 5, standing: 5 } },
        { text: "Find the spaces where women do have influence — religious festivals, household management, weaving Athena's robe", hint: "Work within the available space", outcome: "neutral", result: "The Panathenaic festival — Athens's greatest civic celebration — includes women in the procession. The women who weave the robe presented to Athena's statue are performing the city's most sacred civic act. Religion provides the limited public space available to you. You use it fully. The influence you exercise through religious participation is real and constrained simultaneously.", statChange: { food: 5, arete: 15, wealth: 0, standing: 10 } }
      ]
    }

    id: "ch2",

    title: "Chapter 2 — The World of the Polis",
    subtitle: "City-States, Identity, and Athens vs. Sparta",
    scene: "By 500 BCE Greece is organized into hundreds of independent city-states — poleis — each with its own government, currency, laws, and identity. The Greeks share a language, a mythology, and a general sense of cultural unity. They also compete ferociously, fight regularly, and occasionally destroy each other. Two city-states dominate: Athens, organized around commerce, democracy, and intellectual life; and Sparta, organized around military training, discipline, and collective sacrifice. They are both Greek. They could not be more different. The question your role must engage with: what is the polis for — and what does it demand of the people who live in it?",
    historyNote: "<strong>Athens and Sparta:</strong> Athens was a democracy (of a specific kind) with a powerful navy, a thriving commercial economy, and the greatest cultural production in the Greek world. Sparta was an oligarchy with the most powerful land army in Greece, an economy based on the labor of enslaved Helots, and a social system that subordinated every individual need to military readiness. Both cities considered themselves the truest expression of Greek values. Their competition defined the classical period.",
    journalPrompt: "Athens and Sparta were both Greek — same language, same gods, same myths. But they organized their societies completely differently. What does that difference tell you about whether there is one right way to build a civilization?",
    poisonRoles: [],
    discussAfter: false,
    choices: {
      citizen: [
        { text: "Defend Athenian democracy against Spartan criticism — Athens's model is genuinely superior", hint: "Advocate for your system", outcome: "good", result: "The Athenian defense of democracy is genuinely compelling. A system where citizens participate in their own governance produces citizens who understand and care about civic life. The Spartan system produces extraordinary soldiers — and very little else. Athens produces philosophy, art, architecture, drama, mathematics, and democracy simultaneously. Sparta produces the Spartans. Both are impressive achievements. Only one of them changes the world.", statChange: { food: 5, arete: 15, wealth: 5, standing: 20 } },
        { text: "Study the Spartan system seriously — its strengths reveal Athens's weaknesses", hint: "Learn from the rival", outcome: "good", result: "The Spartan system's strengths are real. Collective discipline. Individual sacrifice for the common good. Military readiness that Athens cannot match on land. The Spartan critique of Athenian democracy — that it is too easily manipulated by demagogues, too focused on individual comfort, too slow to make military decisions — is not entirely wrong. Understanding the critique makes you a better defender of what is genuinely right about Athens.", statChange: { food: 5, arete: 20, wealth: 5, standing: 15 } },
        { text: "Recognize that the competition between Athens and Sparta is making both cities stronger", hint: "Competition as catalyst", outcome: "neutral", result: "The competition is real and productive — in the short term. The rivalry between Athens and Sparta drives innovation in both cities. Athenian democracy deepens partly in response to Spartan criticism. Spartan military excellence pushes Athenian military investment. But competition between two powers that cannot coexist eventually produces conflict. The productive rivalry has a catastrophic end built into it.", statChange: { food: 5, arete: 10, wealth: 10, standing: 10 } }
      ],
      philosopher: [
        { text: "Compare Athenian and Spartan ideas of virtue — what does each city think arete means?", hint: "Philosophical comparison", outcome: "good", result: "For Sparta, arete is military excellence — courage, discipline, sacrifice. For Athens, arete is more complex — it includes wisdom, civic participation, artistic achievement, and yes, courage. The Spartan answer is simpler and more consistent. The Athenian answer is richer and harder to achieve. Plato will later argue that the true polis should combine Spartan discipline with Athenian wisdom. The Republic is the philosophical response to this comparison.", statChange: { food: 5, arete: 25, wealth: 0, standing: 15 } },
        { text: "Walk the agora asking what justice requires — Socrates's method applied to the city-state question", hint: "Apply philosophy to politics", outcome: "good", result: "The Socratic method applied to the city-state question produces uncomfortable answers. Is it just that Athens enslaves other Greeks through the Delian League? Is it just that Athens excludes women and foreigners from citizenship? Is it just that Sparta enslaves the Helots? The questions make everyone uncomfortable. That discomfort is the point. Philosophy that only confirms what people already believe is not philosophy. It is flattery.", statChange: { food: 0, arete: 25, wealth: 0, standing: 10 } },
        { text: "Write about what the ideal city-state would look like — the beginning of political philosophy", hint: "Ideal versus actual", outcome: "good", result: "Your writing on the ideal city-state begins the tradition of political philosophy — the systematic inquiry into what government should be rather than what it is. The gap between the ideal and the actual is where philosophy lives. Athens is better than Sparta in some ways. Both fall short of the ideal in ways that matter. The writing you produce today will eventually become what Plato systematizes in the Republic.", statChange: { food: 5, arete: 20, wealth: 5, standing: 15 } }
      ],
      merchant: [
        { text: "Trade with both Athens and Sparta — neutrality is commercially rational", hint: "Commercial neutrality", outcome: "good", result: "Athens needs grain from the Black Sea. Sparta needs bronze from Corinth. You supply both. The merchant who takes sides in city-state rivalries loses half the market. Commercial neutrality is both rational and genuine — your interests are served by all cities functioning, not by any one of them dominating. This will become untenable when war comes. For now it works.", statChange: { food: 5, arete: 5, wealth: 20, standing: 10 } },
        { text: "Advocate for the Delian League as a commercial alliance — common defense enables common commerce", hint: "Security enables trade", outcome: "good", result: "The Delian League — originally formed to resist Persian expansion — is also the most significant commercial alliance in Greek history. Common security enables the trade routes that connect the Aegean. You advocate for it as a commercial necessity, not just a military one. When Athens converts the league's treasury from Delos to Athens, you notice that the line between alliance and empire is thin.", statChange: { food: 5, arete: 10, wealth: 20, standing: 15 } },
        { text: "Note that Spartan society produces almost no tradeable goods — military states are not commercial partners", hint: "Military states and commerce", outcome: "neutral", result: "Sparta's economy is based on Helot agriculture — a system that produces food for Spartans and almost nothing for export. Sparta has no significant commercial class, no merchant fleet, and no interest in the trade networks that define Athenian power. The two cities are not just politically different — they represent completely different economic models. One of those models produces the wealth that funds civilization. The other produces soldiers.", statChange: { food: 5, arete: 10, wealth: 10, standing: 5 } }
      ],
      artisan: [
        { text: "Work in Athens — democracy and commerce create the wealthiest art market in Greece", hint: "Athens as art capital", outcome: "good", result: "The combination of democratic participation and commercial wealth makes Athens the most productive art center in the ancient world. Wealthy citizens commission work. The state commissions public buildings. The religious calendar requires ceremonial objects. The export trade requires pottery. You work constantly. The arete you pursue — craft excellence — finds its best market in the city that values excellence most broadly.", statChange: { food: 5, arete: 20, wealth: 20, standing: 20 } },
        { text: "Study how Spartan material culture differs from Athenian — simplicity as aesthetic choice", hint: "Comparative aesthetics", outcome: "neutral", result: "Sparta's deliberately simple material culture — plain pottery, undecorated buildings, functional weapons — is not poverty. It is philosophy. The Spartan rejection of luxury is a statement about what a city should value. Athenian aesthetics celebrate the beautiful as an expression of human excellence. Spartan aesthetics celebrate the functional as an expression of collective discipline. Both are coherent. Only one of them needs artisans.", statChange: { food: 5, arete: 15, wealth: 5, standing: 10 } },
        { text: "Begin work on the preliminary designs for a major temple commission — Athens is planning something unprecedented", hint: "Prepare for the great commission", outcome: "good", result: "The rumors in the workshop are that Pericles is planning something extraordinary on the Acropolis. A new temple to Athena. Larger than anything built before. Funded by the Delian League treasury. The architectural challenge is unprecedented. You begin preliminary studies. The commission that will define your career — and Greek architecture forever — is coming. The Parthenon is being imagined.", statChange: { food: 5, arete: 20, wealth: 10, standing: 15 } }
      ],
      soldier: [
        { text: "Train in the Athenian phalanx — citizen soldiers defending their own democracy", hint: "Citizen militia as democratic ideal", outcome: "good", result: "The Athenian citizen militia is both a military and a political institution. The same men who vote in the Assembly fight in the phalanx. The connection between military service and political participation is explicit — citizenship means both the right to vote and the obligation to fight. This produces soldiers with a stake in what they are defending. It also produces political decisions made by people who understand military consequences personally.", statChange: { food: 5, arete: 20, wealth: 5, standing: 15 } },
        { text: "Study Spartan military training — know your potential enemy and your potential ally", hint: "Know Sparta", outcome: "good", result: "Spartan military training is the most intensive in the ancient world — beginning at age seven, continuous through adulthood, eliminating every non-military activity. The result is the most reliable infantry in Greece. In open battle on flat ground, the Spartan phalanx is nearly undefeatable. You study it with respect. You also note its limitations — Sparta struggles with siege warfare, naval combat, and any situation requiring flexibility rather than disciplined formation.", statChange: { food: 5, arete: 20, wealth: 5, standing: 15 } },
        { text: "Fight at Marathon — the Persian Wars are the defining military experience of this generation", hint: "The Persian Wars as formation", outcome: "good", result: "The Battle of Marathon — 490 BCE, ten thousand Athenians and Plataeans against perhaps twenty-five thousand Persians — produces a Greek victory that seems impossible even to those who achieve it. The runner who carries the news to Athens collapses and dies after delivering it. You were there. The victory defines Athenian self-confidence for a generation and produces the conditions that make the golden age possible.", statChange: { food: 5, arete: 25, wealth: 5, standing: 20 } }
      ],
      woman: [
        { text: "Notice that Spartan women have more freedom than Athenian women — and consider what that means", hint: "Comparative gender analysis", outcome: "good", result: "Spartan women own property, manage estates, exercise publicly, and speak openly on civic matters. They are not citizens — but they are not confined to the household either. The city that Athens considers its most dangerous rival gives its women more freedom than Athens does. If Sparta — militaristic, austere, hierarchical — can do this, Athens has no philosophical argument for why it cannot. You notice this. No one in power is listening.", statChange: { food: 5, arete: 20, wealth: 0, standing: 10 } },
        { text: "Find community with other women — shared understanding of your position is knowledge the polis ignores", hint: "Community as resource", outcome: "good", result: "The women's festivals — the Thesmophoria, the Adonia — are the only civic occasions organized by and for women without male oversight. In these spaces, women share information, form alliances, and maintain the social networks that male public life excludes them from. The polis thinks these festivals are religious events. They are also political ones — the only political space available to half the population.", statChange: { food: 5, arete: 15, wealth: 0, standing: 15 } },
        { text: "Manage the household so well that your husband has the freedom to participate in democratic life", hint: "Invisible enabling", outcome: "neutral", result: "The democracy your husband participates in is possible because you have freed him from domestic responsibility. His political participation rests on your domestic management. The Assembly could not function if citizens had to cook their own food, weave their own cloth, and raise their own children simultaneously. The democracy is built on your invisible labor. The democracy does not acknowledge this.", statChange: { food: 10, arete: 5, wealth: 5, standing: 5 } }
      ]
    }

  {
    id: "ch3",
    number: 3,
    title: "Chapter 3 — The Great Experiment",
    subtitle: "Democracy — Who It Includes, Who It Doesn't",
    scene: "It is 450 BCE, the height of Athenian democracy under Pericles. The Assembly meets regularly on the Pnyx hill. Forty thousand Athenian citizens are eligible to participate. They debate, vote, hold officials accountable, and serve on juries. This is the most direct democracy in human history — and it is genuinely extraordinary. It is also built on a foundation that the democracy itself refuses to examine: the exclusion of women, enslaved people, and foreign residents from the political community. Pericles has just delivered his Funeral Oration — the most celebrated speech in Greek history, praising Athens as the school of Greece. Every role in this chapter experiences the same speech from a different position.",
    historyNote: "<strong>Athenian Democracy:</strong> At its height, Athenian democracy included approximately 40,000 eligible male citizens out of a total population of perhaps 300,000 — meaning roughly 85% of the people in Athens had no political voice. Women, enslaved people (who may have numbered 80,000-100,000), and foreign residents (metics) were all excluded. The democracy was also funded partly by tribute from Delian League members — essentially an Athenian empire financing its democracy through the taxation of other Greeks.",
    journalPrompt: "Pericles calls Athens 'the school of Greece' and celebrates its democracy. After this chapter — who is he talking to, and who is he not talking to?",
    poisonRoles: ["woman"],
    discussAfter: true,
    discussPrompt: "Your table just experienced Athenian democracy from one perspective. The table next to you experienced the same democracy from a completely different position. Before you continue — spend 90 seconds comparing: what could your role do in this democracy that theirs couldn't? What could theirs do that yours couldn't?",
    choices: {
      citizen: [
        { text: "Speak in the Assembly — exercise the democratic right that makes Athens extraordinary", hint: "Participate fully", outcome: "good", result: "You speak. The Assembly listens, debates, votes. The process is imperfect — demagogues exist, the crowd can be manipulated, decisions are sometimes catastrophically wrong. But the process itself is genuinely revolutionary. No king decided this. No priest blessed it. Citizens decided it — imperfectly, humanly, together. The speech you give today will not be remembered. The system that allowed it might change the world.", statChange: { food: 5, arete: 20, wealth: 5, standing: 20 } },
        { text: "Propose extending citizenship to longtime foreign residents — the democracy should include more people", hint: "Reform from within", outcome: "neutral", result: "The proposal is rejected. Athenian citizenship is jealously guarded — Pericles himself passed the citizenship law that restricted it to those with two Athenian citizen parents. The democracy that prides itself on openness is legally committed to its own exclusivity. Your reform proposal fails. The argument you made is recorded. The question you raised will not go away.", statChange: { food: 5, arete: 15, wealth: 0, standing: 5 } },
        { text: "Sit with the contradiction — celebrate democracy's genuine achievements while acknowledging its exclusions", hint: "Honest civic reflection", outcome: "good", result: "The contradiction is real and important. Athens produced democracy, philosophy, art, and architecture that changed the world. Athens also enslaved tens of thousands of people, excluded half its population from political life, and funded its golden age partly through imperial extraction from other Greeks. Both things are true simultaneously. The civilization that invented self-examination should be examined with the tools it created.", statChange: { food: 5, arete: 25, wealth: 5, standing: 15 } }
      ],
      philosopher: [
        { text: "Question Pericles's Funeral Oration publicly — the speech is beautiful and incomplete", hint: "Apply philosophy to political speech", outcome: "good", result: "The Oration celebrates Athenian democracy's openness. You ask: open to whom? It celebrates Athens as a place where worth is recognized regardless of class. You ask: including women? Including slaves? Including the Delian League members whose tribute funded the Parthenon? The questions are Socratic — not rhetorical attacks but genuine inquiries. The crowd is uncomfortable. Pericles is gracious. The questions remain unanswered.", statChange: { food: 0, arete: 25, wealth: 0, standing: 10 } },
        { text: "Teach in the agora — bring philosophy to the people democracy claims to serve", hint: "Democratize philosophy", outcome: "good", result: "Socrates's method is democratic in the deepest sense — it requires no tuition, no admission, no special status. Anyone who wants to think rigorously is welcome. You teach citizens, merchants, slaves when you can, foreigners, and women who seek you out. The philosophical community you build is more inclusive than the political community the democracy officially sanctions. This irony is not lost on you.", statChange: { food: 5, arete: 25, wealth: 0, standing: 15 } },
        { text: "Write about the gap between democratic ideals and democratic practice", hint: "Philosophy as democratic critique", outcome: "good", result: "The gap between what Athens claims to be and what it actually is — this is where philosophy lives. The examined life that Socrates preaches requires examining institutions as much as individuals. A democracy that has never examined its own exclusions is a democracy that has not fully examined itself. You write carefully, aware that Athens has limits on how much self-examination it tolerates.", statChange: { food: 5, arete: 20, wealth: 0, standing: 10 } }
      ],
      merchant: [
        { text: "Note that you — wealthy, tax-paying, Athens-resident — still cannot vote because you were not born here", hint: "The metic's democratic exclusion", outcome: "neutral", result: "You pay Athenian taxes. You serve in the Athenian military when required. You contribute to the Athenian economy that funds the democracy you cannot participate in. The word for your status — metic, resident alien — captures the situation precisely. You reside. You are alien. The democracy that Pericles celebrates is not for you, despite everything you contribute to it.", statChange: { food: 5, arete: 10, wealth: 10, standing: 5 } },
        { text: "Support the democracy financially — wealthy merchants fund the festivals and warships that make Athens function", hint: "Buy influence through contribution", outcome: "good", result: "The liturgy system — wealthy residents funding public goods in exchange for honor — gives you something democracy denies you: civic recognition. You fund a trireme. Your name appears in the records as a benefactor of Athens. It is not a vote. It is the closest available substitute. The democracy that excludes you still needs your money. That dependency is its own form of leverage.", statChange: { food: 5, arete: 10, wealth: -10, standing: 20 } },
        { text: "Build wealth regardless of political exclusion — economic power compensates for political powerlessness", hint: "Wealth as alternative power", outcome: "good", result: "Political exclusion does not prevent commercial success. You build your trading network. Your wealth grows. The citizens who cannot vote you into the Assembly still need your goods, your credit, and your commercial relationships. Economic power and political power are not the same thing. In Athens, citizens hold political power. You hold economic power. The two powers need each other.", statChange: { food: 5, arete: 5, wealth: 20, standing: 10 } }
      ],
      artisan: [
        { text: "Work on the Parthenon — the greatest building commission in Greek history", hint: "Participate in Athens's greatest achievement", outcome: "good", result: "The Parthenon is everything Greek architecture aspires to — mathematical precision, apparent imperfection that corrects for optical illusion, sculpture of unprecedented quality, a building that seems to breathe rather than sit on its foundations. You work on it and understand that you are making something that will outlast everything else your generation produces. The democracy funded it controversially. The building itself is uncontroversial.", statChange: { food: 5, arete: 25, wealth: 20, standing: 20 } },
        { text: "Notice that the Parthenon is funded by Delian League tribute — and feel the complexity of that", hint: "Art and empire", outcome: "neutral", result: "The Parthenon is the most beautiful building in the ancient world. It is funded by money that Athens collected from allied city-states who thought they were paying for mutual defense against Persia. Pericles moved the treasury from Delos to Athens and used it for building projects. The allies objected. Athens ignored them. The building is extraordinary. Its funding is imperial. Both things are permanently true.", statChange: { food: 5, arete: 20, wealth: 10, standing: 10 } },
        { text: "Create pottery showing scenes of democratic life — art documenting the experiment in real time", hint: "Art as historical record", outcome: "good", result: "Your pottery becomes a documentary record of Athenian democratic life — the Assembly, the symposium, the agora, the courts. Future historians will use these images to reconstruct what Athenian daily life actually looked like. The official records tell us what decisions were made. Your pottery tells us what it looked like when citizens made them. Both are necessary for understanding what democracy actually was.", statChange: { food: 5, arete: 15, wealth: 15, standing: 15 } }

        { text: "Serve the democracy as a hoplite — military service and citizenship are inseparable in Athens", hint: "The soldier-citizen", outcome: "good", result: "The hoplite who votes in the Assembly and fights in the phalanx is the same person. Athenian military service is democratic service — you fight for a system you participate in, defended by the same men you govern with. This connection between military obligation and political participation is one of Athens's most important innovations. The soldier who has a stake in the outcome fights differently than the mercenary who does not.", statChange: { food: 5, arete: 20, wealth: 5, standing: 20 } },
        { text: "Question the decision to use Delian League funds for the Parthenon — military alliances should not fund building projects", hint: "Military critique of imperial policy", outcome: "neutral", result: "The military critique is legitimate. The Delian League was formed for defense against Persia. Using the treasury for Athenian building projects breaks the alliance's founding purpose. Your objection is noted and ignored. The Parthenon is built. The allies' resentment accumulates. The Peloponnesian War — which you will fight — is partly a consequence of exactly the imperial overreach you are objecting to now.", statChange: { food: 5, arete: 15, wealth: 0, standing: 10 } },
        { text: "Train rigorously — Athens needs soldiers who can protect the democracy from external threats", hint: "Defense of democracy", outcome: "good", result: "The democracy needs defending. The Persian Wars demonstrated that Greek freedom is not guaranteed. Sparta waits to the south. The Aegean is full of smaller city-states that resent Athenian power. Your military excellence is what makes the political experiment possible — without soldiers willing to defend it, democracy is just words in the Assembly. Words matter. Shields matter more.", statChange: { food: 5, arete: 20, wealth: 5, standing: 15 } }
      ],

        { text: "Listen to the Funeral Oration from outside the official gathering — hear what democracy sounds like from outside it", hint: "Witness exclusion", outcome: "neutral", result: "Pericles's words are beautiful. Athens is the school of Greece. Every citizen participates. Worth is recognized regardless of class. You listen. You are not a citizen. Your worth is not recognized in the political sphere regardless of your character or intelligence. The speech celebrates a democracy you are categorically excluded from. The beauty of the speech and the injustice of your position exist simultaneously. This is your life in Athens.", statChange: { food: 0, arete: 15, wealth: 0, standing: -5 }, poison: true },
        { text: "Find Aspasia — the most intellectually influential woman in Athens — and learn how she navigates the constraints", hint: "Find the model of influence within limits", outcome: "good", result: "Aspasia of Miletus influences Athenian policy through Pericles. She teaches rhetoric. She participates in philosophical discussions that her status as a woman and a foreigner technically disqualify her from. The route available to her — influence through a powerful man, intelligence deployed through available channels — is compromised and real simultaneously. She is not free. She is not powerless. You learn from her example and resent that it is the only one available.", statChange: { food: 5, arete: 20, wealth: 0, standing: 10 }, poison: true },

    subtitle: "When a Civilization Starts Questioning Its Own Stories",
    scene: "The Greeks do something extraordinary and historically unprecedented: they tell stories about gods who are petty, jealous, and morally complicated — and simultaneously develop a philosophical tradition that asks whether those stories are literally true. Mythology and philosophy emerge from the same culture at nearly the same time. Homer writes the Iliad and the Odyssey. Hesiod writes the Theogony — the birth of the gods. And then Thales, Pythagoras, Socrates, Plato, Aristotle — one after another — develop systematic ways of asking questions that do not depend on mythology for their answers. What does arete actually require in a world where Zeus may or may not exist?",
    historyNote: "<strong>Greek Philosophy:</strong> The Pre-Socratic philosophers — Thales, Anaximander, Heraclitus, Democritus — tried to explain the natural world through observation and reason rather than mythology. Socrates shifted the focus to ethics and human life. Plato systematized Socratic ideas. Aristotle applied systematic reasoning to biology, physics, politics, ethics, and aesthetics. The tradition they created — using reason rather than authority to answer fundamental questions — is the foundation of Western intellectual life.",

        { text: "Attend the theater — the great tragedies and comedies are civic events as much as entertainment", hint: "Culture as democratic participation", outcome: "good", result: "The Athenian theater is funded by the state and attended by all citizens. Tragedies — Aeschylus, Sophocles, Euripides — explore the relationship between human choice and divine will, the limits of political power, the nature of justice. The plays are entertainment and civic education simultaneously. A democracy needs citizens who can think about tragic choices. The theater trains that capacity.", statChange: { food: 5, arete: 20, wealth: 5, standing: 15 } },
        { text: "Engage with Socrates in the agora — let the philosopher's questions improve your civic judgment", hint: "Philosophy serving democracy", outcome: "good", result: "The Socratic dialogue is uncomfortable and valuable simultaneously. He asks you what justice is. Your first answer is confident. His questions dismantle it. Your second answer is better. His questions find its limits too. By the end of the conversation you know more clearly what you don't know — which, Socrates insists, is the beginning of wisdom. A citizen who knows what they don't know makes better decisions.", statChange: { food: 5, arete: 25, wealth: 0, standing: 10 } },
        { text: "Honor the gods properly — philosophy and religion can coexist in a healthy polis", hint: "Both traditions have value", outcome: "good", result: "The religious and philosophical traditions need not be enemies. You make your sacrifices at the appropriate festivals and also attend philosophical discussions. The gods provide meaning, community, and ritual connection to the cosmos. Philosophy provides method, precision, and the tools to examine your own beliefs. Both serve the examined life Socrates recommends.", statChange: { food: 5, arete: 15, wealth: 5, standing: 15 } }
      ],
      philosopher: [
        { text: "Pursue the Socratic method relentlessly — question everything, including the questioner", hint: "Philosophy without limits", outcome: "good", result: "The method works — and it produces enemies. People who discover they do not know what they thought they knew often blame the person who revealed this rather than the ignorance that was revealed. Socrates is becoming the most famous and most disliked man in Athens simultaneously. You follow his example. The questions get harder. The discomfort grows. The wisdom accumulates.", statChange: { food: 0, arete: 30, wealth: 0, standing: 10 } },
        { text: "Study mathematics and astronomy — Pythagoras showed that reason can discover truths about the cosmos", hint: "Mathematical philosophy", outcome: "good", result: "The Pythagorean insight — that mathematical relationships describe the actual structure of reality — is one of the most powerful ideas in human history. If the cosmos obeys mathematical laws, then reason can discover those laws without relying on mythology. The implications are enormous. You study mathematics as philosophy — the first step toward a scientific understanding of the world that does not require divine explanation.", statChange: { food: 5, arete: 25, wealth: 5, standing: 15 } },
        { text: "Write about the relationship between the gods and human morality — do the gods make something right, or do they recognize what is already right?", hint: "The Euthyphro question", outcome: "good", result: "This is the question Socrates asks Euthyphro in the dialogue that eventually contributes to his trial. Is something holy because the gods love it, or do the gods love it because it is holy? The question cuts at the foundation of divine-command morality. If morality depends on the gods' arbitrary choice, it has no stable foundation. If the gods recognize what is already moral, then morality exists independently of the gods. The question has no comfortable answer.", statChange: { food: 0, arete: 30, wealth: 0, standing: 5 } }
      ],

        { text: "Patronize the arts — fund the theater productions that make Athens culturally extraordinary", hint: "Commerce funding culture", outcome: "good", result: "The liturgy system makes wealthy merchants into cultural patrons. You fund a dramatic chorus. Your name appears in the festival program. The theater that produces Sophocles and Euripides is funded partly by people like you — successful merchants whose wealth flows into cultural production. Commerce funding culture is not a contradiction. It is the mechanism that makes golden ages possible.", statChange: { food: 5, arete: 15, wealth: -10, standing: 20 } },
        { text: "Engage with the philosophical questions that apply to commerce — is profit-seeking compatible with arete?", hint: "Philosophy of commerce", outcome: "good", result: "The philosophical tradition is not uniformly hostile to commerce. Aristotle will distinguish between economics — the management of household resources for genuine need — and chrematistics — the accumulation of wealth beyond need. Your commercial activity serves genuine needs. Where it stops serving genuine needs and starts serving accumulation for its own sake is a question you engage with honestly. The examined merchant is better at their work than the unexamined one.", statChange: { food: 5, arete: 20, wealth: 10, standing: 10 } },
        { text: "Observe how different cultures — Egyptian, Phoenician, Persian — answer the same religious questions differently", hint: "Cross-cultural religious observation", outcome: "good", result: "Your trading contacts expose you to religious diversity that most Athenians never encounter. The Egyptians have gods for everything. The Phoenicians sacrifice differently than Greeks. The Persians worship Ahura Mazda — one supreme deity — in a way that seems radically different from Greek polytheism and yet produces equally functional civilizations. The diversity you observe makes the question of which religion is correct feel more genuinely open.", statChange: { food: 5, arete: 15, wealth: 15, standing: 10 } }
      ],

        { text: "Make pottery showing the myths — Achilles, Odysseus, the gods — give the stories visual form", hint: "Art preserving mythology", outcome: "good", result: "The myths live in your pottery as much as in the epics. The scene you paint of Achilles and Ajax playing dice before Troy — two of the greatest heroes in Greek mythology, gambling while the war goes on around them — is both a story and a philosophical statement about fate, heroism, and the human condition. Art preserves mythology. Art also asks questions about it.", statChange: { food: 5, arete: 20, wealth: 15, standing: 15 } },
        { text: "Pursue technical perfection — arete in craft means making something as close to ideal as human hands can achieve", hint: "Craft excellence as philosophy", outcome: "good", result: "The pursuit of arete in craft is itself philosophical. What is the ideal form of a vessel? What are the mathematical proportions that make a building beautiful? The questions Plato asks about ideal forms — what makes a chair a chair, what makes beauty beautiful — have their practical equivalent in your workshop. The artisan who pursues technical perfection is asking the same questions as the philosopher. Both seek the ideal beneath the actual.", statChange: { food: 5, arete: 25, wealth: 15, standing: 20 } },
        { text: "Work on the Parthenon sculptures — give the gods a human form that embodies Greek ideals", hint: "Theology through sculpture", outcome: "good", result: "The sculptural program of the Parthenon makes a theological statement: the gods look like idealized humans. The same proportions, the same musculature, the same dynamic poses — but perfected. Greek theology is embodied in Greek aesthetics. The god who looks like the best possible version of a human is a very different theological claim than the Egyptian god with an animal head or the Babylonian god beyond human comprehension.", statChange: { food: 5, arete: 25, wealth: 20, standing: 20 } }
      ],
      soldier: [
        { text: "Honor the gods before battle — religious practice and military practice are inseparable", hint: "Religion and military life", outcome: "good", result: "The sacrifice before battle is not superstition. It is the moment of collective acknowledgment that what you are about to do matters — that lives are at stake, that the outcome is uncertain, that something larger than individual soldiers is involved. Whether the gods actually intervene in battles is a question for philosophers. The sacrifice produces the shared ritual focus that makes a phalanx fight as a unit rather than a collection of individuals.", statChange: { food: 5, arete: 15, wealth: 5, standing: 15 } },
        { text: "Engage with the philosophical questions about courage — is it enough to be brave, or must bravery serve justice?", hint: "Philosophy of military virtue", outcome: "good", result: "Socrates himself served as a hoplite — at Potidaea, at Delium, at Amphipolis. He is not asking theoretical questions about courage. He is asking questions a soldier who has experienced battle asks. What is courage? Is it the same as recklessness? Can you be courageous fighting for an unjust cause? The questions matter to you personally. You engage with them.", statChange: { food: 5, arete: 25, wealth: 5, standing: 15 } },
        { text: "Train for the Olympic games — athletic excellence as the embodiment of arete", hint: "Athletic excellence", outcome: "good", result: "The Olympics are not just athletic competition. They are the embodiment of the Greek ideal of arete — the pursuit of excellence for its own sake, in the presence of all Greeks, witnessed by the gods. The athlete who wins at Olympia demonstrates what the human body can achieve when pushed to its absolute limit. Military training and athletic training overlap — both pursue excellence through discipline. Both are expressions of what Greeks mean by greatness.", statChange: { food: 5, arete: 25, wealth: 5, standing: 20 } }
      ],
      woman: [

        { text: "Participate in the religious festivals that give women philosophical space", hint: "Religion as philosophical practice for women", outcome: "good", result: "The religious festivals available to women — particularly those honoring Demeter and Persephone — contain within them profound meditations on loss, renewal, the relationship between living and dead, and the cycles of nature. The philosophy embedded in religious practice is less systematic than Socratic dialogue. It is also more ancient and more emotionally complete. You participate fully and think carefully about what you are doing.", statChange: { food: 5, arete: 20, wealth: 0, standing: 15 } },
        { text: "Notice that the philosophy produced by Athens rarely asks about women's arete — and consider what that omission means", hint: "The absence as evidence", outcome: "good", result: "Plato's Republic imagines philosopher-queens. Aristotle concludes that women are by nature suited to the domestic sphere. The philosophical tradition produces both the most progressive and the most limiting ideas about women in the ancient world. What it does not produce — except in Plato's remarkable exception — is a sustained inquiry into what women's arete actually requires. The omission is itself a philosophical statement about who philosophy considers worth examining.", statChange: { food: 0, arete: 25, wealth: 0, standing: 10 } }

    scene: "It is 431 BCE. Athens and Sparta have been building toward war for decades. The immediate cause is a dispute between Corinth and Corcyra in which Athens intervenes. The deeper cause is Sparta's fear of Athenian power and Athens's refusal to accept limits on that power. The war that follows lasts twenty-seven years. A plague kills perhaps a quarter of Athens's population including Pericles. Athens's catastrophic expedition to Syracuse ends with the destruction of its fleet and army. And at the end — after all that death — Athens makes the decision that will haunt it forever. The democracy votes to try Socrates. He is found guilty. He drinks the hemlock.",
    historyNote: "<strong>The Peloponnesian War (431-404 BCE):</strong> The war ended with Spartan victory and the brief installation of the Thirty Tyrants in Athens. Democracy was restored but Athens never fully recovered its power. The trial and execution of Socrates in 399 BCE — after the war's end, when Athens was traumatized and looking for scapegoats — is one of history's most examined events. Socrates was charged with impiety and corrupting the youth. He was offered exile but chose to remain and accept the jury's verdict.",

        { text: "Vote to execute Socrates — the traumatized city needs stability, not philosophical provocation", hint: "Democratic complicity", outcome: "bad", result: "You vote guilty. Two hundred and eighty citizens vote the same way. The man who spent his life asking Athens to examine itself is executed by the democracy he lived within. The charge is impiety and corrupting the youth. The real charge is asking questions during a time of crisis that a traumatized city cannot bear to hear. The vote is democratic. It is also wrong. Both things are true.", statChange: { food: 0, arete: -15, wealth: 0, standing: 5 }, poison: true },

    subtitle: "Alexander, the Hellenistic World, and the DBQ Question",
    scene: "It is 334 BCE. Alexander III of Macedon — twenty-two years old, tutored by Aristotle, militarily brilliant, possibly the most charismatic leader in the ancient world — has crossed into Persian territory with thirty-seven thousand soldiers. Over the next eleven years he will conquer the Persian Empire, Egypt, Central Asia, and reach India before his exhausted army finally refuses to go further. He spreads Greek language, culture, and philosophy across an area larger than any previous empire. He also ends the era of the independent Greek city-state — the democracy, the polis, the Assembly — forever. He dies at thirty-two in Babylon, and his empire immediately fragments. Was he great? Your role has just lived through six chapters of Greek civilization. You are now the most qualified person in your classroom to answer that question.",
    historyNote: "<strong>Alexander and Judaism:</strong> When Alexander conquered Judea in 332 BCE, he continued his established policy of allowing conquered peoples to maintain their religious practices and local laws. Jewish communities under Alexander and his successors were generally permitted to observe Jewish law, maintain their own courts for internal matters, and practice their religion without compulsion. This policy of relative tolerance — compared to the Babylonian exile that had preceded it — shaped Jewish life in the Hellenistic world and created the conditions for the Jewish diaspora communities that would later be so significant in the ancient Mediterranean world.",
    journalPrompt: "Based on everything your role experienced across six chapters of Greek civilization — the geography, the democracy, who it included, the philosophy, the war, and now Alexander — was Alexander truly great? What does your role's specific experience tell you about what 'great' actually means?",
    poisonRoles: [],
    discussAfter: true,

let state = {
  screen: "art_open",
  role: null,
  chapterIndex: 0,
  pendingOutcome: null,
  stats: { food: 50, arete: 50, wealth: 50, standing: 50 },
  timerInterval: null,
};

function go(s) { state.screen = s; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
function getRole() { return ROLES.find(r => r.id === state.role); }
function clamp(v) { return Math.max(0, Math.min(100, v)); }
function applyStats(change) { if (!change) return; for (let k in change) { if (state.stats[k] !== undefined) state.stats[k] = clamp(state.stats[k] + change[k]); } }
function statColor(v) { return v >= 60 ? "#6ABF6A" : v >= 35 ? "#E8C840" : "#E05050"; }
function isDead() { return state.stats.food <= 0; }

function areteResult(v) {
  if (v >= 75) return { icon: "🏆", title: "True Arete Achieved", text: "Your choices pursued excellence in a way that the Greeks would have recognized — not just skill or success, but the genuine pursuit of the best your role could be. The philosopher who questioned everything, the citizen who voted with conscience, the artisan who pursued perfection, the woman who found wisdom within constraint — all are forms of arete. You found yours." };
  if (v >= 50) return { icon: "🫒", title: "Arete Pursued", text: "Your choices pursued excellence imperfectly — as most people do. The Greeks understood that arete is a direction, not a destination. The soldier who fights with courage and doubts the war's justice. The merchant who profits and asks whether the profit serves something beyond profit. You pursued the question. That pursuit is itself a form of excellence." };
  if (v >= 25) return { icon: "⚖️", title: "Arete Contested", text: "Your choices often prioritized immediate advantage over genuine excellence. The Greeks would not condemn you for this — they understood that human nature pulls toward self-interest. But arete requires something more than self-interest. The examined life Socrates preached is the life that asks whether what you are pursuing is actually worth pursuing." };
  return { icon: "🔥", title: "Arete Missed", text: "Your choices moved away from excellence rather than toward it. The Greek tradition does not judge this harshly — it simply notes that the unexamined life is not worth living. The question is not whether you failed to achieve arete. The question is whether you examined why." };
}

function renderStats() {
  const defs = [
    { key: "food", label: "Food", icon: "🌾" },
    { key: "arete", label: "Arete", icon: "⚡" },
    { key: "wealth", label: "Wealth", icon: "⚓" },
    { key: "standing", label: "Standing", icon: "🏛️" },
  ];
  return `<div class="stats-row">${defs.map(d => {
    const v = state.stats[d.key];
    return `<div class="stat-box"><span class="stat-icon">${d.icon}</span><div class="stat-label">${d.label}</div><div class="stat-value" style="color:${statColor(v)}">${Math.round(v)}</div><div class="stat-track"><div class="stat-fill" style="width:${v}%;background:${statColor(v)}"></div></div></div>`;
  }).join("")}</div>`;
}

function renderProgress() {
  const dots = CHAPTERS.map((c, i) => `<div class="prog-dot ${i < state.chapterIndex ? 'done' : i === state.chapterIndex ? 'active' : ''}"></div>`).join("");
  return `<div class="progress-row">${dots}<span class="prog-label">Chapter ${state.chapterIndex + 1} of ${CHAPTERS.length}</span></div>`;
}

function screenChapter() {

  return `

    ${renderStats()}

function screenOutcome() {
  const ch = CHAPTERS[state.chapterIndex];
  const o = state.pendingOutcome;
  const outcomeClass = o.poison ? "outcome-poison" : `outcome-${o.outcome}`;
  const outcomeLabel = o.outcome === "good" ? "✓ What happened" : o.outcome === "bad" ? "✗ What happened" : o.poison ? "⚠ The constrained choice" : "→ What happened";
  return `
    ${renderProgress()}
    ${renderStats()}
    <div class="outcome-box ${outcomeClass}"><div class="outcome-label">${outcomeLabel}</div>${o.result}</div>
    ${ch.discussAfter
      ? `<button class="btn btn-aegean" onclick="startDiscussion()">Continue to table discussion →</button>`
      : `<div class="journal-prompt"><strong>✏ Field Journal Prompt —</strong> answer before your teacher signals to continue:<br><br>${ch.journalPrompt}</div>
         <button class="btn btn-aegean" onclick="advanceChapter()">${state.chapterIndex < CHAPTERS.length - 1 ? 'Continue →' : 'See how your story ends →'}</button>`}`;
}

function screenDiscussion() {
  const ch = CHAPTERS[state.chapterIndex];
  clearInterval(state.timerInterval);
  setTimeout(() => {
    let secs = 90;
    state.timerInterval = setInterval(() => {
      secs--;
      const el = document.getElementById("timer-display");
      const fill = document.getElementById("timer-fill");
      const btn = document.getElementById("cont-btn");
      if (el) el.textContent = `${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`;
      if (fill) fill.style.width = `${(secs/90)*100}%`;
      if (secs <= 0) { clearInterval(state.timerInterval); if (btn) btn.classList.add("ready"); }
    }, 1000);
  }, 100);
  return `
    ${renderProgress()}
    <div class="discussion-box">
      <div class="disc-header">⏱ Table Discussion — 90 seconds</div>
      <div class="disc-prompt">${ch.discussPrompt}</div>
      <div class="timer-row">
        <div class="timer-display" id="timer-display">1:30</div>
        <div class="timer-track"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>

      </div>

}

      <p>1. Athens invented democracy and executed its greatest philosopher. Does that contradiction make Athens less great — or does it reveal something true about all human systems?</p>
      <p>2. The Woman role experienced six chapters of being excluded from Greek greatness. Based on that experience — what does it mean to call a civilization great if half its population is excluded from that greatness?</p>
      <p>3. Athens and Sparta were both Greek — same gods, same language, same myths. But they organized society completely differently. What does that tell you about whether there is one right way to build a civilization?</p>
      <p>4. Alexander spread Greek culture across the known world. He also ended Greek democratic independence forever. Using your role's specific experience — was he great?</p>
      <p>5. Arete means excellence — being the best version of what you are meant to be. Who in Greek civilization got to define what each person was meant to be? And whose definition of arete did Alexander spread?</p>
    </div>
    <button class="btn btn-aegean" onclick="restart()">Play again as a different role</button>
    <button class="btn btn-secondary" onclick="restart()">Return to start</button>`;
}

function selectRole(id) { state.role = id; state.chapterIndex = 0; go("chapter"); }
function makeChoice(i) {
  const ch = CHAPTERS[state.chapterIndex];
  const choice = ch.choices[state.role][i];
  applyStats(choice.statChange);
  state.pendingOutcome = choice;
  if (isDead()) { go("gameover"); return; }
  go("outcome");
}
function startDiscussion() { go("discussion"); }
function afterDiscussion() { clearInterval(state.timerInterval); advanceChapter(); }
function advanceChapter() {
  state.pendingOutcome = null;
  if (state.chapterIndex < CHAPTERS.length - 1) { state.chapterIndex++; go("chapter"); }
  else { go("art_close"); }
}
function restart() {
  clearInterval(state.timerInterval);
  state = { screen: "art_open", role: null, chapterIndex: 0, pendingOutcome: null, stats: { food: 50, arete: 50, wealth: 50, standing: 50 }, timerInterval: null };
  render(); window.scrollTo({ top: 0, behavior: "smooth" });
}

function render() {
  const el = document.getElementById("content");
  const screens = { art_open: screenArtOpen, role_select: screenRoleSelect, chapter: screenChapter, outcome: screenOutcome, discussion: screenDiscussion, gameover: screenGameOver, art_close: screenArtClose, ending: screenEnding };
  el.innerHTML = (screens[state.screen] || (() => "<p>Loading...</p>"))();
}
render();
</script>
</body>
</html>
