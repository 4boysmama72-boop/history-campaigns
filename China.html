    scene: "The Yellow River — Huang He — carries more silt than any river on earth. Its floods deposit some of the richest agricultural soil in the world across the North China Plain. They also destroy everything in their path without warning. The ancient Chinese called it 'China's Sorrow' and 'The Ungovernable.' It is approximately 1600 BCE, during the Shang dynasty — one of China's earliest recorded civilizations. Your role has just arrived at the river for the first time and is making sense of what you see.",
    historyNote: "<strong>The Yellow River:</strong> China's second-longest river gets its name from the yellow loess silt it carries — the same silt that makes the North China Plain extraordinarily fertile. Unlike the Nile's predictable annual flood, the Yellow River flooded unpredictably and catastrophically, changing course entirely multiple times in recorded history. Chinese civilization developed partly as an organized response to managing this river — requiring the kind of centralized coordination that produces states.",
    journalPrompt: "You have now seen four river civilizations — Mesopotamia, Egypt, India, and now China. What is the same about all of them? What is different about China's relationship with its river?",
    poisonRoles: [],
    discussAfter: false,
    choices: {
      official: [
        { text: "Study the flood control systems — whoever masters the river masters China", hint: "Administrative control of geography", outcome: "good", result: "The flood control infrastructure is the foundation of everything. Dikes, irrigation channels, early warning systems — these are not engineering projects, they are political projects. The dynasty that manages the Yellow River keeps its people fed and its Mandate of Heaven secure. The dynasty that fails at flood control loses both. You understand this better than any philosopher.", statChange: { food: 15, harmony: 10, wealth: 10, standing: 15 } },
        { text: "Survey the agricultural potential — the silt deposits determine tax revenue", hint: "Revenue assessment first", outcome: "good", result: "The survey is revealing. The areas of richest silt deposit are also the most flood-prone — the best farmland is the most dangerous. Your tax assessments must account for this volatility. A fixed tax on flood-prone farmland produces famine during bad years. A flexible system tied to actual harvest produces stability. You are already thinking like a Chinese administrator.", statChange: { food: 10, harmony: 10, wealth: 15, standing: 10 } },
        { text: "Consult the Shang oracle bones — divine guidance for the river's management", hint: "Ritual before administration", outcome: "neutral", result: "The oracle bones are consulted. The ancestors are asked. The answer, as always, is ambiguous enough to support whatever decision the king has already made. You perform your ritual duty. You also quietly commission an engineering survey of the flood defenses. Divine and practical are not opposites in China. They are colleagues.", statChange: { food: 5, harmony: 15, wealth: 5, standing: 10 } }
      ],
      scholar: [
        { text: "Study the river's patterns — Confucius taught that the superior person observes nature carefully", hint: "Nature as teacher", outcome: "good", result: "The river teaches patience, persistence, and the futility of forcing nature into shapes it does not want to take. The flood control systems that work with the river's natural tendencies outlast those that try to dominate it. Confucius did not write about flood engineering. But his principle — that harmony requires understanding rather than force — applies perfectly here.", statChange: { food: 5, harmony: 20, wealth: 5, standing: 15 } },
        { text: "Write about the river as a metaphor for good governance — the ruler who guides rather than commands", hint: "Philosophy from geography", outcome: "good", result: "The metaphor writes itself. The ruler who tries to stop the flood by force loses everything. The ruler who channels it, guides it, works with its nature — keeps the fields fertile and the people fed. The Taoists will say the same thing. You arrived at it through Confucian observation. Sometimes the same wisdom appears in different philosophical clothing.", statChange: { food: 5, harmony: 20, wealth: 5, standing: 10 } },
        { text: "Teach the local farmers the classical texts — civilization begins with proper education", hint: "Education as priority", outcome: "neutral", result: "The farmers listen politely. What they need is better flood prediction and fairer tax assessment. Your classical texts are genuinely valuable — but not more immediately valuable than knowing when the river will rise. You have learned something Confucius would have endorsed: theory must connect to the actual conditions of people's lives.", statChange: { food: 0, harmony: 15, wealth: 0, standing: 10 } }
      ],
      farmer: [
        { text: "Build your fields on the elevated ground — less fertile but safer from flooding", hint: "Safety over yield", outcome: "neutral", result: "The elevated fields produce reliably but modestly. During the flood years that destroy your neighbors' lower fields, your family eats. During the good years when lower fields are extraordinarily productive, your family eats adequately. You have traded peak prosperity for consistent survival. In a landscape defined by 'China's Sorrow,' this is not a bad trade.", statChange: { food: 10, harmony: 5, wealth: 0, standing: 5 } },
        { text: "Farm the flood plain — the silt makes the soil extraordinary and the risk is worth it", hint: "High risk, high yield", outcome: "neutral", result: "Three good years. Then the river rises faster than anyone predicted. Your harvest is lost. Your tools are underwater. Your family survives on stored grain and the goodwill of neighbors. The flood plain gave you three abundant years and one catastrophic one. The math works out — barely. This is what 'China's Sorrow' means from ground level.", statChange: { food: 5, harmony: 0, wealth: -10, standing: 5 } },
        { text: "Join the community irrigation cooperative — collective water management reduces individual risk", hint: "Community over individual", outcome: "good", result: "The cooperative distributes both the labor of flood management and the risk of flood damage. No single family loses everything because the community absorbs the blow. The Chinese irrigation cooperative tradition — one of the oldest forms of collective organization in the world — begins with exactly this logic: the river is too big for any family alone.", statChange: { food: 15, harmony: 15, wealth: 5, standing: 15 } }
      ],
      artisan: [
        { text: "Work with the river's bronze deposits — the Yellow River valley's metal resources are extraordinary", hint: "Geography enables craft", outcome: "good", result: "The bronze from the Yellow River valley is the foundation of Shang dynasty craft. Your ritual vessels — the ding tripods, the gui bowls, the jue wine cups — are not just objects. They are cosmological statements, connecting the human world to the ancestors and the divine. The river's minerals become China's most sophisticated art.", statChange: { food: 5, harmony: 10, wealth: 20, standing: 20 } },
        { text: "Study the river's patterns to incorporate them into your designs — Chinese craft reflects the natural world", hint: "Nature in craft", outcome: "good", result: "The sinuous lines of river water, the patterns of rippling silt, the organic forms of flood-carved landscape — all of these enter your work. Chinese aesthetic tradition, from the earliest Shang bronzes to the landscape paintings of later dynasties, is fundamentally about finding the human relationship to the natural world. You are beginning that tradition.", statChange: { food: 5, harmony: 15, wealth: 15, standing: 15 } },
        { text: "Secure contracts for the ritual objects the Shang royal court needs", hint: "Commercial priority", outcome: "good", result: "The Shang court's ritual needs are extensive — oracle bone ceremonies, ancestor worship, royal burials all require objects of extraordinary quality. Your workshop secures the contracts. The work is demanding, the compensation significant, and the objects you produce will be excavated by archaeologists three thousand years from now and displayed in museums worldwide.", statChange: { food: 5, harmony: 5, wealth: 20, standing: 15 } }
      ],
      merchant: [
        { text: "Map the river's trade routes — the Yellow River connects China's agricultural heartland to its cities", hint: "River as highway", outcome: "good", result: "The river highway carries grain south, bronze north, silk east, and information in all directions. Your mental map of the river's commercial possibilities is more detailed than any official survey. The merchant's map of China is drawn in goods and prices, not in administrative districts. Both maps describe the same place. Yours is more useful for making money.", statChange: { food: 10, harmony: 5, wealth: 20, standing: 10 } },
        { text: "Trade in grain during flood years — scarcity creates opportunity", hint: "Crisis commerce", outcome: "neutral", result: "The flood year grain trade is profitable and politically dangerous. Officials who see merchants profiting from farmers' misfortune have a Confucian framework ready for condemnation. You make money. You make enemies. The two things will accompany each other throughout your career.", statChange: { food: 0, harmony: -10, wealth: 20, standing: -10 } },
        { text: "Invest in flood control infrastructure — protect the supply chain you depend on", hint: "Long-term commercial thinking", outcome: "good", result: "You fund a section of the community dike. Your investment protects your supply chain — the farmers who cannot produce during flood years cannot buy your goods or sell you grain. Infrastructure investment is commerce by another name. The Confucian officials who would normally look down on you find your contribution useful. Usefulness, you have discovered, is the merchant's best argument.", statChange: { food: 10, harmony: 15, wealth: 5, standing: 15 } }
      ],
      soldier: [
        { text: "Study the Yellow River as a strategic asset — it defines China's defensible geography", hint: "Military geography", outcome: "good", result: "The river is a natural defensive line and a supply route simultaneously. The civilizations that China must defend against — nomadic peoples of the northern steppes — cannot easily cross its lower reaches. Your strategic assessment of the river matches what Chinese military planners will understand for the next three thousand years: geography is the first fact of defense.", statChange: { food: 5, harmony: 10, wealth: 5, standing: 15 } },
        { text: "Help organize the flood emergency response — military discipline applied to disaster relief", hint: "Military capacity for civilian use", outcome: "good", result: "The flood emergency response requires exactly the kind of organized, hierarchical, disciplined labor that military training produces. Your unit moves sandbags, evacuates villages, and coordinates supply distribution with an efficiency civilian administrators cannot match. The emperor notes the military's usefulness in disaster. This expands your budget. Disaster relief as military mission begins here.", statChange: { food: 15, harmony: 15, wealth: 5, standing: 15 } },
        { text: "Train on the river's banks — military readiness above all else", hint: "Mission focus", outcome: "neutral", result: "Training continues. Your unit is ready. For what, specifically, changes with every dynasty. The Yellow River is peaceful this season. The Xiongnu are quiet. You train anyway because a soldier who stops training stops being a soldier. The discipline that defines you is also the discipline that makes you useful when the river rises or the nomads probe the border.", statChange: { food: 5, harmony: 5, wealth: 0, standing: 10 } }
      ]
    }

    title: "Chapter 2 — The Mandate of Heaven",
    subtitle: "Who Decides When a Ruler Has Failed?",
    scene: "It is the late Zhou dynasty — approximately 500 BCE. The central Zhou authority is fragmenting. Competing warlords control different regions of China. Natural disasters have struck several provinces. The philosophers call this the Warring States period. Confucius walks from court to court trying to find a ruler willing to govern by moral example. In this chaos, the ancient idea of the Mandate of Heaven — Tianming — becomes urgently relevant. The Son of Heaven rules because Heaven approves. When Heaven withdraws its approval, the dynasty falls and a new one rises. But who decides when that moment has arrived?",
    historyNote: "<strong>The Mandate of Heaven:</strong> The Zhou dynasty developed the concept of Tianming — the Mandate of Heaven — to legitimize their overthrow of the Shang. Heaven (Tian) granted the right to rule to virtuous leaders and withdrew it from corrupt or incompetent ones. Natural disasters, peasant rebellions, and military defeats were all interpreted as signs that Heaven was withdrawing its favor. This concept justified every subsequent dynasty change in Chinese history.",
    journalPrompt: "The Mandate of Heaven says rulers govern by Heaven's approval — and lose that approval when they fail their people. Who benefits from this idea? Who does it protect — and who does it leave vulnerable?",
    poisonRoles: ["official"],
    discussAfter: false,
    choices: {
      official: [
        { text: "Serve the current dynasty loyally regardless of its failings — loyalty is a Confucian virtue", hint: "Loyalty over judgment", outcome: "neutral", result: "You serve loyally. The dynasty continues to fail. Your loyalty is noted and rewarded with continued employment. The people you administer continue to suffer under policies you know are wrong. The Confucian virtue of loyalty and the Confucian virtue of remonstrance — speaking truth to power — are in direct conflict. You have chosen loyalty. The cost of that choice is visible in your district.", statChange: { food: 0, harmony: -5, wealth: 10, standing: 10 }, poison: true },
        { text: "Advise the ruler honestly about the signs of Heaven's disapproval — remonstrance is also a virtue", hint: "Speak truth to power", outcome: "good", result: "The advice is not welcome. The ruler hears it anyway. Some of your recommendations are implemented — the tax burden is reduced in the worst-affected provinces, the flood relief is better organized. The dynasty falls anyway, a generation later, but the suffering between now and then is measurably reduced by your honesty. Remonstrance is the harder virtue. It is also the more important one.", statChange: { food: 10, harmony: 20, wealth: -5, standing: 10 } },
        { text: "Begin quietly positioning yourself to serve the next dynasty — practical survival over philosophical loyalty", hint: "Pragmatic transition planning", outcome: "neutral", result: "The positioning is politically intelligent and morally uncomfortable. You keep your options open, build relationships with the emerging powers, and manage your exit from the failing dynasty gracefully. When the transition comes, your administrative expertise transfers smoothly to the new regime. You have survived. The people your district serves have also survived, served by a competent administrator who stayed in place. Both things are true.", statChange: { food: 5, harmony: -10, wealth: 10, standing: 15 }, poison: true }
      ],
      scholar: [
        { text: "Write about the ruler's obligation to the people — the Mandate is conditional on moral governance", hint: "Define the Mandate philosophically", outcome: "good", result: "Your text on the conditional nature of the Mandate becomes one of the foundational documents of Chinese political philosophy. The ruler who governs well keeps Heaven's favor. The ruler who fails the people loses it. The implication — that the people's welfare is the ultimate measure of legitimate authority — is more radical than it sounds. It will echo through Chinese political thought for two thousand years.", statChange: { food: 5, harmony: 20, wealth: 5, standing: 20 } },
        { text: "Travel to the courts of different warlords looking for a ruler willing to govern by moral example", hint: "The philosopher as political consultant", outcome: "neutral", result: "The journey is long and largely unsuccessful. Most warlords want military advice, not moral philosophy. Two courts find your counsel briefly interesting before deciding that Legalist advisors produce faster results. You return home having planted seeds in several courts that will germinate, slowly, over generations. Confucius himself traveled for thirteen years without finding the ruler he sought. You are following his example.", statChange: { food: -5, harmony: 15, wealth: -5, standing: 15 } },
        { text: "Establish a school — teach the next generation of officials the principles of Confucian governance", hint: "Long-term philosophical investment", outcome: "good", result: "The school produces graduates who carry Confucian principles into government service across multiple warring states. None of them can implement a full Confucian governance model in the chaos of the Warring States period. But they create a network of officials who share a philosophical framework — the foundation that the Han dynasty will eventually build on to make Confucianism the official state philosophy.", statChange: { food: 5, harmony: 20, wealth: 5, standing: 20 } }
      ],
      farmer: [
        { text: "Watch the signs of Heaven's displeasure — floods, droughts, plagues — and decide when to stop paying taxes to a failing dynasty", hint: "Read the Mandate from ground level", outcome: "neutral", result: "The signs are clear. The floods are worse than usual. The tax collectors take more than before. The soldiers who pass through your village are more desperate and less disciplined. You reduce your tax payment to what you can actually afford. The collectors accept less than they demand. The dynasty is failing in exactly the way the Mandate of Heaven predicts — from the bottom up, one farm at a time.", statChange: { food: 10, harmony: 5, wealth: 5, standing: -5 } },
        { text: "Support a local leader who claims Heaven's favor has shifted — join the rebellion", hint: "Active participation in dynasty change", outcome: "neutral", result: "The rebellion succeeds in your district. The local leader who claimed Heaven's favor proves to be a reasonably competent governor. Your tax burden decreases. Your village's flood management improves. Whether Heaven actually withdrew its favor from the old dynasty or whether your village simply had a better military option available is a question you do not spend much time on.", statChange: { food: 10, harmony: 5, wealth: 5, standing: 10 } },
        { text: "Keep your head down — dynasty changes are dangerous for farmers regardless of which side wins", hint: "Survival through invisibility", outcome: "neutral", result: "You survive the transition. Both sides demand grain from your village during the conflict. You give both sides what you cannot afford to withhold and hide what you cannot afford to give. When the new dynasty establishes itself, you pay taxes to the new collectors with the same resigned efficiency you brought to the old ones. Farmers outlast dynasties by not choosing sides.", statChange: { food: 5, harmony: 5, wealth: -5, standing: 5 } }
      ],
      artisan: [
        { text: "Continue producing ritual objects regardless of which dynasty is in power — craft transcends politics", hint: "Artistic continuity through political chaos", outcome: "good", result: "Your workshop serves whoever holds power. The ritual vessels required by Zhou ceremony are essentially the same ones required by whatever dynasty follows. The shapes change slightly. The purposes remain identical. Your craft is more durable than any particular dynasty — which is, in a quiet way, a form of power.", statChange: { food: 5, harmony: 10, wealth: 15, standing: 15 } },
        { text: "Produce objects that communicate the new dynasty's legitimacy — art as political statement", hint: "Craft serving the Mandate", outcome: "good", result: "Every new dynasty needs objects that say it belongs here, that Heaven approves, that the old order has been properly superseded. Your workshop provides those objects. The bronze ritual vessels, the jade seals, the ceremonial weapons — all of them communicate the new regime's claim to the Mandate. You are not making propaganda. You are making legitimacy visible.", statChange: { food: 5, harmony: 5, wealth: 20, standing: 15 } },
        { text: "Document the artistic traditions of the failing dynasty — preserve what might otherwise be lost", hint: "Cultural preservation", outcome: "good", result: "The transition between dynasties is when cultural knowledge is most vulnerable. Workshops are disrupted, masters die, techniques disappear. Your documentation — detailed records of methods, designs, material sources — preserves craft knowledge across the transition. Future artisans in the new dynasty will use your records. The art outlasts the politics that commissioned it.", statChange: { food: 5, harmony: 15, wealth: 5, standing: 15 } }
      ],
      merchant: [
        { text: "Supply both sides during the Warring States conflicts — neutrality is profitable", hint: "War as market", outcome: "neutral", result: "Both sides need grain, weapons, supplies. You supply both. Your profits are extraordinary. Your reputation among both sides is functional — everyone knows you sell to anyone with silver. When the conflict resolves, the winning side needs merchants who know the supply networks. You are exactly that merchant. Neutrality has costs. It also has a very particular kind of value.", statChange: { food: 5, harmony: -10, wealth: 25, standing: -5 } },
        { text: "Back the likely winner early — first-mover advantage in dynasty transitions", hint: "Political investment", outcome: "good", result: "Your early support of the emerging power — grain at favorable prices, intelligence about supply routes, warehouse access — is remembered when the transition succeeds. The new dynasty needs merchants who supported it. Your contracts improve. Your official standing improves, temporarily, before Confucian philosophy reasserts the merchant's low social position. The window between dynasty transitions is your best moment.", statChange: { food: 5, harmony: 5, wealth: 20, standing: 15 } },
        { text: "Use the chaos to establish new trade routes the previous dynasty had blocked", hint: "Opportunity in disorder", outcome: "good", result: "Chaos reduces enforcement. Routes previously taxed or blocked are suddenly accessible. You establish commercial relationships with distant regions that were administratively off-limits. When order returns, the routes you established during chaos become legitimate trade connections. The merchant who moves fastest during political transition often ends up with the best position when stability returns.", statChange: { food: 5, harmony: -5, wealth: 20, standing: 10 } }
      ],
      soldier: [
        { text: "Remain loyal to the current dynasty until the Mandate clearly shifts — then reassess", hint: "Principled loyalty with limits", outcome: "good", result: "The line between loyalty and complicity is one soldiers navigate in every civilization. You serve the current dynasty competently while watching the signs. When the Mandate clearly shifts — when the emperor can no longer supply or pay his army — you make your decision. The soldier who changes sides at the right moment is called pragmatic. The soldier who stays too long is called a martyr.", statChange: { food: 5, harmony: 15, wealth: 5, standing: 15 } },
        { text: "Follow whoever can actually supply and pay the troops — armies run on logistics", hint: "Practical military loyalty", outcome: "neutral", result: "The dynasty that can supply its troops holds its army. The dynasty that cannot loses them — gradually, then suddenly. You follow the supplies. This is not noble. It is also not stupid. An army that fights for a dynasty that cannot feed it loses regardless of its loyalty. Military history is full of soldiers whose noble loyalty to failing dynasties produced nothing but their own deaths.", statChange: { food: 10, harmony: -5, wealth: 10, standing: 5 } },
        { text: "Use the Warring States period to advance your military career — chaos creates opportunity for skilled soldiers", hint: "Personal advancement through conflict", outcome: "neutral", result: "The Warring States period produces extraordinary military innovation — Sun Tzu's Art of War is written during this period. Your skills are in demand. Your career advances. The cost is that you spend the most productive years of your life in one of the most violent periods of Chinese history, serving several different masters, building something personal while the civilization around you fragments.", statChange: { food: 5, harmony: -5, wealth: 10, standing: 20 } }
      ]

    subtitle: "Confucianism, Legalism, and Taoism Face the Same Problem",
    scene: "It is 221 BCE. Qin Shi Huang has just unified China for the first time — defeating all the warring states and declaring himself the First Emperor. He is brilliant, ruthless, and has no patience for philosophical debate. He has chosen Legalism as his governing philosophy: strict laws, harsh punishments, absolute obedience, and — most devastatingly for Confucian scholars — the burning of books and the burying of scholars who disagree. Three philosophies exist to answer the same question: how do you create a stable, harmonious society? The Qin Emperor has chosen one. Every role in your civilization now lives with that choice.",
    historyNote: "<strong>Three Philosophies:</strong> Confucianism taught that social harmony comes from proper relationships and moral example — rulers govern by virtue, children honor parents, officials speak truth to power. Legalism taught that human nature is selfish and only strict law with severe punishment produces order. Taoism taught that the best governance is minimal — go with the natural flow of things rather than imposing artificial order. All three emerged during the Warring States period as answers to the same crisis.",

        { text: "Hide your Confucian texts and privately maintain your philosophical principles while publicly serving Legalism", hint: "Survive to fight another day", outcome: "good", result: "The texts survive. You survive. When the Qin dynasty collapses — only fifteen years after unification — and the Han dynasty restores Confucian governance, you are one of the officials who remembers how it works. The choice to hide rather than resist or abandon was the choice that made your later influence possible. Survival is not always cowardice. Sometimes it is the necessary precondition for contribution.", statChange: { food: 5, harmony: 10, wealth: 5, standing: 10 } },

        { text: "Flee to a remote region where the emperor's reach is limited — preserve yourself and your knowledge", hint: "Survival through withdrawal", outcome: "neutral", result: "The remote region is uncomfortable and isolated. You teach a small group of students in what feels like exile. When the Qin dynasty collapses — faster than anyone expected — you return. Your students carry Confucian principles that were preserved specifically because you had the wisdom to leave. The Taoists would say you followed the natural flow rather than fighting the flood. They might be right.", statChange: { food: 5, harmony: 15, wealth: -10, standing: 5 } },
        { text: "Argue publicly against the book burning — some principles are worth dying for", hint: "Principled resistance", outcome: "bad", result: "You argue publicly. You are arrested. You are among the scholars buried alive in the pits outside the capital. Your students witness this. The courage of your death becomes part of what they teach — the Confucian scholar who would not be silent. Your knowledge dies with you. Your example does not. Both things happen simultaneously. This is your poison pill.", statChange: { food: -10, harmony: 25, wealth: -20, standing: -20 }, poison: true }
      ],

        { text: "Work on the Qin road and canal infrastructure — practical construction serving the empire", hint: "Infrastructure craft", outcome: "good", result: "The Qin road network — standardized width, standardized axle gauges for carts, rest houses at regular intervals — is an engineering masterpiece. The canals that connect rivers across southern China transform agricultural productivity. Your work on this infrastructure outlasts the Qin dynasty by centuries. The roads Qin built the Han used. The canals the Qin dug still exist.", statChange: { food: 5, harmony: 5, wealth: 15, standing: 15 } },

        { text: "Comply fully with Legalist commercial regulations — the punishments for non-compliance are severe", hint: "Compliance as survival", outcome: "neutral", result: "Full compliance. Standardized weights on every scale. Accurate records for every transaction. Taxes paid in the new currency at the prescribed rate. The Legalist commercial environment is more transparent and more controlled than anything before it. Your profits are smaller — the regulations eliminate the gray areas where you previously made money. They also eliminate the corrupt officials who previously extracted money from you. It evens out.", statChange: { food: 5, harmony: -5, wealth: 10, standing: 5 } },
        { text: "Use the new road network to establish trade connections that will outlast the Qin dynasty", hint: "Build for the long term", outcome: "good", result: "The Qin road network is the best commercial infrastructure China has ever had. You use it aggressively while it exists, establishing trade connections with distant regions that will survive the dynasty's collapse. When the Han comes and the roads remain, your network is already in place. The Qin dynasty was short. The roads it built lasted centuries. You built your business on the roads, not the dynasty.", statChange: { food: 5, harmony: 0, wealth: 20, standing: 10 } }

      ],
      artisan: [
        { text: "Produce silk of the highest quality for the international market — the world is waiting", hint: "Craft for global demand", outcome: "good", result: "The international silk market rewards quality with prices that the domestic market never offered. Roman merchants pay extraordinary sums for the finest Chinese silk — silk so fine it can be read through. Your workshop's reputation travels west with the goods. Artisans in your tradition will eventually be the most sought-after luxury producers in the ancient world. The Silk Road is named for what you make.", statChange: { food: 5, harmony: 5, wealth: 30, standing: 20 } },
        { text: "Learn techniques from the artisans arriving via the Silk Road — Parthian metalwork, Indian textile patterns, Central Asian dyeing methods", hint: "Craft synthesis through trade", outcome: "good", result: "The artisans who arrive with caravans bring techniques unknown in China. Parthian metalwork. Indian textile patterns. Central Asian dyeing methods. Your workshop synthesizes these with Chinese craft traditions to produce objects unlike anything made before — the first truly international luxury goods. The objects that emerge from this synthesis will end up in tombs from Japan to Egypt.", statChange: { food: 5, harmony: 10, wealth: 20, standing: 20 } },
        { text: "Guard the secret of silk production — China's economic advantage depends on no one else knowing how to make it", hint: "Protect the trade secret", outcome: "neutral", result: "The secret holds — for now. Silk production remains a Chinese monopoly for centuries. The economic advantage is significant. Rome spends an estimated one third of its treasury on Chinese silk. The secret eventually leaks — silkworm eggs smuggled to Byzantium in hollow canes in the 6th century CE. But that is centuries away. For now, the secret is yours, and the world's silver flows toward your workshop.", statChange: { food: 5, harmony: 5, wealth: 20, standing: 15 } }
      ],
      merchant: [
        { text: "Build the Silk Road trading operation — this is your moment and your vindication", hint: "The merchant's greatest chapter", outcome: "good", result: "Everything the Confucian social hierarchy said about merchants — that you produce nothing, that your work is the least valuable kind — collapses against the reality of the Silk Road. You move silk from Chinese workshops to Roman aristocrats. You carry glass from Rome to Chinese emperors. You connect civilizations that would otherwise never meet. The philosophy that placed you at the bottom of the social hierarchy has no answer for what you have built.", statChange: { food: 10, harmony: 15, wealth: 30, standing: 20 } },
        { text: "Develop the caravanserai network — rest houses, water sources, security arrangements across the entire route", hint: "Infrastructure as commerce", outcome: "good", result: "The Silk Road only works if merchants can travel it safely. The caravanserai network — rest houses at regular intervals with water, fodder, and security — is the infrastructure that makes the road functional. You build it because it serves your commercial interest. It also serves every other merchant who follows the route. The infrastructure you build for profit becomes the public good that enables everyone else's profit too.", statChange: { food: 5, harmony: 15, wealth: 25, standing: 20 } },
        { text: "Carry Buddhist monks along with your trade goods — religious travel and commercial travel use the same roads", hint: "Trade and religion intertwined", outcome: "good", result: "The Buddhist monks who travel with your caravans bring their faith to communities along the route. You bring them safely through territory that would be dangerous for travelers without commercial cover. The trade road and the pilgrimage road are the same road. Buddhism spreads to China partly because merchants like you provided safe passage. The Silk Road carries everything.", statChange: { food: 5, harmony: 20, wealth: 20, standing: 15 } }
      ],
      soldier: [
        { text: "Escort and protect the caravans — the road needs security to function", hint: "Military enables commerce", outcome: "good", result: "The Silk Road protection mission transforms your role from wall defender to road guardian. The distances involved are enormous — you patrol routes that extend thousands of miles into Central Asia. The cultures you encounter are unlike anything in Chinese military training. You learn to negotiate as much as fight, to establish relationships with local powers rather than simply intimidate them. The road makes you a different kind of soldier.", statChange: { food: 10, harmony: 15, wealth: 15, standing: 20 } },
        { text: "Establish Chinese military presence in Central Asian oasis cities — project power along the route", hint: "Strategic military expansion", outcome: "good", result: "The garrison cities you establish in the Tarim Basin and Central Asian oases become the anchor points of Chinese influence along the Silk Road. The military presence protects the trade routes and projects Han power further west than any previous Chinese military force. The oasis cities become cosmopolitan trading centers — Chinese, Parthian, Indian, and local cultures mixing in the shadow of Chinese garrison walls.", statChange: { food: 5, harmony: 10, wealth: 10, standing: 20 } },
        { text: "Report back on what you encounter — military intelligence from the world beyond China", hint: "Soldier as explorer", outcome: "good", result: "Your reports on the peoples, terrain, military capacities, and trade goods of Central Asia and beyond are the most detailed intelligence the Han court has ever received about the wider world. The Han emperor reads your dispatches with the same attention he gives to reports on the Xiongnu. You have extended China's strategic vision beyond its traditional borders. The soldier as geographer is a Han innovation.", statChange: { food: 5, harmony: 10, wealth: 10, standing: 20 } }
      ]
    }
  }
];

// ══════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════
let state = {
  screen: "art_open",
  role: null,
  chapterIndex: 0,
  pendingOutcome: null,
  stats: { food: 50, harmony: 50, wealth: 50, standing: 50 },
  inDiscussion: false,
  timerInterval: null,
};

function go(s) { state.screen = s; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
function getRole() { return ROLES.find(r => r.id === state.role); }
function clamp(v) { return Math.max(0, Math.min(100, v)); }
function applyStats(change) { if (!change) return; for (let k in change) { if (state.stats[k] !== undefined) state.stats[k] = clamp(state.stats[k] + change[k]); } }
function statColor(v) { return v >= 60 ? "#6ABF6A" : v >= 35 ? "#E8C840" : "#E05050"; }
function isDead() { return state.stats.food <= 0; }

function harmonyResult(v) {
  if (v >= 75) return { icon: "☯️", title: "Great Harmony", text: "Your choices aligned with the Confucian ideal of harmonious relationship — proper conduct between people, between rulers and subjects, between humans and the natural order. The five relationships held. The empire functioned as it should. What you contributed to Chinese civilization will be felt for generations." };
  if (v >= 50) return { icon: "⚖️", title: "Balanced Order", text: "Your choices maintained basic social harmony while navigating the inevitable tensions of Chinese civilization — between Legalism and Confucianism, between isolation and connection, between the wall and the road. Most Chinese people across most dynasties lived exactly this navigation. It is not the Confucian ideal. It is the Chinese reality." };
  if (v >= 25) return { icon: "🌊", title: "Disrupted Harmony", text: "Your choices prioritized individual or factional interest over the larger social harmony. In Confucian terms, the five relationships were not properly maintained. This does not make you a villain — Chinese history is full of people who disrupted harmony for understandable reasons. But the cost of disruption in a civilization that values order above almost everything else is real." };
  return { icon: "🔥", title: "Broken Harmony", text: "Your choices contributed significantly to social disruption. The Mandate of Heaven concept suggests that when harmony breaks down sufficiently, dynastic change follows. You may have been on the wrong side of that dynamic, or on the right side of a necessary change, depending on your perspective and your dynasty." };
}

function renderStats() {
  const defs = [
    { key: "food", label: "Food", icon: "🌾" },
    { key: "harmony", label: "Harmony", icon: "☯️" },
    { key: "wealth", label: "Wealth", icon: "💰" },
    { key: "standing", label: "Standing", icon: "📋" },
  ];
  return `<div class="stats-row">${defs.map(d => {
    const v = state.stats[d.key];
    return `<div class="stat-box"><span class="stat-icon">${d.icon}</span><div class="stat-label">${d.label}</div><div class="stat-value" style="color:${statColor(v)}">${Math.round(v)}</div><div class="stat-track"><div class="stat-fill" style="width:${v}%;background:${statColor(v)}"></div></div></div>`;
  }).join("")}</div>`;
}

function renderProgress() {
  const dots = CHAPTERS.map((c, i) => `<div class="prog-dot ${i < state.chapterIndex ? 'done' : i === state.chapterIndex ? 'active' : ''}"></div>`).join("");
  return `<div class="progress-row">${dots}<span class="prog-label">Chapter ${state.chapterIndex + 1} of ${CHAPTERS.length}</span></div>`;
}

function screenArtOpen() {
  return `
    <div class="screen-label">Before we begin — look closely</div>
    <div class="screen-heading">The Terracotta Army of Qin Shi Huang</div>
    <div class="art-frame">
      <img src="https://upload.wikimedia.org/wikipedia/commons/b/ba/Terracotta_army_museum.jpg" alt="The Terracotta Army — Xi'an, China" onerror="this.style.display='none';document.getElementById('terra-fallback').style.display='block'" />
      <div id="terra-fallback" style="display:none;padding:2rem;text-align:center;color:var(--vermillion);font-family:Arial,sans-serif;font-size:13px">[Terracotta Army — search "Terracotta Army Xi'an" to view]</div>
      <div class="art-caption">Terracotta Army · Mausoleum of Qin Shi Huang · Xi'an, Shaanxi, China · c. 210 BCE · Qin Dynasty · UNESCO World Heritage Site · Public Domain</div>
    </div>
    <div class="scene-text">Approximately 8,000 individual soldiers, 130 chariots, and 670 horses — each face unique, buried with the first emperor of unified China to protect him in the afterlife. Discovered by farmers digging a well in 1974. Before you begin your story in ancient China, look closely. Take 30 seconds of silence first. Then answer the three prompts in your field journal:</div>
    <div class="art-prompts">
      <div class="art-prompt-box"><div class="apt-label">Prompt 1</div><div class="apt-q">One thing I find interesting...</div></div>
      <div class="art-prompt-box"><div class="apt-label">Prompt 2</div><div class="apt-q">One thing that puzzles me...</div></div>
      <div class="art-prompt-box"><div class="apt-label">Prompt 3</div><div class="apt-q">One question I have for the creator...</div></div>
    </div>
    <div class="history-note"><strong>Answer in your field journal.</strong> When your teacher gives the signal, continue.</div>
    <button class="btn btn-vermillion" onclick="go('role_select')">Enter ancient China →</button>`;
}

function screenRoleSelect() {
  return `
    <div class="screen-label">Choose your role — your table decides together</div>
    <div class="screen-heading">Who are you in ancient China?</div>
    <div class="scene-text">Every person at your table plays the same role. Each role will experience China's history from a different position — different philosophy, different relationship to the emperor, different experience of the same events. Notice the <strong>Harmony</strong> stat — it tracks how well your role's choices align with the social order of the civilization you are part of. Choose together.</div>
    <div class="role-grid">
      ${ROLES.map(r => `<div class="role-card" onclick="selectRole('${r.id}')"><span class="rc-icon">${r.icon}</span><div class="rc-name">${r.name}</div><div class="rc-own"><strong>You control:</strong> ${r.own}</div><div class="rc-fear">⚠ You fear: ${r.fear}</div></div>`).join("")}
    </div>`;
}

function screenChapter() {
  const ch = CHAPTERS[state.chapterIndex];
  const role = getRole();
  const choices = ch.choices[state.role];
  const isPoison = ch.poisonRoles.includes(state.role);
  return `
    ${renderProgress()}
    ${renderStats()}
    <div class="role-badge"><span class="rb-icon">${role.icon}</span><div><div class="rb-name">${role.name}</div><div class="rb-desc">${role.desc}</div></div></div>
    <div class="screen-label">${ch.title}</div>
    <div class="screen-heading" style="font-size:18px">${ch.subtitle}</div>
    <div class="scene-text">${ch.scene}</div>
    <div class="role-context">${role.context[ch.id]}</div>
    ${isPoison ? `<div class="poison-note">⚠ There may be no good option for your role in this chapter. Choose the least difficult path — and notice what the options themselves reveal about your position in this civilization.</div>` : ""}
    ${ch.id === "ch3" ? `<div class="philosophy-box"><h4>The Three Philosophies</h4><div class="philosophy-row"><div class="phil-card"><div class="pc-name">Confucianism</div><div class="pc-core">Harmony through proper relationships and moral example. The ruler governs by virtue. Society is organized around five relationships of mutual respect and responsibility.</div></div><div class="phil-card"><div class="pc-name">Legalism</div><div class="pc-core">Order through strict law and severe punishment. Human nature is selfish — only fear of consequences produces reliable behavior. The state's power is absolute.</div></div><div class="phil-card"><div class="pc-name">Taoism</div><div class="pc-core">Harmony through non-interference. Go with the natural flow of things. The best governance is the least governance. Force creates resistance; yielding finds the way.</div></div></div></div>` : ""}
    <div class="history-note">${ch.historyNote}</div>
    <div class="choices-label">Discuss with your table — then choose:</div>
    <div class="choices">${choices.map((c, i) => `<button class="choice-btn" onclick="makeChoice(${i})"><div class="choice-text">${c.text}</div><div class="choice-hint">${c.hint}</div></button>`).join("")}</div>`;
}

function screenOutcome() {
  const ch = CHAPTERS[state.chapterIndex];
  const o = state.pendingOutcome;
  const outcomeClass = o.poison ? "outcome-poison" : `outcome-${o.outcome}`;
  const outcomeLabel = o.outcome === "good" ? "✓ What happened" : o.outcome === "bad" ? "✗ What happened" : o.poison ? "⚠ The constrained choice" : "→ What happened";
  return `
    ${renderProgress()}
    ${renderStats()}
    <div class="outcome-box ${outcomeClass}"><div class="outcome-label">${outcomeLabel}</div>${o.result}</div>
    ${ch.discussAfter
      ? `<button class="btn btn-vermillion" onclick="startDiscussion()">Continue to table discussion →</button>`
      : `<div class="journal-prompt"><strong>✏ Field Journal Prompt —</strong> answer before your teacher signals to continue:<br><br>${ch.journalPrompt}</div>
         <button class="btn btn-vermillion" onclick="advanceChapter()">${state.chapterIndex < CHAPTERS.length - 1 ? 'Continue →' : 'See how your story ends →'}</button>`}`;
}

function screenDiscussion() {
  const ch = CHAPTERS[state.chapterIndex];
  clearInterval(state.timerInterval);
  setTimeout(() => {
    let secs = 90;
    state.timerInterval = setInterval(() => {
      secs--;
      const el = document.getElementById("timer-display");
      const fill = document.getElementById("timer-fill");
      const btn = document.getElementById("cont-btn");
      if (el) el.textContent = `${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`;
      if (fill) fill.style.width = `${(secs/90)*100}%`;
      if (secs <= 0) { clearInterval(state.timerInterval); if (btn) btn.classList.add("ready"); }
    }, 1000);
  }, 100);
  return `
    ${renderProgress()}
    <div class="discussion-box">
      <div class="disc-header">⏱ Table Discussion — 90 seconds</div>
      <div class="disc-prompt">${ch.discussPrompt}</div>
      <div class="timer-row">
        <div class="timer-display" id="timer-display">1:30</div>
        <div class="timer-track"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
        <button class="continue-btn" id="cont-btn" onclick="afterDiscussion()">Continue →</button>
      </div>
    </div>
    <div class="journal-prompt"><strong>✏ Field Journal Prompt —</strong> write your response while the timer runs:<br><br>${ch.journalPrompt}</div>`;
}

function screenGameOver() {
  return `
    <div style="text-align:center;padding:2rem 1rem">
      <div style="font-size:48px;margin-bottom:1rem">🌾</div>
      <div class="screen-heading">Your family's food stores are gone</div>
      ${renderStats()}
      <div class="history-note" style="text-align:left;margin-bottom:1.25rem">In ancient China, as in every civilization, the most sophisticated philosophical system and the most magnificent wall cannot sustain a people who cannot eat. The Yellow River gives and takes. The dynasties rise and fall. The farmer endures — until the harvest fails.</div>
      <div class="journal-prompt" style="text-align:left">What does a food crisis reveal about the limits of the Mandate of Heaven?</div><br>
      <button class="btn btn-vermillion" onclick="restart()">Start again as a different role</button>
    </div>`;
}

function screenArtClose() {
  return `
    <div class="screen-label">Closing — one more image</div>
    <div class="screen-heading">Wang Shen — Landscape in Mist<br><span style="font-size:16px;color:var(--vermillion)">Song Dynasty · c. 1100 CE</span></div>
    <div class="art-frame">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6c/Wang_Shen%2C_landscape.jpg" alt="Wang Shen Landscape — Song Dynasty Chinese ink wash painting" onerror="this.style.display='none';document.getElementById('landscape-fallback').style.display='block'" />
      <div id="landscape-fallback" style="display:none;padding:2rem;text-align:center;color:var(--vermillion);font-family:Arial,sans-serif;font-size:13px">[Wang Shen Landscape — search "Wang Shen Song Dynasty landscape" to view]</div>
      <div class="art-caption">Wang Shen · Landscape in Mist · Song Dynasty · c. 1100 CE · Ink and color on silk · Shanghai Museum · Public Domain</div>
    </div>
    <div class="scene-text">You opened this campaign with 8,000 individual terracotta soldiers — each face unique, each one a statement of imperial power, control, and the emperor's determination to carry his army into the afterlife. Now look at this painting. Misty mountains. Bare trees. A tiny boat on a vast river. Humans present but dwarfed by the natural world. Use your three prompts in your field journal:</div>
    <div class="art-prompts">
      <div class="art-prompt-box"><div class="apt-label">Prompt 1</div><div class="apt-q">One thing I find interesting...</div></div>
      <div class="art-prompt-box"><div class="apt-label">Prompt 2</div><div class="apt-q">One thing that puzzles me...</div></div>
      <div class="art-prompt-box"><div class="apt-label">Prompt 3</div><div class="apt-q">One question I have for the creator...</div></div>
    </div>
    <div class="journal-prompt"><strong>Year-long comparison question:</strong> You opened this campaign with terracotta soldiers — humans at monumental scale, power made physical. You are closing with a landscape where humans are tiny and the mountains are everything. Both are Chinese art. What does the difference between them tell you about the range of ideas within Chinese civilization — and how does this compare to the art you have seen from Egypt, India, and Mesopotamia?</div>
    <button class="btn btn-vermillion" onclick="go('ending')">See what your story revealed →</button>`;
}

function screenEnding() {
  const role = getRole();
  const h = harmonyResult(state.stats.harmony);
  return `
    <div class="screen-label">End of the China Campaign</div>
    <div class="screen-heading" style="font-size:18px">${role.name} — Your Story Through Ancient China</div>
    ${renderStats()}
    <div class="harmony-result"><span class="hr-icon">${h.icon}</span><div class="hr-label">Harmony Assessment</div><div class="hr-title">${h.title}</div><div class="hr-text">${h.text}</div></div>
    <div class="history-note"><strong>What this campaign covered:</strong><br>The Yellow River and China's agricultural geography · Shang and Zhou dynasties · The Mandate of Heaven · Confucianism, Legalism, and Taoism · The Qin unification and book burning · The Great Wall and its costs and benefits · Han dynasty Confucian restoration and the imperial examination system · The Silk Road and China's connection to the ancient world</div>
    <div style="margin-bottom:1.25rem">
      <div class="screen-label" style="margin-bottom:8px">China's Achievements</div>
      <div class="achievements-grid">
        <div class="achievement-card"><span class="ac-icon">📜</span><div class="ac-title">Paper</div><div class="ac-desc">Invented during the Han dynasty — transforming record-keeping, literature, and eventually the spread of ideas across the world.</div></div>
        <div class="achievement-card"><span class="ac-icon">🧭</span><div class="ac-title">Compass</div><div class="ac-desc">The magnetic compass — enabling navigation that would eventually make global exploration possible.</div></div>
        <div class="achievement-card"><span class="ac-icon">🎆</span><div class="ac-title">Gunpowder</div><div class="ac-desc">Discovered by Taoist alchemists seeking immortality — it found other uses.</div></div>
        <div class="achievement-card"><span class="ac-icon">🖨️</span><div class="ac-title">Printing</div><div class="ac-desc">Woodblock printing and later movable type — centuries before Gutenberg — spreading texts across China and beyond.</div></div>
        <div class="achievement-card"><span class="ac-icon">🐛</span><div class="ac-title">Silk Production</div><div class="ac-desc">The closely guarded secret that gave the Silk Road its name and funded Chinese civilization for centuries.</div></div>
        <div class="achievement-card"><span class="ac-icon">📋</span><div class="ac-title">Imperial Examination</div><div class="ac-desc">The world's first merit-based civil service system — selecting officials by demonstrated knowledge rather than birth alone.</div></div>
      </div>
    </div>
    <div class="discussion-questions">
      <h4>Class Discussion Questions</h4>
      <p>1. Confucianism, Legalism, and Taoism all emerged during the same period of chaos. What does it tell you that three such different answers appeared at the same time?</p>
      <p>2. The Great Wall was built to keep the Xiongnu out. The Silk Road was built to connect China to the world. How can the same civilization build both — and what does that contradiction reveal?</p>
      <p>3. The Confucian social hierarchy placed merchants at the bottom — below farmers and artisans — despite their wealth. Why would a philosophy place commercial people below physical laborers?</p>
      <p>4. The terracotta army and the Song Dynasty landscape painting are both Chinese art — but they express completely opposite ideas about power and the human relationship to nature. Which one feels more Chinese to you now that you have studied the civilization?</p>
      <p>5. The Silk Road carried goods, ideas, religions, and eventually disease in both directions. Was China's decision to open the road worth it — and who got to make that decision?</p>
    </div>
    <button class="btn btn-vermillion" onclick="restart()">Play again as a different role</button>
    <button class="btn btn-secondary" onclick="restart()">Return to start</button>`;
}

function selectRole(id) { state.role = id; state.chapterIndex = 0; go("chapter"); }
function makeChoice(i) {
  const ch = CHAPTERS[state.chapterIndex];
  const choice = ch.choices[state.role][i];
  applyStats(choice.statChange);
  state.pendingOutcome = choice;
  if (isDead()) { go("gameover"); return; }
  go("outcome");
}
function startDiscussion() { state.inDiscussion = true; go("discussion"); }
function afterDiscussion() { clearInterval(state.timerInterval); state.inDiscussion = false; advanceChapter(); }
function advanceChapter() {
  state.pendingOutcome = null;
  if (state.chapterIndex < CHAPTERS.length - 1) { state.chapterIndex++; go("chapter"); }
  else { go("art_close"); }
}
function restart() {
  clearInterval(state.timerInterval);
  state = { screen: "art_open", role: null, chapterIndex: 0, pendingOutcome: null, stats: { food: 50, harmony: 50, wealth: 50, standing: 50 }, inDiscussion: false, timerInterval: null };
  render(); window.scrollTo({ top: 0, behavior: "smooth" });
}

function render() {
  const el = document.getElementById("content");
  const screens = { art_open: screenArtOpen, role_select: screenRoleSelect, chapter: screenChapter, outcome: screenOutcome, discussion: screenDiscussion, gameover: screenGameOver, art_close: screenArtClose, ending: screenEnding };
  el.innerHTML = (screens[state.screen] || (() => "<p>Loading...</p>"))();
}
render();
</script>
</body>
</html>
