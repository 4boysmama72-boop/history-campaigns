<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Ancient Rome — The Story of Us</title>
<style>
  :root {
    --roman-red: #8B1A1A;
    --roman-red-light: #F5C8C8;
    --roman-red-glow: rgba(139,26,26,0.15);
    --senate: #2A3A6B;
    --senate-light: #C8D4F8;
    --toga: #F5F0E8;
    --toga-dark: #D8D0C0;
    --gold: #A87A00;
    --gold-light: #FFF4C0;
    --marble: #E8E4DC;
    --stone: #5A5040;
    --stone-light: #E8E0D0;
    --red: #8B2020;
    --red-light: #F5D0D0;
    --green: #2A6B3A;
    --green-light: #C8F0D0;
    --shadow: #0A0800;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, 'Times New Roman', serif; background: #0A0800; color: var(--toga); min-height: 100vh; }
  #app { max-width: 780px; margin: 0 auto; padding: 1.5rem 1.5rem 3rem; }

  .site-header { text-align: center; padding: 1.5rem 1rem 1rem; border-bottom: 2px solid var(--roman-red); margin-bottom: 1.5rem; background: linear-gradient(180deg, rgba(139,26,26,0.08) 0%, transparent 100%); }
  .site-header .campaign-tag { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--roman-red-light); font-family: Arial, sans-serif; margin-bottom: 6px; }
  .site-header h1 { font-size: 30px; font-weight: bold; color: var(--toga); letter-spacing: 0.06em; margin-bottom: 4px; }
  .site-header h2 { font-size: 14px; font-weight: normal; color: var(--toga-dark); font-family: Arial, sans-serif; font-style: italic; }

  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 1.25rem; }
  .stat-box { background: rgba(139,26,26,0.1); border: 1px solid rgba(139,26,26,0.3); border-radius: 6px; padding: 8px 10px; text-align: center; }
  .stat-icon { font-size: 16px; display: block; margin-bottom: 2px; }
  .stat-label { font-size: 10px; color: var(--roman-red-light); letter-spacing: 0.05em; text-transform: uppercase; font-family: Arial, sans-serif; }
  .stat-value { font-size: 18px; font-weight: bold; margin: 2px 0; }
  .stat-track { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 4px; }
  .stat-fill { height: 4px; border-radius: 2px; transition: width 0.5s, background 0.5s; }

  .role-badge { display: flex; align-items: center; gap: 10px; background: rgba(139,26,26,0.1); border: 1px solid rgba(139,26,26,0.3); border-radius: 8px; padding: 10px 14px; margin-bottom: 1.25rem; }

  .role-badge .rb-name { font-size: 15px; font-weight: bold; color: var(--toga); }
  .role-badge .rb-desc { font-size: 12px; color: var(--toga-dark); font-family: Arial, sans-serif; }

  .progress-row { display: flex; align-items: center; gap: 8px; margin-bottom: 1.25rem; }
  .prog-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(139,26,26,0.2); border: 1.5px solid rgba(139,26,26,0.4); }
  .prog-dot.active { background: var(--roman-red); border-color: var(--roman-red); }
  .prog-dot.done { background: var(--gold); border-color: var(--gold); }
  .prog-label { font-size: 11px; color: var(--toga-dark); font-family: Arial, sans-serif; }

  .screen-label { font-size: 11px; color: var(--roman-red-light); letter-spacing: 0.1em; text-transform: uppercase; font-family: Arial, sans-serif; margin-bottom: 6px; }
  .screen-heading { font-size: 22px; font-weight: bold; color: var(--toga); margin-bottom: 1rem; line-height: 1.3; }
  .scene-text { font-size: 15px; line-height: 1.85; color: var(--toga); margin-bottom: 1rem; }
  .role-context { background: var(--roman-red-glow); border-left: 3px solid var(--roman-red); border-radius: 0 6px 6px 0; padding: 10px 14px; font-size: 14px; font-style: italic; color: var(--roman-red-light); margin-bottom: 1.25rem; line-height: 1.65; font-family: Arial, sans-serif; }

  .history-note { background: rgba(42,58,107,0.2); border-left: 3px solid var(--senate); border-radius: 0 6px 6px 0; padding: 10px 14px; font-size: 13px; color: var(--senate-light); margin-bottom: 1.25rem; line-height: 1.65; font-family: Arial, sans-serif; }
  .history-note strong { color: #E8F0FF; font-weight: 600; }

  .journal-prompt { background: rgba(139,26,26,0.1); border-left: 3px solid var(--roman-red); border-radius: 0 6px 6px 0; padding: 12px 14px; font-size: 14px; color: var(--roman-red-light); margin-bottom: 1.25rem; line-height: 1.7; font-family: Arial, sans-serif; }
  .journal-prompt strong { color: var(--toga); font-weight: 600; }

  .poison-note { background: rgba(139,32,32,0.2); border-left: 3px solid var(--red); border-radius: 0 6px 6px 0; padding: 10px 14px; font-size: 13px; color: var(--red-light); margin-bottom: 1.25rem; line-height: 1.65; font-family: Arial, sans-serif; }

  .discussion-box { background: var(--stone); border-radius: 10px; padding: 16px 20px; margin-bottom: 1.25rem; }
  .discussion-box .disc-header { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-family: Arial, sans-serif; color: var(--toga-dark); margin-bottom: 6px; }
  .discussion-box .disc-prompt { font-size: 15px; line-height: 1.6; margin-bottom: 14px; font-style: italic; color: var(--toga); }
  .timer-row { display: flex; align-items: center; gap: 14px; }
  .timer-display { font-size: 32px; font-weight: bold; font-family: Arial, sans-serif; min-width: 60px; color: var(--toga); }
  .timer-track { flex: 1; height: 8px; background: rgba(255,255,255,0.15); border-radius: 4px; }
  .timer-fill { height: 8px; background: var(--roman-red); border-radius: 4px; transition: width 1s linear; }
  .continue-btn { background: var(--roman-red); color: white; border: none; border-radius: 6px; padding: 8px 16px; font-size: 13px; font-weight: bold; cursor: pointer; font-family: Arial, sans-serif; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .continue-btn.ready { opacity: 1; pointer-events: all; }

  .choices-label { font-size: 11px; color: var(--toga-dark); letter-spacing: 0.08em; text-transform: uppercase; font-family: Arial, sans-serif; margin-bottom: 8px; }
  .choices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1rem; }
  .choice-btn { background: rgba(139,26,26,0.08); border: 1.5px solid rgba(139,26,26,0.3); border-radius: 8px; padding: 12px 16px; text-align: left; cursor: pointer; transition: all 0.15s; font-family: Georgia, serif; }
  .choice-btn:hover { background: rgba(139,26,26,0.2); border-color: var(--roman-red); }
  .choice-btn .choice-text { font-size: 14px; color: var(--toga); line-height: 1.5; }
  .choice-btn .choice-hint { font-size: 11px; color: var(--toga-dark); margin-top: 4px; font-family: Arial, sans-serif; font-style: italic; }

  .outcome-box { border-radius: 8px; padding: 14px 16px; margin-bottom: 1.25rem; font-size: 14px; line-height: 1.7; font-family: Arial, sans-serif; }
  .outcome-good { background: rgba(42,107,58,0.2); border: 1.5px solid var(--green); color: var(--green-light); }
  .outcome-bad { background: rgba(139,32,32,0.2); border: 1.5px solid var(--red); color: var(--red-light); }
  .outcome-neutral { background: rgba(90,80,64,0.3); border: 1.5px solid var(--stone); color: var(--stone-light); }
  .outcome-poison { background: rgba(139,32,32,0.15); border: 1.5px solid #6B1A1A; color: #F0B0B0; }
  .outcome-label { font-size: 11px; font-weight: bold; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; font-family: Arial, sans-serif; }

  .art-frame { border: 2px solid var(--roman-red); border-radius: 8px; overflow: hidden; margin-bottom: 1.25rem; background: var(--shadow); box-shadow: 0 0 20px rgba(139,26,26,0.15); }
  .art-frame img { width: 100%; display: block; max-height: 360px; object-fit: contain; object-position: center; background: #1A1008; }
  .art-caption { padding: 8px 14px; font-size: 11px; color: var(--roman-red-light); font-family: Arial, sans-serif; font-style: italic; background: rgba(10,8,0,0.9); line-height: 1.5; }

  .art-prompts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.25rem; }
  .art-prompt-box { background: rgba(139,26,26,0.1); border: 1px solid rgba(139,26,26,0.3); border-radius: 6px; padding: 10px 14px; }
  .art-prompt-box .apt-label { font-size: 11px; font-weight: bold; color: var(--roman-red-light); text-transform: uppercase; letter-spacing: 0.06em; font-family: Arial, sans-serif; margin-bottom: 4px; }
  .art-prompt-box .apt-q { font-size: 14px; color: var(--toga-dark); font-style: italic; }

  .role-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 1rem; }
  .role-card { background: rgba(139,26,26,0.08); border: 2px solid rgba(139,26,26,0.3); border-radius: 10px; padding: 14px; cursor: pointer; transition: all 0.15s; }
  .role-card:hover { background: rgba(139,26,26,0.2); border-color: var(--roman-red); transform: translateY(-1px); }
  .role-card .rc-icon { font-size: 28px; margin-bottom: 6px; display: block; }
  .role-card .rc-name { font-size: 15px; font-weight: bold; color: var(--toga); margin-bottom: 4px; }
  .role-card .rc-own { font-size: 12px; color: var(--toga-dark); font-family: Arial, sans-serif; line-height: 1.5; margin-bottom: 6px; }
  .role-card .rc-fear { font-size: 11px; color: var(--red-light); font-family: Arial, sans-serif; font-style: italic; }

  .power-result { background: rgba(139,26,26,0.12); border: 1.5px solid var(--roman-red); border-radius: 10px; padding: 16px 18px; margin-bottom: 1.25rem; text-align: center; }
  .power-result .pr-icon { font-size: 36px; margin-bottom: 8px; display: block; }
  .power-result .pr-label { font-size: 12px; color: var(--roman-red-light); text-transform: uppercase; letter-spacing: 0.08em; font-family: Arial, sans-serif; margin-bottom: 6px; }
  .power-result .pr-title { font-size: 20px; font-weight: bold; color: var(--toga); margin-bottom: 8px; }
  .power-result .pr-text { font-size: 14px; color: var(--toga-dark); line-height: 1.7; font-family: Arial, sans-serif; }

  .achievements-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 1.25rem; }
  .achievement-card { background: rgba(139,26,26,0.1); border: 1px solid rgba(139,26,26,0.3); border-radius: 8px; padding: 12px 14px; }
  .achievement-card .ac-icon { font-size: 20px; margin-bottom: 4px; display: block; }
  .achievement-card .ac-title { font-size: 13px; font-weight: bold; color: var(--toga); margin-bottom: 4px; }
  .achievement-card .ac-desc { font-size: 12px; color: var(--toga-dark); font-family: Arial, sans-serif; line-height: 1.5; }

  .discussion-questions { background: rgba(42,58,107,0.15); border: 1px solid var(--senate); border-radius: 8px; padding: 14px 16px; margin-bottom: 1.25rem; }
  .discussion-questions h4 { font-size: 12px; font-weight: bold; color: var(--senate-light); text-transform: uppercase; letter-spacing: 0.06em; font-family: Arial, sans-serif; margin-bottom: 10px; }
  .discussion-questions p { font-size: 13px; color: #A8C0F0; line-height: 1.7; font-family: Arial, sans-serif; margin-bottom: 8px; }

  .btn { background: var(--stone); color: var(--toga); border: none; border-radius: 8px; padding: 11px 22px; font-size: 14px; font-weight: bold; cursor: pointer; font-family: Arial, sans-serif; transition: background 0.15s; margin-right: 8px; margin-bottom: 8px; }
  .btn:hover { background: #3A3020; }
  .btn-roman { background: var(--roman-red); color: white; }
  .btn-roman:hover { background: #6B1010; }
  .btn-secondary { background: transparent; color: var(--roman-red-light); border: 1.5px solid var(--roman-red); }
  .btn-secondary:hover { background: var(--roman-red-glow); }

  @media (max-width: 500px) {
    .role-grid { grid-template-columns: 1fr; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .achievements-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="site-header">
    <div class="campaign-tag">The Story of Us · Campaign 6</div>
    <h1>ANCIENT ROME</h1>
    <h2>Rome Didn't Want a King. How Did They Get One? · c. 753 BCE – 476 CE</h2>
  </div>
  <div id="content"></div>
</div>

<script>
const ROLES = [
  {
    id: "senator",
    name: "Roman Senator",
    icon: "🏛️",
    desc: "You serve in the Senate — the governing body of the Roman Republic, made up of Rome's most powerful patrician families.",
    own: "Political authority, ancestral prestige, wealth, and the Senate's collective power to make law and direct Rome's future.",
    fear: "A general who puts his army before the Republic. A demagogue who turns the people against the Senate. The day Rome stops being a republic.",
    want: "A Rome governed by law, by tradition, by the Senate's collective wisdom — exactly as the founders intended.",
    context: {
      ch1: "Rome was founded on rejection — rejection of kings, of tyranny, of one person having too much power. Your family's authority descends from the men who threw out the Etruscan kings and said: never again. That 'never again' is what the Senate exists to protect.",
      ch2: "The Republic works — when everyone follows the rules. Cincinnatus followed the rules perfectly. He took power when Rome needed him and gave it back the moment he didn't. Every Senator should be Cincinnatus. Very few are.",
      ch3: "The Punic Wars make Rome powerful and wealthy. They also begin the process that will destroy the Republic — the concentration of land in patrician hands, the displacement of small farmers, the growing gap between rich and poor that the Senate refuses to address.",
      ch4: "Caesar has crossed the Rubicon. The river that no Roman general was permitted to cross with an army. He has crossed it. This is the moment your nightmare becomes real — and your role is either to stop it or to accommodate it.",
      ch5: "The Senate still exists under the empire. But the emperor's word overrides it. You have all the forms of power — the title, the chamber, the procedures — and almost none of the substance. This is what losing a republic looks like from inside its institutions.",
      ch6: "The empire is fracturing. The Senate debates while barbarians move. You have governed Rome through seven emperors in the last decade. The institution you serve has outlasted every individual who tried to control it. Whether it can outlast the empire itself is the question your generation will answer."
    }
  },
  {
    id: "plebeian",
    name: "Plebeian / Tribune",
    icon: "✊",
    desc: "You are a Roman commoner — one of the plebeians who fought for centuries to make the Republic actually work for ordinary people.",
    own: "The vote. The Tribune's veto — the right to say 'I forbid' to any law that harms the common people. Rights won through generations of struggle.",
    fear: "A Senate that ignores the Twelve Tables when convenient. A general who promises the people what the Senate won't give them. Winning the rights and then watching them become meaningless.",
    want: "A Republic that works for everyone — not just the patricians who built it for themselves.",
    context: {
      ch1: "The Republic that replaced the kings was a republic for patricians — Rome's noble families. Your people, the plebeians, helped build Rome and had almost no voice in governing it. The story of the Republic is partly the story of your people fighting to be included in what they helped create.",
      ch2: "The Twelve Tables. Written law that applies to everyone — including the patricians who would prefer to make the rules up as they go. Your people fought for this. The Tribune's veto — 'Veto' means 'I forbid' in Latin — is your people's greatest achievement. One Tribune can stop any law that harms ordinary Romans.",
      ch3: "The Punic Wars produce wealth that flows mostly to the patricians. Small farmers — your people — lose their land while fighting Rome's wars. They return to find wealthy landowners have taken what they left behind. The Republic that finally gave you rights is now distributing its wealth in ways that hollow those rights out.",
      ch4: "Caesar offers your people things the Senate never would — land reform, grain distribution, public works. He is also dismantling the Republic that your people died to make inclusive. The choice is genuinely difficult: a Republic that technically includes you but practically ignores you, or an emperor who helps you but rules without your consent.",
      ch5: "The empire provides bread and circuses — literal grain distributions and entertainment. Your material conditions may actually be better than under the late Republic. Your political voice is gone. Whether that trade-off is acceptable is a question every generation of Romans under the empire had to answer for themselves.",
      ch6: "The empire is failing. The systems that provided bread and circuses are breaking down. The rights your ancestors fought for — the Tribune's veto, the Twelve Tables — survive as legal forms but mean little when the emperor's soldiers determine what law actually is. You are watching the thing your people built fall apart."
    }
  },
  {
    id: "soldier",
    name: "Legionary Soldier",
    icon: "⚔️",
    desc: "You serve in the Roman legion — the most disciplined and effective military force the ancient world has ever seen.",
    own: "Military training, your unit, the eagle standard of your legion, and loyalty to Rome — whichever Rome currently exists.",
    fear: "Being asked to choose between your general and your Republic. Dying in a civil war against other Romans. An empire too large to defend.",
    want: "Clear orders, a general worth following, victory, land when you retire, and a Rome worth fighting for.",
    context: {
      ch1: "Rome's military power begins with geography — the Italian peninsula gives Rome defensible positions and a central location for projecting power across the Mediterranean. The early Roman army was a citizen militia. Over time it becomes a professional force. That professionalization changes everything about Rome's politics.",
      ch2: "The Republic's army fights for Rome — the abstract idea, the Senate, the traditions. Cincinnatus commanded that army and returned it to civilian control when the crisis passed. Every general who comes after him is measured against that standard.",
      ch3: "The Punic Wars transform the Roman army. Hannibal nearly destroys it. Rome rebuilds, reforms, and eventually destroys Carthage. The army that defeats Carthage is harder, more professional, and more dependent on its generals than the citizen militia that preceded it. That dependence matters.",
      ch4: "Your general has ordered you to cross the Rubicon. You know what this means — every soldier knows what this means. Roman law forbids a general from bringing his army into Italy. Caesar is asking you to help him break that law. What you do next determines Rome's future.",
      ch5: "Under the empire, the soldier's loyalty shifts from Rome-the-Republic to the emperor personally. The army that was the Republic's instrument becomes the emperor's instrument. When emperors are good this works reasonably well. When emperors are bad the army becomes the only check on power — which means soldiers choose emperors, which means power flows from the sword.",
      ch6: "The empire is too large to defend with the army Rome can afford. Barbarian groups are crossing borders that Roman legions used to hold. You are being asked to defend everything simultaneously with forces adequate to defend nothing completely. The greatest military machine in history is being stretched past its breaking point."
    }
  },
  {
    id: "merchant",
    name: "Merchant / Trader",
    icon: "⚓",
    desc: "You trade across the Roman world — from Britain to Egypt, from Spain to Syria — in the greatest commercial network the ancient world has ever seen.",
    own: "Trading ships, commercial relationships across the empire, knowledge of roads and sea routes, contacts in a dozen provinces.",
    fear: "Civil war disrupting trade routes. An emperor who seizes merchant wealth. The collapse of the currency that makes empire-wide trade possible.",
    want: "Pax Romana — the Roman peace that keeps roads safe, ports open, currency stable, and the empire's vast market accessible.",
    context: {
      ch1: "Rome's geography makes it a trading hub — central Mediterranean location, rivers connecting the interior to the sea, Italian peninsula extending toward Africa and the east. The merchant who understands Roman geography understands Roman power.",
      ch2: "The Republic creates the legal infrastructure that makes large-scale commerce possible — contract law, property rights, commercial courts. The Twelve Tables that the plebeians fought for also protect merchant contracts. Law is the foundation of commerce.",
      ch3: "The Punic Wars open the western Mediterranean to Roman commerce. Carthage — Rome's greatest commercial rival — is destroyed. The trade routes that Carthaginian merchants controlled now run through Roman ports. War and commerce, in Rome, are the same strategy expressed differently.",
      ch4: "Civil war is commerce's worst enemy. When Caesar and Pompey fight, when Antony and Octavian fight, trade routes close, currency becomes unreliable, contracts are unenforceable. You survive by staying neutral and keeping your networks intact across political changes.",
      ch5: "The Pax Romana — the Roman Peace established by Augustus — is the greatest commercial period in the ancient world. Safe roads across Europe and the Middle East. A unified currency. A legal system that protects contracts from Britain to Babylon. The empire that your senator neighbors built for political reasons turns out to be extraordinarily good for commerce.",
      ch6: "The collapse begins economically before it becomes military. Currency debasement — emperors reducing the silver content of coins to pay their armies — produces inflation. Trade routes become unsafe. The commercial network that held the empire together financially begins to fray. The merchant sees the fall coming before the general does."
    }
  },
  {
    id: "conquered",
    name: "Citizen of a Conquered Land",
    icon: "🌿",
    desc: "Rome has conquered your homeland. You are not a Roman citizen — but you live under Roman law, pay Roman taxes, and serve Roman interests.",
    own: "Your community, your traditions, your language, your gods — and whatever dignity you can maintain under occupation.",
    fear: "That Roman culture will replace your own. That your children will grow up Roman and forget what came before. That resistance will cost your community everything.",
    want: "To maintain your people's identity, traditions, and dignity while navigating the reality of Roman power.",
    context: {
      ch1: "Rome began as one city among many in Italy. It conquered its neighbors — the Latins, the Etruscans, the Samnites — one by one. Each conquest brought more people under Roman rule who were not Roman. Your people were among them. The Republic that Romans celebrate as a triumph of freedom was built partly on the conquest of people who had their own freedoms.",
      ch2: "Roman law applies to you — but not equally. Roman citizens have rights that you do not. The Twelve Tables that Romans celebrate as the foundation of justice were written for Romans. Your disputes are settled by Roman magistrates who may not know your language, your customs, or your traditions.",
      ch3: "The Punic Wars expand Rome's reach across the Mediterranean. Each expansion brings more conquered peoples into the Roman system. Some conquered peoples eventually become Roman citizens — but it takes generations and is never automatic. In the meantime you navigate a system that was not built for you.",
      ch4: "Caesar's civil war is fought between Romans over Roman power. For your people it matters primarily in terms of which Roman wins and what they will demand. Caesar is somewhat more interested in extending citizenship than his opponents. Octavian will eventually be more systematic about it. But citizenship extension is always on Rome's terms, not yours.",
      ch5: "The empire's achievement is real and complicated. Roman roads connect your region to the wider world. Roman peace reduces the local conflicts that used to threaten your community. Roman commerce creates economic opportunity. These are genuine benefits. They arrive alongside Roman taxation, Roman cultural pressure, and the permanent subordination of your traditions to Roman ones.",
      ch6: "As the empire weakens, your region faces new threats — the barbarian groups that cross the former frontiers. The Roman military that used to protect you is stretched thin. The question your community faces: was Roman protection worth what it cost — and what do you do now that the protection is failing?"
    }
  },
  {
    id: "christian",
    name: "Early Christian",
    icon: "✝️",
    desc: "You follow the teachings of Jesus of Nazareth in a Roman Empire that finds your faith strange, suspicious, and occasionally dangerous.",
    own: "Your faith, your community of fellow believers, the letters and teachings being collected and shared across the empire's trade routes.",
    fear: "Imperial persecution. Being blamed for Rome's problems. The faith being distorted by those who use it for power rather than living it.",
    want: "To practice your faith freely, to spread the teachings you believe are true, and to live by a different set of values than the empire demands.",
    context: {
      ch1: "Christianity has not yet arrived in this chapter — it emerges from Jewish tradition in the Roman province of Judea approximately in the first century CE. But the Roman world you will navigate is already being shaped by the forces that will both persecute and eventually adopt your faith.",
      ch2: "The Roman legal tradition — the Twelve Tables, the system of courts — will eventually both persecute Christians and protect them. The same legal infrastructure that makes Roman commerce possible will be used to prosecute Christians for refusing to sacrifice to Roman gods, and later to officially recognize Christianity as a legal religion.",
      ch3: "Judaism — from which Christianity emerges — exists in Roman territories under varying conditions of tolerance. Jewish communities maintain their religious practices under Roman rule, with periodic conflict. The faith you will eventually follow grows from this tradition and inherits both its resilience and its complicated relationship with Roman power.",

        { text: "Note the growing inequality — concentrated wealth destabilizes the markets you depend on", hint: "Commercial risk assessment of social inequality", outcome: "good", result: "The concentration of land in wealthy hands and the displacement of small farmers creates a social instability that eventually disrupts commerce. Markets depend on people having money to buy things. Dispossessed farmers flooding Rome's cities create social tension but not purchasing power. The inequality that enriches some merchants in the short term destabilizes the social conditions that commerce requires in the long term.", statChange: { food: 5, power: 10, wealth: 15, standing: 10 } },
        { text: "Invest in provincial commerce — the newly conquered territories are commercial opportunities", hint: "Empire as market", outcome: "good", result: "The territories Rome acquires through the Punic Wars — Spain, North Africa, eventually Greece — are commercial opportunities as much as military conquests. Provincial governors need commercial suppliers. Provincial populations need imported goods. The commercial networks connecting Rome to its provinces are being built now. The merchant who builds those networks early benefits from Rome's expansion for generations.", statChange: { food: 5, power: 5, wealth: 25, standing: 15 } }

    scene: "It is January 49 BCE. Julius Caesar stands at the Rubicon River — the boundary that Roman law forbids any general from crossing with an army. The Senate has ordered him to disband his legions. If he obeys, he returns to Rome as a private citizen — his enemies waiting to prosecute him. If he crosses the Rubicon with his army, he commits treason — but his army will be with him. He crosses. 'The die is cast,' he reportedly says. What follows is civil war, Caesar's dictatorship, his assassination on the Ides of March 44 BCE, and then more civil war — Octavian and Mark Antony fighting for Caesar's legacy, each seeking political alliance across the Mediterranean world. When it is over, Octavian — renamed Augustus — is the first emperor of Rome. The Republic is over. Rome doesn't call it that. But it is.",
    historyNote: "<strong>The Fall of the Republic:</strong> Caesar's crossing of the Rubicon began the civil war that ended the Roman Republic. His assassination on March 15, 44 BCE — by senators who believed they were saving the Republic — instead triggered further civil war. Octavian defeated Mark Antony and emerged as sole ruler, taking the title 'Augustus' (revered one) rather than 'king' — because Romans still would not accept that word. He kept the Senate, the elections, and the Republican forms — while making all the real decisions himself. The Republic ended not with a dramatic overthrow but with its institutions becoming decorative.",

        { text: "Accommodate Caesar — preserve what you can of the Senate's authority under the new reality", hint: "Pragmatic survival", outcome: "neutral", result: "You keep your seat in the Senate. You vote for Caesar's proposals. You maintain the forms of Republican governance while the substance drains away. The Senate that accommodates Caesar survives longer than the Senate that resists — but it survives as decoration rather than institution. The body continues. Its power does not. This is what the death of a republic looks like from inside its surviving institutions.", statChange: { food: 5, power: 5, wealth: 10, standing: 10 }, poison: true },
        { text: "Ask the question Rome refuses to answer — did the Republic's failure to reform make Caesar possible?", hint: "Honest historical analysis", outcome: "good", result: "The most honest answer to why Caesar succeeded is that the Republic he replaced had failed the people who eventually supported him. Dispossessed farmers. Veterans without land. A Senate that protected wealth over justice. Caesar offered what the Republic withheld. The senators who killed him were defending an institution that had already failed most Romans. The tragedy of the Republic's fall is that both sides of that argument are correct.", statChange: { food: 5, power: 20, wealth: 5, standing: 10 } }

        { text: "Recognize that whoever wins the civil war your people will still be ordinary Romans navigating power", hint: "Realism about power", outcome: "neutral", result: "Caesar or Pompey, Octavian or Antony — the civil wars between powerful men are not wars your people chose. You survive them as best you can. When Octavian wins and becomes Augustus, he maintains the grain distributions and public works that keep ordinary Romans fed and entertained. Your material conditions are managed. Your political voice is gone. The empire provides bread. The Republic — imperfect as it was — provided the possibility of more.", statChange: { food: 10, power: 5, wealth: 5, standing: 5 } }

        { text: "Back Octavian — his victory will produce the stability commerce requires", hint: "Back the likely winner for commercial reasons", outcome: "good", result: "Octavian's victory produces the Pax Romana — the Roman Peace that is the greatest commercial period in ancient history. Your early support of Octavian — modest, careful, not publicly visible — positions you well in the commercial networks of the new empire. The emperor who replaces the Republic turns out to be extraordinarily good for commerce. You helped him win. He helps you trade.", statChange: { food: 5, power: 5, wealth: 20, standing: 15 } },

        { text: "Assess what the empire that emerges from civil war means for your people", hint: "Pragmatic assessment of the new order", outcome: "neutral", result: "The empire that Octavian builds from the ruins of the Republic is, in some ways, better for conquered peoples than the late Republic was. Augustus standardizes provincial administration, reduces the worst abuses of provincial governors, and creates the infrastructure — roads, peace, commercial networks — that benefits everyone in the empire. The costs — Roman taxation, cultural pressure, military occupation — continue. The balance shifts slightly in your favor.", statChange: { food: 5, power: 10, wealth: 10, standing: 10 } },
        { text: "Begin the long path toward Roman citizenship — the empire is more willing than the Republic to extend it", hint: "Citizenship as long-term goal", outcome: "good", result: "The empire gradually extends Roman citizenship more broadly than the Republic ever did — culminating in the Edict of Caracalla in 212 CE, which grants citizenship to virtually all free inhabitants of the empire. The path is long, uneven, and always on Rome's terms. But the destination — full legal equality under Roman law — is genuinely worth pursuing. Your community begins the generational project of earning what should not require earning.", statChange: { food: 5, power: 15, wealth: 10, standing: 15 } }

    historyNote: "<strong>Roman Achievements:</strong> Roman engineering produced the most sophisticated infrastructure the ancient world had seen — 50,000 miles of roads, aqueducts that brought clean water to cities, concrete buildings some of which still stand. Roman law's influence on Western legal systems continues today. The Stoic philosophy of Marcus Aurelius — the soldier-philosopher emperor — remains influential. Roman medicine, mathematics, and calendar systems shaped the modern world. These achievements existed alongside a society built partly on enslaved labor, periodic brutal persecution of minorities, and the suppression of conquered peoples' self-governance.",
    historyNote2: "<strong>Christianity Under the Empire:</strong> Early Christians refused to sacrifice to Roman gods or acknowledge the emperor's divine status — making them appear disloyal in Roman eyes. The persecution was not continuous but could be severe when it came. Christians were blamed for the Great Fire of Rome under Nero. The Diocletianic Persecution (303-313 CE) was the most systematic. Yet the faith spread — through the empire's roads, through its commercial networks, through the Greek language that was Rome's eastern lingua franca, and through the communities of mutual care that the faith built.",

        { text: "Survive Nero — navigate the corrupt emperor without becoming complicit in his worst acts", hint: "Institutional survival through personal darkness", outcome: "neutral", result: "Nero is the empire's worst impulse given absolute power — capricious, cruel, interested in his own artistic self-image over the empire's welfare. Surviving his reign without being destroyed requires careful navigation of his paranoia. You keep your head down, perform your duties adequately, avoid drawing his attention, and wait. The Senate outlasts Nero. The question of what the Senate compromised to outlast him is one you try not to examine.", statChange: { food: 5, power: 10, wealth: 10, standing: 5 } },

        { text: "Find meaning in community and the emerging religious movements — when politics fails, faith sometimes fills the space", hint: "Faith as alternative to political participation", outcome: "good", result: "The political space your people occupied is closed. The new religious communities — Christianity among them — offer something politics no longer provides: genuine participation, genuine community, genuine voice. The early Christian communities are remarkably egalitarian for their time — in faith, enslaved and free, Roman and non-Roman, male and female are equal before God. This is not nothing. It is not the Tribune's veto. But it is something real.", statChange: { food: 5, power: 15, wealth: 5, standing: 15 } }

        { text: "Note the economic cost of empire — maintaining the army and the bureaucracy is increasingly expensive", hint: "Commercial assessment of imperial economics", outcome: "neutral", result: "The empire's military and administrative costs are enormous and growing. Maintaining legions across thousands of miles of frontier, paying the bureaucracy that administers the provinces, funding the construction that makes Rome impressive — all of it requires revenue that eventually outpaces what the empire's economy can produce. The merchant who watches the currency being debased to pay army salaries sees the financial crisis coming before the military one.", statChange: { food: 5, power: 10, wealth: 15, standing: 10 } }

// ══════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════
let state = {
  screen: "art_open",
  role: null,
  chapterIndex: 0,
  pendingOutcome: null,
  stats: { food: 50, power: 50, wealth: 50, standing: 50 },
  timerInterval: null,
};

function go(s) { state.screen = s; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
function getRole() { return ROLES.find(r => r.id === state.role); }
function clamp(v) { return Math.max(0, Math.min(100, v)); }
function applyStats(change) { if (!change) return; for (let k in change) { if (state.stats[k] !== undefined) state.stats[k] = clamp(state.stats[k] + change[k]); } }
function statColor(v) { return v >= 60 ? "#6ABF6A" : v >= 35 ? "#E8C840" : "#E05050"; }
function isDead() { return state.stats.food <= 0; }

function powerResult(v) {
  if (v >= 75) return { icon: "🦅", title: "Power Used Wisely", text: "Your choices reflect what Rome's founders hoped the Republic would produce — power held accountable, checked by institutions, wielded in service of something larger than the person holding it. Cincinnatus would recognize your choices. Whether Rome's system was ultimately capable of sustaining this kind of wisdom across generations is the question its history answers." };
  if (v >= 50) return { icon: "⚖️", title: "Power Navigated", text: "Your choices navigated the reality of Roman power — its genuine achievements and its genuine costs — with reasonable care. Most Romans across most of the Republic and Empire lived this way: not the beneficiaries of the system's best impulses or its worst, but ordinary people trying to live well within a system that was neither fully just nor fully unjust." };
  if (v >= 25) return { icon: "🗡️", title: "Power Accumulated", text: "Your choices trended toward accumulating power rather than serving it. Rome's history is full of people who made exactly these choices — and the accumulation of those choices across generations is part of what transformed the Republic into the Empire. Every Rubicon crossed begins with someone deciding their interests outweigh the institution's." };
  return { icon: "🔥", title: "Power Without Accountability", text: "Your choices reflect the pattern Rome's founders feared most — power without meaningful accountability. The system they built to prevent this failed slowly, then quickly. Your choices illuminate why it failed: not because the system was badly designed, but because people with power found ways around it." };
}

function renderStats() {
  const defs = [
    { key: "food", label: "Food", icon: "🌾" },
    { key: "power", label: "Power", icon: "🦅" },
    { key: "wealth", label: "Wealth", icon: "⚓" },
    { key: "standing", label: "Standing", icon: "🏛️" },
  ];
  return `<div class="stats-row">${defs.map(d => {
    const v = state.stats[d.key];
    return `<div class="stat-box"><span class="stat-icon">${d.icon}</span><div class="stat-label">${d.label}</div><div class="stat-value" style="color:${statColor(v)}">${Math.round(v)}</div><div class="stat-track"><div class="stat-fill" style="width:${v}%;background:${statColor(v)}"></div></div></div>`;
  }).join("")}</div>`;
}

function renderProgress() {
  const dots = CHAPTERS.map((c, i) => `<div class="prog-dot ${i < state.chapterIndex ? 'done' : i === state.chapterIndex ? 'active' : ''}"></div>`).join("");
  return `<div class="progress-row">${dots}<span class="prog-label">Chapter ${state.chapterIndex + 1} of ${CHAPTERS.length}</span></div>`;
}

function screenArtOpen() {
  return `
    <div class="screen-label">Before we begin — look closely</div>
    <div class="screen-heading">Cave Canem — Beware of the Dog</div>
    <div class="art-frame">
      <img src="https://upload.wikimedia.org/wikipedia/commons/9/97/Cave_Canem_Poeta_Tr%C3%A1gico_04.jpg" alt="Cave Canem mosaic from Pompeii — a chained dog with Latin warning" onerror="this.style.display='none';document.getElementById('mosaic-fallback').style.display='block'" />
      <div id="mosaic-fallback" style="display:none;padding:2rem;text-align:center;color:var(--roman-red-light);font-family:Arial,sans-serif;font-size:13px">[Cave Canem mosaic — search "Cave Canem Pompeii mosaic" to view]</div>

function screenRoleSelect() {
  return `
    <div class="screen-label">Choose your role — your table decides together</div>
    <div class="screen-heading">Who are you in ancient Rome?</div>

    <div class="role-grid">
      ${ROLES.map(r => `<div class="role-card" onclick="selectRole('${r.id}')"><span class="rc-icon">${r.icon}</span><div class="rc-name">${r.name}</div><div class="rc-own"><strong>You control:</strong> ${r.own}</div><div class="rc-fear">⚠ You fear: ${r.fear}</div></div>`).join("")}
    </div>`;
}

function screenChapter() {
  const ch = CHAPTERS[state.chapterIndex];
  const role = getRole();
  const choices = ch.choices[state.role];
  const isPoison = ch.poisonRoles.includes(state.role);
  const histNote = ch.historyNote2
    ? `<div class="history-note">${ch.historyNote}</div><div class="history-note" style="margin-top:0.5rem">${ch.historyNote2}</div>`
    : `<div class="history-note">${ch.historyNote}</div>`;
  return `
    ${renderProgress()}
    ${renderStats()}
    <div class="role-badge"><span class="rb-icon">${role.icon}</span><div><div class="rb-name">${role.name}</div><div class="rb-desc">${role.desc}</div></div></div>
    <div class="screen-label">${ch.title}</div>
    <div class="screen-heading" style="font-size:18px">${ch.subtitle}</div>
    <div class="scene-text">${ch.scene}</div>
    <div class="role-context">${role.context[ch.id]}</div>
    ${isPoison ? `<div class="poison-note">⚠ There may be no good option for your role in this chapter. Choose the least difficult path — and notice what the available options reveal about your position in Roman civilization.</div>` : ""}
    ${histNote}
    <div class="choices-label">Discuss with your table — then choose:</div>
    <div class="choices">${choices.map((c, i) => `<button class="choice-btn" onclick="makeChoice(${i})"><div class="choice-text">${c.text}</div><div class="choice-hint">${c.hint}</div></button>`).join("")}</div>`;
}

function screenOutcome() {
  const ch = CHAPTERS[state.chapterIndex];
  const o = state.pendingOutcome;
  const outcomeClass = o.poison ? "outcome-poison" : `outcome-${o.outcome}`;
  const outcomeLabel = o.outcome === "good" ? "✓ What happened" : o.outcome === "bad" ? "✗ What happened" : o.poison ? "⚠ The constrained choice" : "→ What happened";
  return `
    ${renderProgress()}
    ${renderStats()}
    <div class="outcome-box ${outcomeClass}"><div class="outcome-label">${outcomeLabel}</div>${o.result}</div>
    ${ch.discussAfter
      ? `<button class="btn btn-roman" onclick="startDiscussion()">Continue to table discussion →</button>`
      : `<div class="journal-prompt"><strong>✏ Field Journal Prompt —</strong> answer before your teacher signals to continue:<br><br>${ch.journalPrompt}</div>
         <button class="btn btn-roman" onclick="advanceChapter()">${state.chapterIndex < CHAPTERS.length - 1 ? 'Continue →' : 'See how your story ends →'}</button>`}`;
}

function screenDiscussion() {
  const ch = CHAPTERS[state.chapterIndex];
  clearInterval(state.timerInterval);
  setTimeout(() => {
    let secs = 90;
    state.timerInterval = setInterval(() => {
      secs--;
      const el = document.getElementById("timer-display");
      const fill = document.getElementById("timer-fill");
      const btn = document.getElementById("cont-btn");
      if (el) el.textContent = `${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`;
      if (fill) fill.style.width = `${(secs/90)*100}%`;
      if (secs <= 0) { clearInterval(state.timerInterval); if (btn) btn.classList.add("ready"); }
    }, 1000);
  }, 100);
  return `
    ${renderProgress()}
    <div class="discussion-box">
      <div class="disc-header">⏱ Table Discussion — 90 seconds</div>
      <div class="disc-prompt">${ch.discussPrompt}</div>
      <div class="timer-row">
        <div class="timer-display" id="timer-display">1:30</div>
        <div class="timer-track"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
        <button class="continue-btn" id="cont-btn" onclick="afterDiscussion()">Continue →</button>
      </div>
    </div>
    <div class="journal-prompt"><strong>✏ Field Journal Prompt —</strong> write your response while the timer runs:<br><br>${ch.journalPrompt}</div>`;
}

function screenGameOver() {
  return `
    <div style="text-align:center;padding:2rem 1rem">
      <div style="font-size:48px;margin-bottom:1rem">🦅</div>

      ${renderStats()}
      <div class="history-note" style="text-align:left;margin-bottom:1.25rem">Even Rome — the civilization that built the most sophisticated food distribution system in the ancient world, that moved grain from Egypt to feed a city of a million people — could not always feed everyone within it. The aqueducts and grain doles that defined Roman civilization had limits that its leaders often refused to acknowledge.</div>
      <div class="journal-prompt" style="text-align:left">What does a food crisis in the world's most powerful empire tell you about the relationship between power and responsibility?</div><br>
      <button class="btn btn-roman" onclick="restart()">Start again as a different role</button>
    </div>`;
}

  return `

        <div class="achievement-card"><span class="ac-icon">🛣️</span><div class="ac-title">Engineering</div><div class="ac-desc">50,000 miles of roads, concrete construction, aqueducts delivering clean water — infrastructure so well built that some Roman roads and aqueducts still function today.</div></div>
        <div class="achievement-card"><span class="ac-icon">🌍</span><div class="ac-title">The Pax Romana</div><div class="ac-desc">Two centuries of relative peace across the Mediterranean world — enabling trade, cultural exchange, and the spread of ideas including Christianity.</div></div>
        <div class="achievement-card"><span class="ac-icon">📖</span><div class="ac-title">Latin and Romance Languages</div><div class="ac-desc">Latin became the foundation of French, Spanish, Portuguese, Italian, and Romanian — and the language of European scholarship for over a thousand years.</div></div>
        <div class="achievement-card"><span class="ac-icon">✝️</span><div class="ac-title">Christianity's Spread</div><div class="ac-desc">Roman roads, Roman peace, Roman commercial networks, and eventually Roman imperial support carried Christianity from a small community in Judea to a world religion.</div></div>
      </div>
    </div>
    <div class="discussion-questions">
      <h4>Class Discussion Questions</h4>
      <p>1. Rome built an entire system of government to prevent one person from having too much power. That system produced the Republic for five hundred years — and then produced emperors. What does that tell you about the relationship between good systems and the people who run them?</p>
      <p>2. The Tribune had the power to say "veto" — "I forbid" — to any law that harmed ordinary people. Where have you heard the word "veto" before? What does it tell you that modern governments still use this Roman concept?</p>
      <p>3. Rome built the most sophisticated government in the ancient world and still fell. What do you think was the most important cause — and does your answer depend on which role you played?</p>
      <p>4. The Twelve Tables established that written law applies to everyone — including the powerful. What happens when powerful people find ways around written law? What evidence from this campaign supports your answer?</p>
      <p>5. The Founders of the United States read Roman history carefully before designing the American government. After playing this campaign — what do you think they were most determined to avoid repeating?</p>
    </div>
    <button class="btn btn-roman" onclick="restart()">Play again as a different role</button>
    <button class="btn btn-secondary" onclick="restart()">Return to start</button>`;
}

function selectRole(id) { state.role = id; state.chapterIndex = 0; go("chapter"); }
function makeChoice(i) {
  const ch = CHAPTERS[state.chapterIndex];
  const choice = ch.choices[state.role][i];
  applyStats(choice.statChange);
  state.pendingOutcome = choice;
  if (isDead()) { go("gameover"); return; }
  go("outcome");
}
function startDiscussion() { go("discussion"); }
function afterDiscussion() { clearInterval(state.timerInterval); advanceChapter(); }
function advanceChapter() {
  state.pendingOutcome = null;
  if (state.chapterIndex < CHAPTERS.length - 1) { state.chapterIndex++; go("chapter"); }
  else { go("art_close"); }
}
function restart() {
  clearInterval(state.timerInterval);
  state = { screen: "art_open", role: null, chapterIndex: 0, pendingOutcome: null, stats: { food: 50, power: 50, wealth: 50, standing: 50 }, timerInterval: null };
  render(); window.scrollTo({ top: 0, behavior: "smooth" });
}

function render() {
  const el = document.getElementById("content");
  const screens = { art_open: screenArtOpen, role_select: screenRoleSelect, chapter: screenChapter, outcome: screenOutcome, discussion: screenDiscussion, gameover: screenGameOver, art_close: screenArtClose, ending: screenEnding };
  el.innerHTML = (screens[state.screen] || (() => "<p>Loading...</p>"))();
}
render();
</script>
