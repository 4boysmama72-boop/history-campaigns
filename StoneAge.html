<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Stone Age — The Story of Us</title>
<style>
  :root {
    --earth: #3B2A1A;
    --earth-mid: #5C3D1E;
    --earth-light: #8B5E3C;
    --ochre: #C4782A;
    --ochre-light: #F5D4A0;
    --bone: #F0E8D0;
    --bone-dark: #D4C4A0;
    --ash: #6A6A5A;
    --ash-light: #C8C4B0;
    --fire: #C84A1A;
    --fire-light: #F5D0C0;
    --green: #3A5C2A;
    --green-light: #C0D8B0;
    --shadow: #1A120A;
    --ink: #1A120A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #1A120A;
    color: var(--bone);
    min-height: 100vh;
  }

  #app {
    max-width: 780px;
    margin: 0 auto;
    padding: 1.5rem 1.5rem 3rem;
  }

  /* ── Header ── */
  .site-header {
    text-align: center;
    padding: 1.5rem 1rem 1rem;
    border-bottom: 2px solid var(--earth-mid);
    margin-bottom: 1.5rem;
  }
  .site-header .campaign-tag {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ochre);
    font-family: Arial, sans-serif;
    margin-bottom: 6px;
  }
  .site-header h1 {
    font-size: 28px;
    font-weight: bold;
    color: var(--bone);
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .site-header h2 {
    font-size: 15px;
    font-weight: normal;
    color: var(--ochre);
    font-family: Arial, sans-serif;
    font-style: italic;
  }

  /* ── Survival tracker ── */
  .tracker {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 1.25rem;
  }
  .tracker-stat {
    background: rgba(59, 42, 26, 0.6);
    border: 1.5px solid var(--earth-light);
    border-radius: 8px;
    padding: 8px 10px;
    text-align: center;
  }
  .tracker-icon { font-size: 18px; display: block; margin-bottom: 2px; }
  .tracker-label { font-size: 11px; color: var(--ochre); letter-spacing: 0.05em; text-transform: uppercase; font-family: Arial, sans-serif; }
  .tracker-status { font-size: 16px; font-weight: bold; margin: 3px 0; }
  .status-ok { color: #6ABF6A; }
  .status-low { color: #E8C050; }
  .status-crit { color: #E05050; }
  .tracker-bar-bg { height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-top: 4px; }
  .tracker-bar { height: 5px; border-radius: 3px; transition: width 0.5s, background 0.5s; }

  /* ── Role badge ── */
  .role-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(59,42,26,0.5);
    border: 1px solid var(--earth-light);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 1.25rem;
  }
  .role-badge .rb-icon { font-size: 24px; }
  .role-badge .rb-name { font-size: 15px; font-weight: bold; color: var(--ochre); }
  .role-badge .rb-desc { font-size: 12px; color: var(--ash-light); font-family: Arial, sans-serif; }

  /* ── Progress ── */
  .progress-row { display: flex; align-items: center; gap: 8px; margin-bottom: 1.25rem; }
  .prog-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(92,61,30,0.4); border: 1.5px solid var(--earth-light); }
  .prog-dot.active { background: var(--ochre); border-color: var(--ochre); }
  .prog-dot.done { background: var(--earth-light); border-color: var(--earth-light); }
  .prog-label { font-size: 11px; color: var(--ash-light); font-family: Arial, sans-serif; }

  /* ── Scene ── */
  .screen-label {
    font-size: 11px;
    color: var(--ochre);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-family: Arial, sans-serif;
    margin-bottom: 6px;
  }
  .screen-heading {
    font-size: 22px;
    font-weight: bold;
    color: var(--bone);
    margin-bottom: 1rem;
    line-height: 1.3;
  }
  .scene-text {
    font-size: 15px;
    line-height: 1.85;
    color: var(--bone-dark);
    margin-bottom: 1rem;
  }
  .role-context {
    background: rgba(196,120,42,0.15);
    border-left: 3px solid var(--ochre);
    border-radius: 0 6px 6px 0;
    padding: 10px 14px;
    font-size: 14px;
    font-style: italic;
    color: var(--ochre-light);
    margin-bottom: 1.25rem;
    line-height: 1.65;
    font-family: Arial, sans-serif;
  }

  /* ── Info boxes ── */
  .info-box {
    background: rgba(59,42,26,0.4);
    border-left: 3px solid var(--earth-light);
    border-radius: 0 6px 6px 0;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--bone-dark);
    margin-bottom: 1.25rem;
    line-height: 1.65;
    font-family: Arial, sans-serif;
  }
  .info-box strong { color: var(--bone); font-weight: 600; }

  .journal-prompt {
    background: rgba(196,120,42,0.12);
    border-left: 3px solid var(--ochre);
    border-radius: 0 6px 6px 0;
    padding: 12px 14px;
    font-size: 14px;
    color: var(--ochre-light);
    margin-bottom: 1.25rem;
    line-height: 1.7;
    font-family: Arial, sans-serif;
  }
  .journal-prompt strong { color: #F5D4A0; font-weight: 600; }

  .restart-box {
    background: rgba(200,74,26,0.15);
    border-left: 3px solid var(--fire);
    border-radius: 0 6px 6px 0;
    padding: 12px 14px;
    font-size: 14px;
    color: #F5C0B0;
    margin-bottom: 1.25rem;
    line-height: 1.7;
    font-family: Arial, sans-serif;
  }

  .discovery-box {
    background: rgba(58,92,42,0.2);
    border: 1.5px solid var(--green);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 1.25rem;
    font-size: 14px;
    color: var(--green-light);
    line-height: 1.7;
    font-family: Arial, sans-serif;
  }
  .discovery-box .disc-label { font-size: 11px; font-weight: bold; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; color: #8ADF8A; font-family: Arial, sans-serif; }

  /* ── Outcome boxes ── */
  .outcome-box {
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 1.25rem;
    font-size: 14px;
    line-height: 1.7;
    font-family: Arial, sans-serif;
  }
  .outcome-survived { background: rgba(58,92,42,0.2); border: 1.5px solid var(--green); color: var(--green-light); }
  .outcome-barely { background: rgba(196,120,42,0.15); border: 1.5px solid var(--ochre); color: var(--ochre-light); }
  .outcome-restart { background: rgba(200,74,26,0.2); border: 1.5px solid var(--fire); color: #F5C0B0; }
  .outcome-label { font-size: 11px; font-weight: bold; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; font-family: Arial, sans-serif; }

  /* ── Choices ── */
  .choices-label {
    font-size: 11px;
    color: var(--ash-light);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-family: Arial, sans-serif;
    margin-bottom: 8px;
  }
  .choices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1rem; }
  .choice-btn {
    background: rgba(59,42,26,0.5);
    border: 1.5px solid var(--earth-light);
    border-radius: 8px;
    padding: 12px 16px;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s;
    font-family: Georgia, serif;
  }
  .choice-btn:hover { background: rgba(92,61,30,0.6); border-color: var(--ochre); }
  .choice-btn .choice-text { font-size: 14px; color: var(--bone); line-height: 1.5; }
  .choice-btn .choice-hint { font-size: 11px; color: var(--ash-light); margin-top: 4px; font-family: Arial, sans-serif; font-style: italic; }
  .choice-btn .choice-cost { font-size: 11px; color: #E05050; margin-top: 3px; font-family: Arial, sans-serif; }

  /* ── Art screens ── */
  .art-frame {
    border: 2px solid var(--earth-light);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 1.25rem;
    background: var(--shadow);
  }
  .art-frame img {
    width: 100%;
    display: block;
    max-height: 340px;
    object-fit: cover;
    object-position: center;
  }
  .art-caption {
    padding: 8px 12px;
    font-size: 11px;
    color: var(--ochre);
    font-family: Arial, sans-serif;
    font-style: italic;
    background: rgba(59,42,26,0.8);
    line-height: 1.5;
  }

  .art-prompts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.25rem; }
  .art-prompt-box {
    background: rgba(59,42,26,0.4);
    border: 1px solid var(--earth-light);
    border-radius: 6px;
    padding: 10px 14px;
  }
  .art-prompt-box .apt-label { font-size: 11px; font-weight: bold; color: var(--ochre); text-transform: uppercase; letter-spacing: 0.06em; font-family: Arial, sans-serif; margin-bottom: 4px; }
  .art-prompt-box .apt-q { font-size: 14px; color: var(--bone-dark); font-style: italic; }

  /* ── Role select ── */
  .role-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 1rem; }
  .role-card {
    background: rgba(59,42,26,0.5);
    border: 2px solid var(--earth-light);
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .role-card:hover { background: rgba(92,61,30,0.6); border-color: var(--ochre); transform: translateY(-1px); }
  .role-card .rc-icon { font-size: 28px; margin-bottom: 6px; display: block; }
  .role-card .rc-name { font-size: 15px; font-weight: bold; color: var(--ochre); margin-bottom: 4px; }
  .role-card .rc-provides { font-size: 12px; color: var(--bone-dark); font-family: Arial, sans-serif; line-height: 1.5; margin-bottom: 4px; }
  .role-card .rc-fails { font-size: 11px; color: #E08060; font-family: Arial, sans-serif; font-style: italic; }

  /* ── Bridge / Ending ── */
  .bridge-box {
    background: rgba(59,42,26,0.4);
    border: 1.5px solid var(--ochre);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 1.25rem;
  }
  .bridge-box h3 { font-size: 18px; color: var(--ochre); margin-bottom: 8px; }
  .bridge-box p { font-size: 14px; color: var(--bone-dark); line-height: 1.75; font-family: Arial, sans-serif; margin-bottom: 10px; }
  .needs-list { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .needs-list li { font-size: 13px; color: var(--ochre-light); font-family: Arial, sans-serif; padding: 4px 0; border-bottom: 1px solid rgba(196,120,42,0.3); }
  .needs-list li::before { content: "→ "; color: var(--ochre); }

  .next-stop {
    text-align: center;
    padding: 1.5rem 1rem;
    border-top: 1px solid var(--earth-mid);
    margin-top: 1.25rem;
  }
  .next-stop h3 { font-size: 20px; color: var(--ochre); margin-bottom: 8px; }
  .next-stop p { font-size: 14px; color: var(--bone-dark); font-family: Arial, sans-serif; line-height: 1.7; }

  .discussion-questions {
    background: rgba(196,120,42,0.1);
    border: 1px solid var(--ochre);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 1.25rem;
  }
  .discussion-questions h4 { font-size: 12px; font-weight: bold; color: var(--ochre); text-transform: uppercase; letter-spacing: 0.06em; font-family: Arial, sans-serif; margin-bottom: 10px; }
  .discussion-questions p { font-size: 13px; color: var(--ochre-light); line-height: 1.7; font-family: Arial, sans-serif; margin-bottom: 8px; }

  /* ── Buttons ── */
  .btn {
    background: var(--earth-mid);
    color: var(--bone);
    border: none;
    border-radius: 8px;
    padding: 11px 22px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    font-family: Arial, sans-serif;
    transition: background 0.15s;
    margin-right: 8px;
    margin-bottom: 8px;
  }
  .btn:hover { background: var(--earth-light); }
  .btn-fire { background: var(--fire); color: var(--bone); }
  .btn-fire:hover { background: #A03A10; }
  .btn-secondary {
    background: transparent;
    color: var(--ochre);
    border: 1.5px solid var(--ochre);
  }
  .btn-secondary:hover { background: rgba(196,120,42,0.15); }

  .divider { height: 1px; background: var(--earth-mid); margin: 1.25rem 0; opacity: 0.5; }

  @media (max-width: 500px) {
    .role-grid { grid-template-columns: 1fr; }
    .tracker { grid-template-columns: repeat(3, 1fr); }
    .needs-list { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="site-header">
    <div class="campaign-tag">The Story of Us · Campaign 0.5</div>
    <h1>THE STONE AGE</h1>
    <h2>From Nomads to the Edge of Civilization</h2>
  </div>
  <div id="content"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
//  ROLES
// ══════════════════════════════════════════════════════════════
const ROLES = [
  {
    id: "hunter",
    name: "Hunter",
    icon: "🏹",
    desc: "You track and kill large game — the most dangerous and most celebrated work in the group.",
    provides: "Meat, hides for warmth, bones for tools. When the hunt works, the group eats well.",

    context: {

  },
  {

    desc: "You collect plants, berries, roots, and nuts — slower work than hunting, but more reliable.",
    provides: "Steady plant food, medicinal plants, knowledge of what grows where and when.",
    fails: "Gathering is seasonal. In winter or drought, there is almost nothing. The group cannot survive on gathering alone.",
    context: {

      ch6: "You know better than anyone what this land can and cannot provide. You have eaten every plant here."
    }
  },
  {
    id: "elder",
    name: "Elder",
    icon: "🧓",
    desc: "You hold the group's memory — migration routes, safe seasons, past disasters, old solutions.",
    provides: "Knowledge, decisions, stories that hold the group together when things get hard.",
    fails: "Your knowledge is of the past. When something new happens, you have no answer. And the group expects one.",
    context: {
      ch1: "You remember this land from two migrations ago. But that was fifteen years back. The rivers have shifted.",
      ch2: "You have seen hunts go wrong before. You know the difference between bad luck and a pattern.",
      ch3: "You remember a winter like this one. Half the group didn't make it. You have never told anyone.",
      ch4: "You have heard stories from other groups about plants that grow near old camps. You thought they were myths.",
      ch5: "You remember a story your grandmother told about a wolf that helped a hunting group find deer. You dismissed it.",
      ch6: "This decision will outlast you. Whatever you advise now, the group will carry forward long after you are gone."

  {

    context: {
      ch1: "You need clean water nearby. Contaminated water kills more people than any predator. You know this better than anyone.",
      ch2: "Someone got hurt on the hunt. You have done what you can. It may not be enough.",
      ch3: "Malnutrition is setting in. You can see it. The group looks thinner, slower, more vulnerable to illness.",
      ch4: "You recognized the plants immediately. Some of them have healing properties. This changes things.",
      ch5: "You have been watching the wolf. Its instincts could warn the group of danger before anyone gets sick or hurt.",
      ch6: "Settling means better access to medicinal plants. It also means diseases can spread through a group that doesn't move."
    }
  },
  {
    id: "toolmaker",
    name: "Tool Maker",
    icon: "🪨",
    desc: "You craft weapons, scrapers, needles, and implements from stone and bone.",
    provides: "Everything the group uses to hunt, prepare food, make clothing, and build shelter.",
    fails: "Without the right stone, you cannot make tools. Without tools, the hunter cannot hunt. Everything depends on your materials.",
    context: {
      ch1: "You need flint or obsidian nearby. A location without workable stone means your tools eventually break and cannot be replaced.",
      ch2: "The spear you made held. But the technique could be better. You have been thinking about a new design.",
      ch3: "You have been stretching every tool to its limit. Using broken scrapers. Sharpening blades that should have been replaced.",
      ch4: "The bone needle you made last season — you see the same material growing near the old camp. If they could stay, you could build a proper workshop.",
      ch5: "A domesticated animal means regular hides. Regular hides mean better tools, better clothing, better everything.",
      ch6: "A permanent camp means a permanent workshop. You could finally make things that last longer than one season."

  },
  {
    id: "scout",
    name: "Scout",
    icon: "👁️",
    desc: "You range ahead of the group to find food, water, safe paths, and danger.",

    fails: "You can only be in one place at a time. What you don't see can kill the group before you get back to warn them.",
    context: {
      ch1: "You have already been to three of these sites. You know things about them the others don't. But they don't always listen.",
      ch2: "You saw the animal sign two days ago. You warned them. They went anyway. Now someone is hurt.",
      ch3: "You have ranged further than anyone this season looking for game. The territory is emptier than you have ever seen it.",
      ch4: "You were the first to find the other group — the one who told you about planting seeds near camps. You almost didn't stop to talk.",

      ch6: "You have scouted further than anyone. You know what is out there. You also know what isn't."

// ══════════════════════════════════════════════════════════════
//  CHAPTERS
// ══════════════════════════════════════════════════════════════
const CHAPTERS = [
  {
    id: "ch1",
    number: 1,
    title: "Where Do We Go?",

        { text: "Follow the animal tracks northeast — there are clear signs of large game in that direction", hint: "Follow the food", cost: "Safety is unknown", outcome: "barely", result: "The game is there — for now. The territory is also unfamiliar and exposed. On the second night a predator moves through the camp. Nobody is killed but nobody sleeps either. You have food but you are burning energy on fear. This will catch up with you.", statChange: { food: 15, safety: -20, health: -5 } },
        { text: "Head toward the river valley you passed three seasons ago — there was water, game, and shelter", hint: "Return to known territory", cost: "Long journey, uncertain if conditions are the same", outcome: "survived", result: "Three days of hard travel. When you arrive, the river is lower than you remember — but it is there. There is game, there are edible plants, and there is a rock overhang that will shelter the group. The journey cost you, but you made the right call.", statChange: { food: 5, safety: 10, health: -10 } },
        { text: "Stay in this territory a little longer — push further from camp each day to see if game returns", hint: "Wait it out", cost: "Resources are already thin here", outcome: "restart", result: "The game does not return. By the time the group agrees to move, two people are too weak to travel at full speed. You have lost time you cannot get back. The Stone Age does not reward waiting when the land has already given you its answer. Move." }
      ],
      gatherer: [
        { text: "Move toward the forest edge to the south — you remember seeing diverse plants and a stream there last season", hint: "Follow the plant knowledge", cost: "Dense forest is harder to navigate and shelter in", outcome: "survived", result: "The forest edge delivers. The stream is clean. The plants include roots that will last through cold months if dried carefully. The hunting is harder here — the trees break sight lines — but the group will not starve. Your knowledge just saved everyone.", statChange: { food: 15, safety: 5, health: 5 } },
        { text: "Head for the open grassland to the west — easier to travel but you'll need to find water", hint: "Easier movement, uncertain water", cost: "No guaranteed water source", outcome: "barely", result: "The grassland is easy to cross but the water situation is constant stress. You find a small seasonal pool — but seasonal means unreliable. Everyone is managing but the edge of thirst is always there. It is wearing people down.", statChange: { food: 5, safety: 10, health: -15 } },
        { text: "Stay one more week to harvest everything left in this area before moving", hint: "Strip the territory before leaving", cost: "Delays the move while resources decline", outcome: "restart", result: "You harvest everything — but there is less than you thought. By the time you move, the season has shifted, the travel conditions are worse, and the group is already low on energy. Sometimes leaving later means arriving in worse shape. Move when the land tells you to." }
      ],

//  HELPERS
// ══════════════════════════════════════════════════════════════

function go(s) { state.screen = s; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }

function getRole() { return ROLES.find(r => r.id === state.role); }

function statusLabel(v) { return v === 2 ? "OK" : v === 1 ? "LOW" : "CRIT"; }
function statusClass(v) { return v === 2 ? "status-ok" : v === 1 ? "status-low" : "status-crit"; }
function statusBarColor(v) { return v === 2 ? "#6ABF6A" : v === 1 ? "#E8C050" : "#E05050"; }
function statusBarWidth(v) { return v === 2 ? "100%" : v === 1 ? "55%" : "15%"; }

function applyStatChange(change) {
  if (!change) return;
  if (change.food !== undefined) {
    if (change.food > 10) state.survival.food = Math.min(2, state.survival.food + 1);
    if (change.food < 0) state.survival.food = Math.max(0, state.survival.food - 1);
  }
  if (change.safety !== undefined) {
    if (change.safety > 10) state.survival.safety = Math.min(2, state.survival.safety + 1);
    if (change.safety < -10) state.survival.safety = Math.max(0, state.survival.safety - 1);
  }
  if (change.health !== undefined) {
    if (change.health > 10) state.survival.health = Math.min(2, state.survival.health + 1);
    if (change.health < -10) state.survival.health = Math.max(0, state.survival.health - 1);
  }
}

function renderTracker() {
  const stats = [
    { key: "food", icon: "🌾", label: "Food" },
    { key: "safety", icon: "🛡", label: "Safety" },
    { key: "health", icon: "❤", label: "Health" },
  ];
  return `<div class="tracker">${stats.map(s => {
    const v = state.survival[s.key];
    return `<div class="tracker-stat">
      <span class="tracker-icon">${s.icon}</span>
      <div class="tracker-label">${s.label}</div>
      <div class="tracker-status ${statusClass(v)}">${statusLabel(v)}</div>
      <div class="tracker-bar-bg"><div class="tracker-bar" style="width:${statusBarWidth(v)};background:${statusBarColor(v)}"></div></div>
    </div>`;
  }).join("")}</div>`;
}

function renderProgressDots() {
  const ch = state.chapterIndex;
  const dots = CHAPTERS.map((c, i) =>
    `<div class="prog-dot ${i < ch ? 'done' : i === ch ? 'active' : ''}"></div>`
  ).join("");
  return `<div class="progress-row">${dots}<span class="prog-label">Chapter ${ch + 1} of ${CHAPTERS.length}</span></div>`;
}

      <div class="art-caption">
        Chauvet-Pont d'Arc Cave · Ardèche, France · c. 34,000–36,000 BCE<br>
        Charcoal on limestone · Public Domain · UNESCO World Heritage Site
      </div>
    </div>

    <div class="scene-text">Someone made this. In a cave in what is now France. Roughly 36,000 years ago — before farming, before cities, before writing. Before almost everything we call civilization. This is where your story begins. Take 30 seconds of silence before writing anything.</div>

    <div class="art-prompts">
      <div class="art-prompt-box">
        <div class="apt-label">Prompt 1</div>
        <div class="apt-q">One thing I find interesting...</div>
      </div>
      <div class="art-prompt-box">
        <div class="apt-label">Prompt 2</div>
        <div class="apt-q">One thing that puzzles me...</div>
      </div>
      <div class="art-prompt-box">
        <div class="apt-label">Prompt 3</div>
        <div class="apt-q">One question I have for the creator...</div>
      </div>
    </div>

    <div class="info-box"><strong>Answer in your field journal.</strong> When your teacher gives the signal, continue.</div>

    <button class="btn btn-fire" onclick="go('role_select')">Begin the story →</button>`;
}

function screenRoleSelect() {
  return `
    <div class="screen-label">Your role in the group</div>
    <div class="screen-heading">Who are you?</div>
    <div class="scene-text">Your entire table plays the same role. Every role is equally essential. Every role has something only it can provide — and something it cannot do alone. Choose together.</div>
    <div class="role-grid">
      ${ROLES.map(r => `
        <div class="role-card" onclick="selectRole('${r.id}')">
          <span class="rc-icon">${r.icon}</span>
          <div class="rc-name">${r.name}</div>
          <div class="rc-provides"><strong>You provide:</strong> ${r.provides}</div>
          <div class="rc-fails">If you fail: ${r.fails}</div>
        </div>`).join("")}
    </div>`;
}

function screenChapter() {
  const ch = CHAPTERS[state.chapterIndex];
  const role = getRole();
  const choices = ch.choices[state.role];
  return `
    ${renderProgressDots()}
    ${renderTracker()}
    <div class="role-badge">
      <span class="rb-icon">${role.icon}</span>
      <div>
        <div class="rb-name">${role.name}</div>
        <div class="rb-desc">${role.desc}</div>
      </div>
    </div>
    <div class="screen-label">${ch.title}</div>
    <div class="screen-heading" style="font-size:18px">${ch.subtitle}</div>
    <div class="scene-text">${ch.scene}</div>
    <div class="role-context">${role.context[ch.id]}</div>
    <div class="choices-label">Discuss with your table — then choose:</div>
    <div class="choices">
      ${choices.map((c, i) => `
        <button class="choice-btn" onclick="makeChoice(${i})">
          <div class="choice-text">${c.text}</div>
          <div class="choice-hint">${c.hint}</div>
          <div class="choice-cost">⚠ Cost: ${c.cost}</div>
        </button>`).join("")}
    </div>`;
}

function screenOutcome() {
  const ch = CHAPTERS[state.chapterIndex];
  const o = state.pendingOutcome;
  const isRestart = o.outcome === "restart";
  return `
    ${renderProgressDots()}
    ${renderTracker()}
    <div class="outcome-box outcome-${isRestart ? 'restart' : o.outcome}">
      <div class="outcome-label">
        ${isRestart ? "✗ Your group did not survive this" : o.outcome === "survived" ? "✓ Your group survived — at a cost" : "→ Your group barely made it"}
      </div>
      ${o.result}
    </div>
    ${isRestart
      ? `<div class="restart-box">In the Stone Age, most choices were bad choices. The question was which bad choice cost you the least. Try this chapter again — your Survival Tracker stays where it is.</div>
         <button class="btn" onclick="retryChapter()">Try this chapter again →</button>`
      : `<div class="journal-prompt"><strong>✏ Field Journal Prompt —</strong> answer before your teacher signals to continue:<br><br>${ch.journalPrompt}</div>
         <button class="btn btn-fire" onclick="advanceChapter()">${state.chapterIndex < CHAPTERS.length - 1 ? 'Continue →' : 'See how your story ends →'}</button>`
    }`;
}

function screenArtClose() {
  return `
    <div class="screen-label">The same painting — new eyes</div>
    <div class="screen-heading">Lascaux Cave, France<br><span style="font-size:16px;color:var(--ochre)">Approximately 17,000 years old</span></div>

    <div class="art-frame">
      <img src="https://upload.wikimedia.org/wikipedia/commons/1/1e/Lascaux_painting.jpg"
           alt="Lascaux Cave Hall of Bulls — approximately 17,000 years old"
           onerror="this.style.display='none';document.getElementById('lascaux-fallback').style.display='block'" />
      <div id="lascaux-fallback" style="display:none;padding:2rem;text-align:center;color:var(--ochre);font-family:Arial,sans-serif;font-size:13px">
        [Lascaux Cave Hall of Bulls — search "Lascaux Hall of Bulls" to view]
      </div>
      <div class="art-caption">
        Lascaux Cave · Dordogne, France · c. 17,000 BCE<br>
        Pigment on limestone · Public Domain · UNESCO World Heritage Site
      </div>
    </div>

    <div class="scene-text">This painting is from a different cave — Lascaux, in France. It is 17,000 years old. The Chauvet painting you looked at when you started this campaign is 36,000 years old. These two paintings are separated by 19,000 years — more time than separates Lascaux from today.</div>

    <div class="scene-text">Use your three prompts in your field journal:</div>

    <div class="art-prompts">
      <div class="art-prompt-box">
        <div class="apt-label">Prompt 1</div>
        <div class="apt-q">One thing I find interesting...</div>
      </div>
      <div class="art-prompt-box">
        <div class="apt-label">Prompt 2</div>
        <div class="apt-q">One thing that puzzles me...</div>
      </div>
      <div class="art-prompt-box">
        <div class="apt-label">Prompt 3</div>
        <div class="apt-q">One question I have for the creator...</div>
      </div>
    </div>

    <div class="journal-prompt">
      <strong>Closing journal question:</strong> You looked at a 36,000-year-old painting at the start. Now you are looking at a 17,000-year-old painting at the end. Both were made by people living the kind of life your group just lived through. What is different about these two paintings — and what does that difference tell you about what changed in those 19,000 years?
    </div>

    <button class="btn btn-fire" onclick="go('ending')">See what your group built →</button>`;
}

function screenEnding() {
  const role = getRole();
  const needs = [
    "Shelter that lasts more than a season",
    "A way to store food through winter",
    "Protection from other groups",
    "A way to make decisions together",
    "A way to remember things",
    "Someone to heal the sick",
    "A way to trade with neighbors",
    "Tools that don't have to be rebuilt constantly",
    "A system for who does what work",
    "Something to explain the floods and storms",
  ];

  return `
    <div class="screen-label">Your group has stopped moving</div>
    <div class="screen-heading">The Edge of Something New</div>

    ${renderTracker()}

    <div class="bridge-box">
      <h3>Your group chose to stay</h3>
      <p>You are exhausted. Uncertain. But something is different now. The river is close. The soil is dark and rich. The garden is real. The wolf is sleeping at the fire's edge. Someone has started stacking stones.</p>
      <p>You don't know yet what any of this means. But your group is not moving. And that has never been true before.</p>
      <p><strong>Here is what your group needs now that moving is no longer the answer:</strong></p>
      <ul class="needs-list">
        ${needs.map(n => `<li>${n}</li>`).join("")}
      </ul>
      <p style="margin-top:12px;font-size:13px;color:var(--ochre-light)">Write your group's own version of this list in your field journal — add to it, change it, make it yours. Then keep it.</p>
    </div>

    <div class="discussion-questions">
      <h4>Class Discussion Questions</h4>
      <p>1. Every choice in this campaign cost something — even the good ones. What does that tell you about what Stone Age survival actually felt like?</p>
      <p>2. Agriculture and domestication were both discovered by accident. Why does that matter — does it change how impressive they are?</p>
      <p>3. Look at your needs list. Which of those things did Mesopotamia figure out first?</p>
      <p>4. The Chauvet painting is 36,000 years old. The Lascaux painting is 17,000 years old. What changed between them — and what stayed the same?</p>
      <p>5. Your group stopped moving. What do you think the first generation born in a permanent settlement was like — compared to the generation that made the decision?</p>
    </div>

    <div class="next-stop">
      <h3>Next stop: Mesopotamia</h3>
      <p>Everything on your needs list? Someone figured it out. That is what we study next.</p>
    </div>

    <button class="btn btn-fire" onclick="restart()">Play again as a different role</button>
    <button class="btn btn-secondary" onclick="restart()">Return to beginning</button>`;
}

// ══════════════════════════════════════════════════════════════
//  ACTIONS
// ══════════════════════════════════════════════════════════════

function selectRole(id) {
  state.role = id;
  state.chapterIndex = 0;
  go("chapter");
}

function makeChoice(i) {
  const ch = CHAPTERS[state.chapterIndex];
  const choice = ch.choices[state.role][i];
  state.pendingOutcome = choice;
  if (choice.outcome !== "restart") {
    applyStatChange(choice.statChange);
  }
  go("outcome");
}

function retryChapter() {
  state.pendingOutcome = null;
  go("chapter");
}

function advanceChapter() {
  state.pendingOutcome = null;
  if (state.chapterIndex < CHAPTERS.length - 1) {
    state.chapterIndex++;
    go("chapter");
  } else {
    go("art_close");
  }
}

function restart() {
  state = {
    screen: "art_open",
    role: null,
    chapterIndex: 0,
    pendingOutcome: null,
    survival: { food: 2, safety: 2, health: 2 },
    restartChapter: false,
  };
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ══════════════════════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════════════════════

function render() {
  const el = document.getElementById("content");
  const screens = {
    art_open:    screenArtOpen,
    role_select: screenRoleSelect,
    chapter:     screenChapter,
    outcome:     screenOutcome,
    art_close:   screenArtClose,
    ending:      screenEnding,
  };
  el.innerHTML = (screens[state.screen] || (() => "<p>Loading...</p>"))();
}

render();
</script>
</body>
</html>
